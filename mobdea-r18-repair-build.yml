name: Mobdea R18 Critical Repair + Debug APK

on:
  push:
    branches: [v14-working]
    paths:
      - .github/workflows/mobdea-r18-repair-build.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mobdea-r18-repair-v14-working
  cancel-in-progress: false

jobs:
  repair-build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout v14-working
        uses: actions/checkout@v4
        with:
          ref: v14-working
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Apply verified R18 viewport/fullscreen + native asset repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64

          def write_b64(path, payload):
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(base64.b64decode(payload))

          write_b64('src/services/viewport.js', '')
          write_b64('src/main.jsx', '')
          write_b64('src/styles/r18-classmode-viewport-fix.css', '')
          write_b64('android/app/src/main/java/com/mobdea/education/MainActivity.java', '')

          # PDF/PPTX/OCR all pass through this native staging bridge.
          # Capacitor JS numeric values are not guaranteed to arrive as java.lang.Long,
          # so getLong() can silently fall back to zero. Parse as Double and round safely.
          asset_path = Path('android/app/src/main/java/com/mobdea/education/assets/MobdeaNativeAssetPlugin.java')
          asset = asset_path.read_text(encoding='utf-8')
          old = 'long expectedSize = Math.max(0L, call.getLong("size", 0L));'
          count = asset.count(old)
          if count not in (0, 2):
              raise SystemExit(f'Unexpected NativeAsset size parser occurrence count: {count}')
          if count == 2:
              asset = asset.replace(old, 'long expectedSize = readAssetSize(call);')

          helper = '''    private long readAssetSize(PluginCall call) {
              Double value = call.getDouble("size", 0d);
              if (value == null || value.isNaN() || value.isInfinite()) return 0L;
              return Math.max(0L, Math.round(value));
          }

          '''
          if 'private long readAssetSize(PluginCall call)' not in asset:
              marker = '    private File assetDirectory() throws Exception {\n'
              if marker not in asset:
                  raise SystemExit('Could not place NativeAsset readAssetSize helper.')
              asset = asset.replace(marker, helper + marker, 1)

          if asset.count('long expectedSize = readAssetSize(call);') != 2:
              raise SystemExit('NativeAsset size parser repair did not apply to begin and finish.')
          asset_path.write_text(asset, encoding='utf-8')

          checks = {
              'src/main.jsx': "import './styles/r18-classmode-viewport-fix.css';",
              'src/services/viewport.js': '--mobdea-app-height',
              'src/styles/r18-classmode-viewport-fix.css': '.classmode-viewport.stage-focus-mode',
              'android/app/src/main/java/com/mobdea/education/MainActivity.java': 'controller.hide(WindowInsetsCompat.Type.systemBars())',
              str(asset_path): 'call.getDouble("size", 0d)',
          }
          for path, needle in checks.items():
              data = Path(path).read_text(encoding='utf-8')
              if needle not in data:
                  raise SystemExit(f'Missing repair marker in {path}: {needle}')
          PY

      - name: Show repair diff
        run: git diff --check && git status --short

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Run JavaScript tests (diagnostic)
        id: js_tests
        continue-on-error: true
        run: npm run test

      - name: Run source lint (diagnostic)
        id: js_lint
        continue-on-error: true
        run: npm run lint

      - name: Run format check (diagnostic)
        id: format_check
        continue-on-error: true
        run: npm run format:check

      - name: Production web build
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Assemble debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug --stacktrace

      - name: Android unit tests (diagnostic)
        id: android_tests
        continue-on-error: true
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest --stacktrace

      - name: Android lint (diagnostic)
        id: android_lint
        continue-on-error: true
        working-directory: android
        run: ./gradlew --no-daemon lintDebug --stacktrace

      - name: Verify APK exists
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk | tee /tmp/mobdea-apk.sha256

      - name: Commit repaired source after successful APK build
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/services/viewport.js \
            src/main.jsx \
            src/styles/r18-classmode-viewport-fix.css \
            android/app/src/main/java/com/mobdea/education/MainActivity.java \
            android/app/src/main/java/com/mobdea/education/assets/MobdeaNativeAssetPlugin.java
          if git diff --cached --quiet; then
            echo "Repair source already present; nothing to commit."
          else
            git commit -m "fix: repair class mode viewport fullscreen and native assets"
            git push origin HEAD:v14-working
          fi

      - name: Upload repaired debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mobdea-r18-critical-repair-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Repair/build summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Mobdea R18 critical repair"
            echo "- Web build: required to pass"
            echo "- Android assembleDebug: required to pass"
            echo "- JS tests: ${{ steps.js_tests.outcome }}"
            echo "- JS lint: ${{ steps.js_lint.outcome }}"
            echo "- Format check: ${{ steps.format_check.outcome }}"
            echo "- Android unit tests: ${{ steps.android_tests.outcome }}"
            echo "- Android lint: ${{ steps.android_lint.outcome }}"
            if [ -f /tmp/mobdea-apk.sha256 ]; then
              echo "- APK SHA256: $(cut -d' ' -f1 /tmp/mobdea-apk.sha256)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
