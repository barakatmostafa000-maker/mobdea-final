name: R20 SAFE FROM LAST GREEN R19 V6 FIX9

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/R20_SAFE_FROM_LAST_GREEN_R19_FIX9.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: r20-safe-from-last-green-r19-v6-fix9
  cancel-in-progress: true

env:
  R19_BASE_COMMIT: cd7e7cd597af23ca1169e1f19c3ac954727c3f2d
  RUN17_RUN_ID: "32697570904"
  RUN17_ARTIFACT_NAME: mobdea-r19-run17-full-result
  RUN17_PATCH_SHA256: 6bc7ddab1e908916cf1bb01c59a4aff463c33220931f82c314c27178ce7d4270
  RUN17_FIXED_TAR_SHA256: d7b7ef0f92f4396e0bdb3cfdb55d19ca3669564ed2ab61a6e2b98d74352dd1b0
  LAST_GREEN_RUN_ID: "32714480207"
  LAST_GREEN_ARTIFACT_NAME: mobdea-r19-final-01-14-fix8-13-v118
  R20_SOURCE_TAR_SHA256: 03804eefcfa7b8c2284dfb56303b7ff187af672036f041f41f267dd4283f653c
  EXPECTED_VERSION_NAME: "10.14.1"
  EXPECTED_VERSION_CODE: "118"

jobs:
  build-r20-final:
    runs-on: ubuntu-24.04
    timeout-minutes: 300

    steps:
      - name: Checkout exact R19 baseline
        uses: actions/checkout@v4
        with:
          ref: ${{ env.R19_BASE_COMMIT }}
          fetch-depth: 1

      - name: Verify exact clean baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$R19_BASE_COMMIT"
          test -z "$(git status --porcelain)"
          test -f package.json
          test -f package-lock.json
          test -d android
          echo "Exact R19 baseline verified: $R19_BASE_COMMIT"

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          for attempt in 1 2 3; do
            if sdkmanager "platform-tools" "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.0"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Android SDK package installation failed."
              exit 1
            fi
            sleep $((attempt * 5))
          done
          test -s "$SDK/platforms/android-35/android.jar"
          test -x "$SDK/build-tools/34.0.0/aapt2"
          test -x "$SDK/build-tools/35.0.0/aapt"
          test -x "$SDK/build-tools/35.0.0/apksigner"
          test -x "$SDK/build-tools/35.0.0/zipalign"
          echo "$SDK/build-tools/35.0.0" >> "$GITHUB_PATH"
          printf 'sdk.dir=%s\n' "$SDK" > android/local.properties

      - name: Download reviewed RUN17 repair artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.RUN17_ARTIFACT_NAME }}
          run-id: ${{ env.RUN17_RUN_ID }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: /tmp/r19-run17

      - name: Verify and apply reviewed Repairs 01-14 final diff
        shell: bash
        run: |
          set -euo pipefail
          PATCH="/tmp/r19-run17/R19_RUN17_FINAL.patch"
          test -s "$PATCH"
          ACTUAL="$(sha256sum "$PATCH" | awk '{print $1}')"
          test "$ACTUAL" = "$RUN17_PATCH_SHA256"

          git apply --check "$PATCH"
          git apply "$PATCH"

          FIXED_TAR="/tmp/r19-run17/R19_RUN17_FIXED_FILES.tar.gz"
          test -s "$FIXED_TAR"
          TAR_ACTUAL="$(sha256sum "$FIXED_TAR" | awk '{print $1}')"
          test "$TAR_ACTUAL" = "$RUN17_FIXED_TAR_SHA256"

          tar -xzf "$FIXED_TAR" -C . \
            tests/run15-build-readiness.test.mjs \
            tests/run15-runtime-contract.test.mjs

          test -s tests/run15-build-readiness.test.mjs
          test -s tests/run15-runtime-contract.test.mjs
          git add -N tests/run15-build-readiness.test.mjs tests/run15-runtime-contract.test.mjs

          git diff --check

          node - <<'NODE_VERSION'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (pkg.version !== process.env.EXPECTED_VERSION_NAME) {
            throw new Error(`Unexpected versionName: ${pkg.version}`);
          }
          if (String(pkg.mobdea?.versionCode) !== process.env.EXPECTED_VERSION_CODE) {
            throw new Error(`Unexpected versionCode: ${pkg.mobdea?.versionCode}`);
          }
          NODE_VERSION

      - name: Close RUN18 Attendance WhatsApp root cause
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_RUN18_ROOT'
          from pathlib import Path
          import re

          notifications = Path("src/services/notifications.js")
          attendance = Path("src/pages/Attendance.jsx")
          if not notifications.is_file() or not attendance.is_file():
              raise SystemExit("Required Attendance/notifications source missing")

          source = notifications.read_text(encoding="utf-8")
          if not re.search(r"\bexport\s+(?:async\s+)?function\s+sendAbsenceWhatsApp\b", source):
              source = source.rstrip() + r'''

          // RUN18_ATTENDANCE_WHATSAPP_EXPORT_CLOSURE_V1
          export function sendAbsenceWhatsApp(student = {}, session = {}, date = '') {
            const rawPhone = String(student?.guardianPhone || '').trim();
            const normalized = rawPhone.replace(/\D/g, '').replace(/^0/, '20');
            if (!normalized) {
              return { ok: false, message: 'لا يوجد رقم هاتف مسجل لولي الأمر.' };
            }
            const safeDate = String(date || new Date().toISOString().slice(0, 10));
            const message = cleanWhatsAppMessage(
              buildAttendanceMessage(student?.name || 'الطالب', 'absent', safeDate),
            );
            if (typeof window === 'undefined' || typeof window.open !== 'function') {
              return { ok: false, message: 'فتح واتساب متاح من التطبيق أو المتصفح فقط.' };
            }
            const url = `https://wa.me/${normalized}?text=${encodeURIComponent(message)}`;
            window.open(url, '_blank', 'noopener,noreferrer');
            return { ok: true, message: `تم فتح واتساب لإبلاغ ولي أمر ${student?.name || 'الطالب'}.` };
          }
          '''
              notifications.write_text(source, encoding="utf-8")

          attendance_source = attendance.read_text(encoding="utf-8")
          if "sendAbsenceWhatsApp" not in attendance_source:
              raise SystemExit("Attendance no longer calls sendAbsenceWhatsApp")
          updated = notifications.read_text(encoding="utf-8")
          if not re.search(r"\bexport\s+(?:async\s+)?function\s+sendAbsenceWhatsApp\b", updated):
              raise SystemExit("sendAbsenceWhatsApp export was not created")
          PY_RUN18_ROOT

          node --check src/services/notifications.js
          git diff --check

      - name: Download actual last green R19 V6 artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.LAST_GREEN_ARTIFACT_NAME }}
          run-id: ${{ env.LAST_GREEN_RUN_ID }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: /tmp/r19-last-green

      - name: Restore exact last green V6 source closures
        shell: bash
        run: |
          set -euo pipefail

          for f in \
            /tmp/r19-last-green/ClassMode.V6.jsx \
            /tmp/r19-last-green/MapChallenge.V6.jsx \
            /tmp/r19-last-green/AppShell.V6.jsx \
            /tmp/r19-last-green/R19-FINAL-RUNTIME-FIXES.css \
            /tmp/r19-last-green/REGRESSION-CONTRACT-COMPATIBILITY.patch; do
            test -s "$f" || { echo "::error::Missing last-green artifact file: $f"; exit 1; }
          done

          cp /tmp/r19-last-green/ClassMode.V6.jsx src/pages/ClassMode.jsx
          cp /tmp/r19-last-green/MapChallenge.V6.jsx src/pages/MapChallenge.jsx
          cp /tmp/r19-last-green/AppShell.V6.jsx src/components/AppShell.jsx
          cp /tmp/r19-last-green/R19-FINAL-RUNTIME-FIXES.css src/styles/r19-final-runtime-fixes.css

          python3 - <<'PY_V6_IMPORT'
          from pathlib import Path

          main = Path("src/main.jsx")
          source = main.read_text(encoding="utf-8")
          final_import = "import './styles/r19-final-runtime-fixes.css';"
          anchor = "import './styles/project14-youtube-auto-sync.css';"

          source = source.replace(final_import + "\n", "").replace(final_import, "")
          if anchor not in source:
              raise SystemExit("Last-green CSS import anchor missing")
          source = source.replace(anchor, anchor + "\n" + final_import, 1)
          main.write_text(source, encoding="utf-8")

          check = main.read_text(encoding="utf-8")
          if check.find(final_import) < check.find(anchor):
              raise SystemExit("Last-green CSS precedence verification failed")
          PY_V6_IMPORT

          git apply --check /tmp/r19-last-green/REGRESSION-CONTRACT-COMPATIBILITY.patch
          git apply /tmp/r19-last-green/REGRESSION-CONTRACT-COMPATIBILITY.patch

          git diff --check

      - name: Validate and repair recovered Android Gradle structure
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_GRADLE_STRUCTURE'
          from pathlib import Path

          path = Path('android/app/build.gradle')
          text = path.read_text(encoding='utf-8')
          bad = "    lint {\n        abortOnError true\n        checkReleaseBuilds true\n        warningsAsErrors false\n    }\n    }\n}\n\nrepositories {"
          good = "    lint {\n        abortOnError true\n        checkReleaseBuilds true\n        warningsAsErrors false\n    }\n}\n\nrepositories {"

          if bad in text:
              path.write_text(text.replace(bad, good, 1), encoding='utf-8')
          elif good not in text:
              if 'android {' not in text or 'defaultConfig {' not in text:
                  raise SystemExit('Android Gradle structure is not recognized')
          PY_GRADLE_STRUCTURE

          git diff --check

      - name: Last green R19 V6 source guards
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY_R19_GUARDS'
          from pathlib import Path

          class_source = Path("src/pages/ClassMode.jsx").read_text(encoding="utf-8")
          related = class_source.find("const relatedQuestions = useMemo")
          project12 = class_source.find("const [project12QuestionScope")
          if related < 0 or project12 < 0 or related >= project12:
              raise SystemExit("ClassMode TDZ guard failed")

          main_source = Path("src/main.jsx").read_text(encoding="utf-8")
          if "r19-final-runtime-fixes.css" not in main_source:
              raise SystemExit("Final runtime stylesheet import missing")

          map_source = Path("src/pages/MapChallenge.jsx").read_text(encoding="utf-8")
          keys = map_source.split("const coreRegionKeys", 1)[1].split("];", 1)[0]
          if '"nile"' not in keys:
              raise SystemExit("Map Challenge Nile tab guard failed")

          shell_source = Path("src/components/AppShell.jsx").read_text(encoding="utf-8")
          if "document.querySelector('.app-shell-v103:not(.lesson-mode-shell) > .app-content')" not in shell_source:
              raise SystemExit("AppShell content-scroll reset guard failed")

          runtime_css = Path("src/styles/r19-final-runtime-fixes.css").read_text(encoding="utf-8")
          for marker in (
              "R19_FINAL_RUNTIME_FIXES_V2",
              ".map-challenge-pro > .map-game-layout",
              ".map-challenge-pro .map-game-question-panel",
              ".dashboard-v103 .dashboard-reference-copy p",
              "overflow-y: auto !important",
          ):
              if marker not in runtime_css:
                  raise SystemExit(f"R19 V6 CSS marker missing: {marker}")
          PY_R19_GUARDS

          git diff --check

      - name: Fetch and verify fixed R20 source package
        shell: bash
        run: |
          set -euo pipefail

          REPO="${GITHUB_REPOSITORY}"
          REF="${GITHUB_SHA}"
          BASE_URL="https://raw.githubusercontent.com/${REPO}/${REF}"

          rm -rf /tmp/r20-parts
          mkdir -p /tmp/r20-parts

          for n in 01 02 03 04; do
            FILE="R20_SOURCE_RELEASE_FIXED2.tar.gz.b64.part${n}"
            curl --fail --location --retry 4 --retry-all-errors \
              --connect-timeout 20 --max-time 120 \
              "${BASE_URL}/${FILE}" \
              --output "/tmp/r20-parts/${FILE}"
            test -s "/tmp/r20-parts/${FILE}"
          done

          cat /tmp/r20-parts/R20_SOURCE_RELEASE_FIXED2.tar.gz.b64.part* \
            | base64 -d > /tmp/R20_SOURCE_RELEASE.tar.gz

          ACTUAL="$(sha256sum /tmp/R20_SOURCE_RELEASE.tar.gz | awk '{print $1}')"
          echo "R20 source expected: $R20_SOURCE_TAR_SHA256"
          echo "R20 source actual:   $ACTUAL"
          test "$ACTUAL" = "$R20_SOURCE_TAR_SHA256"

          tar -tzf /tmp/R20_SOURCE_RELEASE.tar.gz > /tmp/r20-tar-list.txt
          test -s /tmp/r20-tar-list.txt

      - name: Apply R20 safely on protected R19 V6
        shell: bash
        run: |
          set -euo pipefail
          
          rm -rf /tmp/r20-safe-overlay
          mkdir -p /tmp/r20-safe-overlay
          tar -xzf /tmp/R20_SOURCE_RELEASE.tar.gz -C /tmp/r20-safe-overlay
          
          echo "R20 archive extracted to /tmp only. R19 tree is still protected."
          
          python3 - <<'PY_SAFE_R20_MERGE'
          from pathlib import Path
          import shutil
          import re
          import base64
          
          root = Path(".")
          overlay = Path("/tmp/r20-safe-overlay")
          
          def copy_file(rel):
              src = overlay / rel
              dst = root / rel
              if not src.is_file():
                  raise SystemExit(f"Missing R20 overlay file: {rel}")
              dst.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(src, dst)
          
          for pattern in [
              "scripts/r20*",
              "src/config/r20*",
              "src/services/r20*",
              "src/styles/r20*",
              "tests/r20*.test.mjs",
          ]:
              for src in overlay.glob(pattern):
                  if not src.is_file():
                      continue
                  rel = src.relative_to(overlay)
                  dst = root / rel
                  dst.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(src, dst)
          
          copy_file("android/app/src/main/java/com/mobdea/education/ocr/R20PageOcrPlugin.java")
          copy_file("cloud-worker/r20PortalAccounts.js")
          
          r19_css = root / "src/styles/r19-final-runtime-fixes.css"
          if not r19_css.is_file():
              copy_file("src/styles/r19-final-runtime-fixes.css")
          
          path = root / "android/app/src/main/java/com/mobdea/education/MainActivity.java"
          text = path.read_text(encoding="utf-8")
          if "import com.mobdea.education.ocr.R20PageOcrPlugin;" not in text:
              anchor = "import com.mobdea.education.ocr.MobdeaPdfOcrPlugin;"
              if anchor not in text:
                  raise SystemExit("R19 MainActivity OCR import anchor is missing")
              text = text.replace(anchor, anchor + "\nimport com.mobdea.education.ocr.R20PageOcrPlugin;", 1)
          if "registerPlugin(R20PageOcrPlugin.class);" not in text:
              anchor = "        registerPlugin(MobdeaPdfOcrPlugin.class);"
              if anchor not in text:
                  raise SystemExit("R19 MainActivity OCR registration anchor is missing")
              text = text.replace(anchor, anchor + "\n        registerPlugin(R20PageOcrPlugin.class);", 1)
          if "R20_FIX01_TABLET_MEDIA_WEBVIEW_V1" not in text:
              anchor = "        super.onCreate(savedInstanceState);"
              if anchor not in text:
                  raise SystemExit("R19 MainActivity onCreate anchor is missing")
              block = """
                  // R20_FIX01_TABLET_MEDIA_WEBVIEW_V1
                  if (getBridge() != null && getBridge().getWebView() != null) {
                      getBridge().getWebView().post(() -> {
                          android.webkit.WebSettings settings =
                              getBridge().getWebView().getSettings();
                          settings.setMediaPlaybackRequiresUserGesture(false);
                          settings.setDomStorageEnabled(true);
                          settings.setAllowContentAccess(true);
                          settings.setAllowFileAccess(true);
                          if (android.os.Build.VERSION.SDK_INT >=
                              android.os.Build.VERSION_CODES.LOLLIPOP) {
                              settings.setMixedContentMode(
                                  android.webkit.WebSettings.MIXED_CONTENT_COMPATIBILITY_MODE
                              );
                          }
                      });
                  }
          """
              text = text.replace(anchor, anchor + block, 1)
          path.write_text(text, encoding="utf-8")
          
          path = root / "cloud-worker/worker.js"
          text = path.read_text(encoding="utf-8")
          if "maybeHandleR20PortalAccounts" not in text:
              text = "import { maybeHandleR20PortalAccounts } from './r20PortalAccounts.js';\n" + text
          if "const R20_LEGACY_WORKER =" not in text:
              token = "export default {"
              index = text.find(token)
              if index < 0:
                  raise SystemExit("R19 worker export default was not found")
              text = text[:index] + "const R20_LEGACY_WORKER = {" + text[index + len(token):]
              text += """
          
          /* R20_FIX04_WORKER_WRAPPER_V1
           * SAFE MERGE: the complete R19 worker remains the default handler.
           */
          export default {
            async fetch(request, env, ctx) {
              const accountResponse = await maybeHandleR20PortalAccounts(request, env);
              if (accountResponse) return accountResponse;
              return R20_LEGACY_WORKER.fetch(request, env, ctx);
            },
          };
          """
          path.write_text(text, encoding="utf-8")
          
          path = root / "src/services/ocrQuestionParser.js"
          text = path.read_text(encoding="utf-8")
          if "block.sourceAnswer = answer;" not in text:
              old = "  let answer = normalizeOcrText(rawAnswer);\n  if (!answer) return;"
              new = (
                  "  let answer = normalizeOcrText(rawAnswer);\n"
                  "  if (!answer) return;\n"
                  "  // R20 SAFE: preserve explicit source label for review/display.\n"
                  "  block.sourceAnswer = answer;"
              )
              if old not in text:
                  raise SystemExit("R19 OCR answer anchor changed unexpectedly")
              text = text.replace(old, new, 1)
          if "output.push(`الإجابة: ${block.sourceAnswer || block.answer}`);" not in text:
              old = "output.push(`الإجابة: ${block.answer}`);"
              if old not in text:
                  raise SystemExit("R19 OCR output anchor changed unexpectedly")
              text = text.replace(old, "output.push(`الإجابة: ${block.sourceAnswer || block.answer}`);", 1)
          if "sourceAnswer: block.sourceAnswer || block.answer," not in text:
              old = "      answer: block.answer,\n      answerIndex:"
              if old not in text:
                  raise SystemExit("R19 OCR record anchor changed unexpectedly")
              text = text.replace(
                  old,
                  "      answer: block.answer,\n"
                  "      sourceAnswer: block.sourceAnswer || block.answer,\n"
                  "      answerIndex:",
                  1,
              )
          path.write_text(text, encoding="utf-8")
          
          path = root / "src/services/pdfQuestionOcr.js"
          text = path.read_text(encoding="utf-8")
          text = text.replace('registerPlugin("R20PageOcr")', 'registerPlugin("MobdeaPdfOcr")')
          path.write_text(text, encoding="utf-8")
          
          path = root / "src/pages/ClassMode.jsx"
          text = path.read_text(encoding="utf-8")
          if "recognizePageForQuestions" not in text:
              anchor = "import Project13LinkHub from '../components/links/Project13LinkHub';"
              if anchor not in text:
                  raise SystemExit("R19 V6 ClassMode import anchor is missing")
              text = text.replace(
                  anchor,
                  anchor + "\nimport { recognizePageForQuestions } from '../services/r20PageOcrPipeline.js';",
                  1,
              )
          if "R20_FIX08_CLASSMODE_OCR_BRIDGE" not in text:
              anchor = "const PROJECT13_CLASSMODE_IMAGE_LINKS_V1 = true;"
              if anchor not in text:
                  raise SystemExit("R19 V6 ClassMode marker anchor is missing")
              text = text.replace(
                  anchor,
                  anchor + "\n\nconst R20_FIX08_CLASSMODE_OCR_BRIDGE = recognizePageForQuestions;",
                  1,
              )
          path.write_text(text, encoding="utf-8")
          
          Path("src/services/r20SafeFeatureLoader.js").write_bytes(
              base64.b64decode("")
          )
          
          path = root / "src/App.jsx"
          text = path.read_text(encoding="utf-8")
          loader_import = 'import { loadR20FeaturesForScreen } from "./services/r20SafeFeatureLoader.js";'
          if loader_import not in text:
              anchor = "function lazyWithNativeRecovery"
              index = text.find(anchor)
              if index < 0:
                  raise SystemExit("R19 App lazy-loader anchor is missing")
              text = text[:index] + loader_import + "\n\n" + text[index:]
          if "mobdea:r20-open-map-challenge" not in text:
              anchor = '  const [active, setActive] = useState("dashboard");'
              if anchor not in text:
                  raise SystemExit("R19 App active-screen anchor is missing")
              block = """
            useEffect(() => {
              const openMapChallenge = (event) => {
                if ((event?.detail?.screen || "mapChallenge") === "mapChallenge") {
                  setActive("mapChallenge");
                }
              };
              globalThis.addEventListener?.(
                "mobdea:r20-open-map-challenge",
                openMapChallenge,
              );
              return () => globalThis.removeEventListener?.(
                "mobdea:r20-open-map-challenge",
                openMapChallenge,
              );
            }, []);
          """
              text = text.replace(anchor, anchor + "\n" + block, 1)
          if "R20_SAFE_SCOPED_FEATURE_LOADING_V1" not in text:
              anchor = "  const [auth, setAuth] = useState(() => readAuthFromStorage());"
              if anchor not in text:
                  raise SystemExit("R19 App auth anchor is missing")
              block = """
            // R20_SAFE_SCOPED_FEATURE_LOADING_V1
            useEffect(() => {
              if (!auth) return undefined;
          
              const safeScreen =
                active === "dashboard" && ["student", "guardian"].includes(auth.role)
                  ? "portalPreview"
                  : active;
          
              document.documentElement.setAttribute(
                "data-r20-safe-screen",
                safeScreen,
              );
          
              void loadR20FeaturesForScreen(
                safeScreen,
                { role: auth.role },
              ).catch((error) => {
                console.error("R20 scoped feature load failed", error);
              });
          
              return () => {
                if (
                  document.documentElement.getAttribute("data-r20-safe-screen")
                  === safeScreen
                ) {
                  document.documentElement.removeAttribute(
                    "data-r20-safe-screen",
                  );
                }
              };
            }, [active, auth?.role]);
          """
              text = text.replace(anchor, anchor + "\n" + block, 1)
          path.write_text(text, encoding="utf-8")
          
          path = root / "src/main.jsx"
          text = path.read_text(encoding="utf-8")
          lines = []
          for line in text.splitlines():
              if re.search(r"import ['\"]\./(?:services|styles)/r20", line, re.I):
                  continue
              lines.append(line)
          text = "\n".join(lines) + "\n"
          css_anchor = "import './styles/project14-youtube-auto-sync.css';"
          if "r19-final-runtime-fixes.css" not in text:
              if css_anchor not in text:
                  raise SystemExit("R19 main CSS anchor is missing")
              text = text.replace(
                  css_anchor,
                  css_anchor + "\nimport './styles/r19-final-runtime-fixes.css';",
                  1,
              )
          if "R20_SAFE_SCOPED_MANIFEST_START" not in text:
              anchor = "import './styles/r19-final-runtime-fixes.css';"
              manifest = """
          /*
          R20_SAFE_SCOPED_MANIFEST_START
          These names are an audit manifest, NOT global imports.
          Actual loading is screen-scoped by r20SafeFeatureLoader.js.
          
          r20-fix01-core-runtime.css
          r20RuntimeCore.js
          r20-fix02-unified-classmode-layout.css
          r20UnifiedClassModeLayout.js
          r20-fix03-student-management.css
          r20StudentManagement.js
