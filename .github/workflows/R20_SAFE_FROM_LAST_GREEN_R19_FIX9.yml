            [/duplexMode:\s*normalizedMode\s*===\s*["']both["']\s*\?\s*nativeDuplexMode\(duplexMode\)\s*:\s*["']none["']/, 'duplex mode mapping'],
            [/<DuplexPrintRun/, 'DuplexPrintRun'],
