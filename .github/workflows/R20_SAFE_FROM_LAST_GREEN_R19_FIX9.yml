          "$BT/aapt" dump badging "$APK" > /tmp/apk-badging.txt
          head -30 /tmp/apk-badging.txt

          grep -Fq "package: name='com.mobdea.education'" /tmp/apk-badging.txt
          grep -Fq "versionCode='$EXPECTED_VERSION_CODE'" /tmp/apk-badging.txt
          grep -Fq "versionName='$EXPECTED_VERSION_NAME'" /tmp/apk-badging.txt

          unzip -l "$APK" > /tmp/apk-files.txt
          grep -Fq "assets/public/index.html" /tmp/apk-files.txt

          unzip -t "$APK" 2>&1 | tee /tmp/apk-unzip-test.log

          "$BT/apksigner" verify --verbose --print-certs "$APK" 2>&1 | tee /tmp/apksigner.txt
          "$BT/zipalign" -c -v 4 "$APK" 2>&1 | tee /tmp/zipalign.txt

          sha256sum "$APK" | tee /tmp/apk.sha256
          echo "Final R20 APK verification: PASS"

      - name: Package final R20 SAFE result
        shell: bash
        run: |
          set -euo pipefail
          OUT="/tmp/mobdea-r20-final"
          rm -rf "$OUT"
          mkdir -p "$OUT"

          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          FINAL_APK="$OUT/mobdea-r20-safe-from-r19-10.14.1-v118-debug.apk"

          test -s "$APK"
          cp "$APK" "$FINAL_APK"
          test -s "$FINAL_APK"
          cmp -s "$APK" "$FINAL_APK"

          sha256sum "$FINAL_APK" > "$OUT/mobdea-r20-safe-from-r19-10.14.1-v118-debug.sha256"

          cp /tmp/apk-badging.txt "$OUT/APK-BADGING.txt"
          cp /tmp/apksigner.txt "$OUT/APK-SIGNATURE.txt"
          cp /tmp/zipalign.txt "$OUT/APK-ZIPALIGN.txt"
          cp /tmp/apk-unzip-test.log "$OUT/APK-INTEGRITY.txt"
          cp /tmp/apk-files.txt "$OUT/APK-FILES.txt"

          git diff --check > "$OUT/GIT-DIFF-CHECK.txt" 2>&1 || true
          git diff --binary > "$OUT/R20-FINAL-SOURCE.patch" 2>/dev/null || true

          cat > "$OUT/FINAL-VERIFICATION.txt" <<'VERIFY'
          R20 SAFE FROM LAST GREEN R19 V6 FIX9
          Baseline: cd7e7cd597af23ca1169e1f19c3ac954727c3f2d
          Last green R19 V6 run: 32714480207
          R20 source release SHA256: 03804eefcfa7b8c2284dfb56303b7ff187af672036f041f41f267dd4283f653c
          VersionName: 10.14.1
          VersionCode: 118
          Final Android build shape: clean :app:assembleDebug
          APK package/version: verified with aapt
          APK archive integrity: verified with unzip -t
          APK signature: verified with apksigner
          APK alignment: verified with zipalign -c -v 4
          VERIFY

          echo "Final R20 package: PASS"

      - name: Upload final R20 SAFE APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobdea-r20-safe-from-r19-fix9-v118
          path: /tmp/mobdea-r20-final/*
          if-no-files-found: error
          retention-days: 30

      - name: Collect failure diagnostics
        if: failure()
        shell: bash
        run: |
          set +e
          OUT="/tmp/mobdea-r20-final-failure"
          mkdir -p "$OUT"

          for log in             /tmp/r20-java-compile.log             /tmp/r20-unit-test.log             /tmp/r20-lint-debug.log             /tmp/r20-assemble-debug.log             /tmp/apk-badging.txt             /tmp/apk-files.txt             /tmp/apk-unzip-test.log             /tmp/apksigner.txt             /tmp/zipalign.txt             /tmp/apk.sha256             /tmp/r20-gradle-version.txt             /tmp/r20-gradle-project-load.log             /tmp/r20-java-version.txt             /tmp/r20-node-version.txt             /tmp/r20-aapt-version.txt             /tmp/r20-apksigner-version.txt             /tmp/r20-zipalign-help.txt; do
            if [ -f "$log" ]; then
              cp "$log" "$OUT/$(basename "$log")"
            fi
          done

          git status --short > "$OUT/git-status.txt" 2>&1
          git diff --check > "$OUT/git-diff-check.txt" 2>&1
          git diff --binary > "$OUT/current.patch" 2>&1
          cp /tmp/r20-tar-list.txt "$OUT/r20-tar-list.txt" 2>/dev/null || true

          if [ -d android/app/build/reports ]; then
            find android/app/build/reports -maxdepth 4 -type f -print > "$OUT/android-reports-list.txt" 2>&1
          fi

          if [ -d android/app/build/test-results/testDebugUnitTest ]; then
            mkdir -p "$OUT/test-results"
            cp -R android/app/build/test-results/testDebugUnitTest/. "$OUT/test-results/" 2>/dev/null || true
          fi

          if [ -d android/app/build/reports/tests/testDebugUnitTest ]; then
            mkdir -p "$OUT/unit-test-report"
            cp -R android/app/build/reports/tests/testDebugUnitTest/. "$OUT/unit-test-report/" 2>/dev/null || true
          fi

          find android/app/build -type f \( -name 'lint-results-debug.txt' -o -name 'lint-results-debug.html' \) -print 2>/dev/null |
          while IFS= read -r report; do
            cp "$report" "$OUT/$(basename "$report")" 2>/dev/null || true
          done

          if [ -s android/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk "$OUT/partial-app-debug.apk"
          fi

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mobdea-r20-safe-from-r19-fix9-failure
          path: /tmp/mobdea-r20-final-failure/*
          if-no-files-found: ignore
          retention-days: 14
