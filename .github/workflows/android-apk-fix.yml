name: Repair Android OCR and Build APK

on:
  push:
    branches:
      - v14-working
    paths:
      - .github/workflows/android-apk-fix.yml

permissions:
  contents: write

jobs:
  repair-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout v14-working
        uses: actions/checkout@v4
        with:
          ref: v14-working
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Apply Android OCR compile repair
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 --decode > /tmp/android_ocr_repair.py
          python3 /tmp/android_ocr_repair.py

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Verify web project and sync Capacitor
        run: npm run cap:sync

      - name: Build and test debug APK
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon lintDebug testDebugUnitTest assembleDebug

      - name: Commit repaired Android source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/app/src/main/java/com/mobdea/education/ocr/MobdeaPdfOcrPlugin.java
          if git diff --cached --quiet; then
            echo "Android OCR source was already repaired."
          else
            git commit -m "Repair Android OCR compilation"
            git push origin HEAD:v14-working
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mobdea-v14-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
