name: Unpack Mobdea v10.1

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/unpack-v10.yml'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild ZIP
        run: |
          cat mobdea-v10.1-phase2-source.zip.part-00 \
              mobdea-v10.1-phase2-source.zip.part-01 \
              > /tmp/mobdea-v10.1.zip

          unzip -tq /tmp/mobdea-v10.1.zip

      - name: Extract new project
        shell: bash
        run: |
          rm -rf /tmp/mobdea-new
          mkdir -p /tmp/mobdea-new

          unzip -oq /tmp/mobdea-v10.1.zip -d /tmp/mobdea-new

          shopt -s dotglob nullglob
          ITEMS=(/tmp/mobdea-new/*)

          if [ "${#ITEMS[@]}" -eq 1 ] && [ -d "${ITEMS[0]}" ]; then
            SRC="${ITEMS[0]}/"
          else
            SRC="/tmp/mobdea-new/"
          fi

          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/workflows/unpack-v10.yml' \
            "$SRC" ./

          rm -f \
            mobdea-v10.1-phase2-source.zip.part-00 \
            mobdea-v10.1-phase2-source.zip.part-01

      - name: Commit extracted project
        run: |
          git config user.name "Mobdea Update Bot"
          git config user.email "actions@github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Install Mobdea v10.1 source"
            git push origin HEAD:main
          fi
