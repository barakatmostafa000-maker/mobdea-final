      - name: Show changed R19 files
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git diff --check
          git diff --stat

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Ten-pass R19 verification
        shell: bash
        run: |
          set -euo pipefail
          for pass in $(seq 1 10); do
            echo "=============================="
            echo "R19 PASS $pass / 10"
            echo "=============================="
            python3 /tmp/r19-final-bundle/verify_r19_targeted_fixes.py
            node --test tests/r19-targeted-integrity.test.mjs
          done

      - name: Full project verification
        run: npm run verify

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Android tests lint and APK
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug --stacktrace

      - name: Verify generated APK
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p /tmp/r19-final-output
          cp "$APK" /tmp/r19-final-output/mobdea-r19-final-10.14.0-v117-debug.apk
          sha256sum /tmp/r19-final-output/mobdea-r19-final-10.14.0-v117-debug.apk             > /tmp/r19-final-output/mobdea-r19-final-10.14.0-v117-debug.sha256
          git diff > /tmp/r19-final-output/R19-final-applied.patch
          git diff --stat > /tmp/r19-final-output/R19-final-applied-stat.txt
          cat /tmp/r19-final-output/mobdea-r19-final-10.14.0-v117-debug.sha256

      - name: Upload final R19 APK
        uses: actions/upload-artifact@v4
        with:
          name: mobdea-r19-final-10pass-apk
          path: /tmp/r19-final-output
          if-no-files-found: error
          retention-days: 14

      - name: R19 final summary
        if: always()
        shell: bash
        run: |
          {
            echo "## R19 Final 10-Pass APK"
            echo "- Branch: r19-unified"
            echo "- Version: 10.14.0"
            echo "- VersionCode: 117"
            echo "- Cumulative targeted repairs applied inside the build runner"
            echo "- Student cards: selected-only front/back print pairing"
            echo "- Cross-device sync merge hardening included"
            echo "- Targeted verification repeated 10 times"
            echo "- Full npm verification + Android unit tests + lint + APK assembly"
            echo "- Workflow does not commit or push source changes"
          } >> "$GITHUB_STEP_SUMMARY"
