name: R19 Final 10-Pass APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r19-final-10pass-apk
  cancel-in-progress: true

jobs:
  build-r19-final:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout R19
        uses: actions/checkout@v4
        with:
          ref: r19-unified
          fetch-depth: 1

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Verify R19 baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./package.json').version")" = "10.14.0"
          test "$(node -p "require('./package.json').mobdea.versionCode")" = "117"
          grep -q "RELEASE_TAG = 'R19'" src/config/version.js
          echo "R19 baseline OK"

      - name: Restore cumulative R19 repair payload
        shell: bash
        run: |
          set -euo pipefail
