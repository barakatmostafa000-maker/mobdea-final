        node - <<'NODE_TOOLCHAIN'
        const fs = require('node:fs');
        const major = Number(process.versions.node.split('.')[0]);
        if (major !== 22) throw new Error(`Expected Node 22.x, found ${process.version}`);
        const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
