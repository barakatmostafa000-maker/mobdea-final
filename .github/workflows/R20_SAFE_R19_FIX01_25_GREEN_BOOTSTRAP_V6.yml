      uses: actions/checkout@v4
      with:
        ref: ${{ env.R19_BASE_COMMIT }}
        fetch-depth: 1
        clean: true
    - name: Verify exact clean R19 baseline
      shell: bash
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "$R19_BASE_COMMIT"
        test -z "$(git status --porcelain)"
        test -f package.json
        test -f package-lock.json
        test -d android
        echo "Exact protected R19 baseline verified: $R19_BASE_COMMIT"
    - name: Restore embedded FIX01-25 scripts outside protected workspace
