          node --input-type=module <<'NODE_RUN18_PARSE' 2>&1 | tee /tmp/r19-run18-logs/source-parse.log
          import fs from 'node:fs';
          import path from 'node:path';
          import { transform } from 'esbuild';
          const roots = ['src', 'cloud-worker', 'scripts', 'tests'];
          const files = [];
          function walk(dir) {
            if (!fs.existsSync(dir)) return;
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) {
                if (['node_modules', 'dist', 'build', '.gradle'].includes(entry.name)) continue;
                walk(full);
              } else if (/\.(js|jsx|mjs|cjs)$/.test(entry.name)) files.push(full);
            }
          }
          for (const root of roots) walk(root);
          let failures = 0;
          for (const file of files) {
            try {
              await transform(fs.readFileSync(file, 'utf8'), {
                loader: file.endsWith('.jsx') ? 'jsx' : 'js',
                jsx: 'automatic',
                target: 'es2022',
                sourcefile: file,
              });
            } catch (error) {
              failures += 1;
              console.error(`SYNTAX_FAIL ${file}`);
              console.error(error?.message || error);
            }
          }
          console.log(`RUN18_SOURCE_PARSE files=${files.length} failures=${failures}`);
          if (failures) process.exit(1);
