      - name: Static-validate every embedded repair and contract
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile /tmp/mobdea-run15-repairs/*.py
          for f in /tmp/mobdea-run15-repairs/*.mjs; do node --check "$f"; done
          for f in apply_project01.py apply_project02.py apply_project03.py apply_project04.py apply_project05.py apply_project06.py apply_project07.py apply_project06_refinement.py apply_project08.py apply_project09.py apply_project10.py apply_project11.py apply_project12.py apply_project13.py apply_project14.py final_integration_reconciliation.py final_source_audit.py; do
            test -s "/tmp/mobdea-run15-repairs/$f"
          done
          test -s /tmp/mobdea-run15-repairs/apply_run15_source_sanity.py
          test -s /tmp/mobdea-run15-repairs/apply_run15_postrepair.py
          test -s /tmp/mobdea-run15-repairs/run15-runtime-contract.test.mjs
          test -s /tmp/mobdea-run15-repairs/run15-build-readiness.test.mjs
          echo 'RUN18_EMBEDDED_REPAIR_STATIC_CHECKS=PASS'

