      - name: Relative source import diagnostics before Vite
        id: import_graph
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE_RUN18_IMPORTS' 2>&1 | tee /tmp/r19-run18-logs/import-graph.log
          import fs from 'node:fs';
          import path from 'node:path';
          const roots = ['src', 'cloud-worker', 'scripts', 'tests'];
          const codeExtensions = new Set(['.js','.jsx','.mjs','.cjs']);
          const candidateExtensions = ['.js','.jsx','.mjs','.cjs','.json','.css','.svg','.png','.jpg','.jpeg','.webp','.gif','.wasm'];
          const files = [];
          function walk(dir) {
            if (!fs.existsSync(dir)) return;
            for (const entry of fs.readdirSync(dir,{withFileTypes:true})) {
              const full = path.join(dir,entry.name);
              if (entry.isDirectory()) {
                if (['node_modules','dist','build','.gradle'].includes(entry.name)) continue;
                walk(full);
              } else if (codeExtensions.has(path.extname(entry.name))) files.push(full);
            }
          }
          for (const root of roots) walk(root);
          const patterns = [
            /(?:import|export)\s+(?:[^'";]*?\s+from\s+)?['"]([^'"]+)['"]/g,
            /import\(\s*['"]([^'"]+)['"]\s*\)/g,
          ];
          const missing = [];
          function resolves(file,spec) {
            const clean = spec.split(/[?#]/,1)[0];
            if (!clean.startsWith('.')) return true;
            const base = path.resolve(path.dirname(file),clean);
            const candidates = [base];
            if (!path.extname(base)) {
              for (const ext of candidateExtensions) candidates.push(base+ext);
              for (const ext of candidateExtensions) candidates.push(path.join(base,'index'+ext));
            }
            return candidates.some((candidate)=>fs.existsSync(candidate));
          }
          for (const file of files) {
            const source = fs.readFileSync(file,'utf8');
            for (const pattern of patterns) {
              pattern.lastIndex = 0;
              for (let match; (match = pattern.exec(source)); ) {
                const spec = match[1];
                if (!resolves(file,spec)) missing.push(`${file}: ${spec}`);
              }
            }
          }
          console.log(`RUN18_IMPORT_GRAPH files=${files.length} missing=${missing.length}`);
          for (const item of missing) console.error(`MISSING_IMPORT ${item}`);
          if (missing.length) console.warn('RUN18_IMPORT_GRAPH_DIAGNOSTIC: Vite build remains the authoritative resolver.');
          NODE_RUN18_IMPORTS

      - name: RUN18 relative named-export contract before Vite
        id: module_exports
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE_RUN18_EXPORTS' 2>&1 | tee /tmp/r19-run18-logs/module-exports.log
          import fs from 'node:fs';
          import path from 'node:path';

          const roots = ['src', 'cloud-worker', 'scripts', 'tests'];
          const codeExts = ['.js', '.jsx', '.mjs', '.cjs'];
          const files = [];
          function walk(dir) {
            if (!fs.existsSync(dir)) return;
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) {
                if (['node_modules', 'dist', 'build', '.gradle'].includes(entry.name)) continue;
                walk(full);
              } else if (codeExts.includes(path.extname(entry.name))) files.push(full);
            }
          }
          for (const root of roots) walk(root);

          function resolveRelative(file, spec) {
            const clean = spec.split(/[?#]/, 1)[0];
            if (!clean.startsWith('.')) return null;
            const base = path.resolve(path.dirname(file), clean);
            const candidates = [base];
            if (!path.extname(base)) {
              for (const ext of codeExts) candidates.push(base + ext);
              for (const ext of codeExts) candidates.push(path.join(base, 'index' + ext));
            }
            return candidates.find((candidate) => fs.existsSync(candidate) && fs.statSync(candidate).isFile()) || null;
          }

          const exportCache = new Map();
          function directExports(file, stack = new Set()) {
            const absolute = path.resolve(file);
            if (exportCache.has(absolute)) return new Set(exportCache.get(absolute));
            if (stack.has(absolute)) return new Set();
            stack.add(absolute);
            const source = fs.readFileSync(absolute, 'utf8');
            const names = new Set();
            const declarationPatterns = [
              /\bexport\s+(?:async\s+)?function\s+([A-Za-z_$][\w$]*)/g,
              /\bexport\s+class\s+([A-Za-z_$][\w$]*)/g,
              /\bexport\s+(?:const|let|var)\s+([A-Za-z_$][\w$]*)/g,
            ];
            for (const pattern of declarationPatterns) {
              for (let match; (match = pattern.exec(source)); ) names.add(match[1]);
            }
            const listPattern = /\bexport\s*\{([^}]*)\}(?:\s+from\s+['"]([^'"]+)['"])?/g;
            for (let match; (match = listPattern.exec(source)); ) {
              for (const raw of match[1].split(',')) {
                const item = raw.trim();
                if (!item) continue;
                const parts = item.split(/\s+as\s+/);
                names.add((parts[1] || parts[0]).trim());
              }
            }
            const starPattern = /\bexport\s*\*\s*from\s*['"]([^'"]+)['"]/g;
            for (let match; (match = starPattern.exec(source)); ) {
              const target = resolveRelative(absolute, match[1]);
              if (target) for (const name of directExports(target, new Set(stack))) names.add(name);
            }
            exportCache.set(absolute, new Set(names));
            return names;
          }

          function hasFallbackVariableExport(source, name) {
            const safeName = name.replace(/\$/g, '\\$');
            const statements = source.match(/\bexport\s+(?:const|let|var)\s+[\s\S]*?;/g) || [];
            return statements.some((statement) =>
              new RegExp(`(?:^|[,\s])${safeName}\s*=`).test(statement),
            );
          }

          const problems = [];
          const namedImport = /\bimport\s*\{([^}]*)\}\s*from\s*['"]([^'"]+)['"]/g;
          const namedReexport = /\bexport\s*\{([^}]*)\}\s*from\s*['"]([^'"]+)['"]/g;
          for (const file of files) {
            const source = fs.readFileSync(file, 'utf8');
            for (const [pattern, kind] of [[namedImport, 'IMPORT'], [namedReexport, 'REEXPORT']]) {
              pattern.lastIndex = 0;
              for (let match; (match = pattern.exec(source)); ) {
                const target = resolveRelative(file, match[2]);
                if (!target || !codeExts.includes(path.extname(target))) continue;
                const targetSource = fs.readFileSync(target, 'utf8');
                const targetExports = directExports(target);
                for (const raw of match[1].split(',')) {
                  const item = raw.trim();
                  if (!item || item.startsWith('type ')) continue;
                  const original = item.split(/\s+as\s+/)[0].trim().replace(/^type\s+/, '');
                  if (original === 'default') continue;
                  if (!targetExports.has(original) && !hasFallbackVariableExport(targetSource, original)) {
                    problems.push(`${kind} ${file}: ${original} <- ${match[2]} (${target})`);
                  }
                }
              }
            }
          }
          console.log(`RUN18_MODULE_EXPORT_CONTRACT files=${files.length} problems=${problems.length}`);
          for (const problem of problems) console.error(`MISSING_NAMED_EXPORT ${problem}`);
          if (problems.length) process.exit(1);
          NODE_RUN18_EXPORTS

