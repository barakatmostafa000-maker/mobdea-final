          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon lintDebug --stacktrace 2>&1 | tee /tmp/r19-run18-logs/android-lint-debug.log

      - name: Android lintRelease gate
        id: android_lint_release
        if: ${{ steps.android_config.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        working-directory: android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon lintRelease --stacktrace 2>&1 | tee /tmp/r19-run18-logs/android-lint-release.log

      - name: Build and verify debug APK
        id: android_debug
        if: ${{ steps.android_compile_debug.outcome == 'success' && steps.android_lint_debug.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        working-directory: android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug --stacktrace 2>&1 | tee /tmp/r19-run18-logs/android-debug-build.log
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk >/tmp/r19-run18-logs/android-debug-ziptest.log
          unzip -l app/build/outputs/apk/debug/app-debug.apk > /tmp/r19-run18-logs/android-debug-list.log
          grep -Eq 'classes([0-9]+)?\.dex' /tmp/r19-run18-logs/android-debug-list.log

      - name: Build and verify release APK
        id: android_release
        if: ${{ steps.android_compile_release.outcome == 'success' && steps.android_lint_release.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        working-directory: android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease --stacktrace 2>&1 | tee /tmp/r19-run18-logs/android-release-build.log
          RELEASE_APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit 2>/dev/null || true)"
          test -n "$RELEASE_APK"
          test -s "$RELEASE_APK"
          unzip -t "$RELEASE_APK" >/tmp/r19-run18-logs/android-release-ziptest.log
          unzip -l "$RELEASE_APK" > /tmp/r19-run18-logs/android-release-list.log
          grep -Eq 'classes([0-9]+)?\.dex' /tmp/r19-run18-logs/android-release-list.log
          find app/build/outputs/apk -type f -name '*.apk' -print

      - name: Final no-regression runtime gate after Android sync
        id: final_static
        if: ${{ steps.android_debug.outcome == 'success' && steps.android_release.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          node --check src/data/geography.js
          node --check src/services/project13ExamAnalytics.js
          node --check src/services/project14YoutubeSync.js
          node --check src/services/projectFinalStudentAssets.js
          node --check cloud-worker/worker.js
          node --test tests/run15-runtime-contract.test.mjs 2>&1 | tee /tmp/r19-run18-logs/final-runtime-contract.log
          node --test tests/run15-build-readiness.test.mjs 2>&1 | tee /tmp/r19-run18-logs/final-build-readiness.log
          npm run build 2>&1 | tee /tmp/r19-run18-logs/final-build.log
          test -s dist/index.html
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          test -n "$(find android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit 2>/dev/null || true)"

      - name: Collect RUN18 repaired source, APKs and all diagnostics
        id: collect_result
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          OUT=r19-run18-output
          rm -rf "$OUT"
          mkdir -p "$OUT/logs" "$OUT/apk"
          cp -a /tmp/r19-run18-logs/. "$OUT/logs/" 2>/dev/null || true
          cp /tmp/R19_FINAL_DEEP_SOURCE_AUDIT.txt "$OUT/logs/" 2>/dev/null || true
          git status --short > "$OUT/git-status.txt"
          git diff --binary > "$OUT/R19_RUN18_FINAL.patch"
          git diff --stat > "$OUT/R19_RUN18_DIFFSTAT.txt"
          find android/app/build/outputs/apk -type f -name '*.apk' -exec cp {} "$OUT/apk/" \; 2>/dev/null || true
          python - <<'PY2'
          from pathlib import Path
          import subprocess, tarfile
          out=Path('r19-run18-output')
          tracked=subprocess.check_output(['git','diff','--name-only','-z']).split(b'\0')
          untracked=subprocess.check_output(['git','ls-files','--others','--exclude-standard','-z']).split(b'\0')
          files=[]
          for raw in tracked+untracked:
              if not raw: continue
              p=Path(raw.decode())
              if not p.exists() or not p.is_file(): continue
              if any(x in p.parts for x in ('.git','node_modules','.gradle')): continue
              if p.parts and p.parts[0]=='r19-run18-output': continue
              files.append(p)
          with tarfile.open(out/'R19_RUN18_FIXED_FILES.tar.gz','w:gz') as tf:
              for p in sorted(set(files),key=str): tf.add(p,arcname=str(p))
          PY2

      - name: Upload RUN18 complete result and diagnostics
        id: upload_result
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: mobdea-r19-run18-full-result
          path: r19-run18-output/
          if-no-files-found: error
          retention-days: 14

      - name: Final RUN18 gate - no repair, test or build failure accepted
        if: always()
        shell: bash
        env:
          P01_APPLY: ${{ steps.p01_apply.outcome }}
          P01_TEST: ${{ steps.p01_test.outcome }}
          P02_APPLY: ${{ steps.p02_apply.outcome }}
          P02_TEST: ${{ steps.p02_test.outcome }}
          P03_APPLY: ${{ steps.p03_apply.outcome }}
          P03_TEST: ${{ steps.p03_test.outcome }}
          P04_APPLY: ${{ steps.p04_apply.outcome }}
          P04_TEST: ${{ steps.p04_test.outcome }}
          P05_APPLY: ${{ steps.p05_apply.outcome }}
          P05_TEST: ${{ steps.p05_test.outcome }}
          P06_APPLY: ${{ steps.p06_apply.outcome }}
          P06_TEST: ${{ steps.p06_test.outcome }}
          P07_APPLY: ${{ steps.p07_apply.outcome }}
          P07_TEST: ${{ steps.p07_test.outcome }}
          P06_REFINEMENT_APPLY: ${{ steps.p06_refinement_apply.outcome }}
          P06_REFINEMENT_TEST: ${{ steps.p06_refinement_test.outcome }}
          P08_APPLY: ${{ steps.p08_apply.outcome }}
          P08_TEST: ${{ steps.p08_test.outcome }}
          P09_APPLY: ${{ steps.p09_apply.outcome }}
          P09_TEST: ${{ steps.p09_test.outcome }}
          P10_APPLY: ${{ steps.p10_apply.outcome }}
          P10_TEST: ${{ steps.p10_test.outcome }}
          P11_APPLY: ${{ steps.p11_apply.outcome }}
          P11_TEST: ${{ steps.p11_test.outcome }}
          P12_APPLY: ${{ steps.p12_apply.outcome }}
          P12_TEST: ${{ steps.p12_test.outcome }}
          P13_APPLY: ${{ steps.p13_apply.outcome }}
          P13_TEST: ${{ steps.p13_test.outcome }}
          P14_APPLY: ${{ steps.p14_apply.outcome }}
          P14_TEST: ${{ steps.p14_test.outcome }}
          POSTREPAIR: ${{ steps.postrepair.outcome }}
          ROOT_CLOSURE: ${{ steps.root_closure.outcome }}
          FINAL_RECONCILE: ${{ steps.final_reconcile.outcome }}
          SOURCE_AUDIT: ${{ steps.source_audit.outcome }}
          BUILD_READINESS: ${{ steps.build_readiness.outcome }}
          INSTALL: ${{ steps.install.outcome }}
          IMPORT_GRAPH: ${{ steps.import_graph.outcome }}
          MODULE_EXPORTS: ${{ steps.module_exports.outcome }}
          RUNTIME_CONTRACT: ${{ steps.runtime_contract.outcome }}
          SOURCE_PARSE: ${{ steps.source_parse.outcome }}
          LINT: ${{ steps.lint.outcome }}
          FORMAT: ${{ steps.format.outcome }}
          STATIC_VERIFY: ${{ steps.static_verify.outcome }}
          WEB_BUILD: ${{ steps.web_build.outcome }}
          SOURCE_SANITY_PRE: ${{ steps.source_sanity_pre.outcome }}
          SOURCE_SANITY_POST: ${{ steps.source_sanity_post.outcome }}
          ANDROID_SDK: ${{ steps.android_sdk.outcome }}
          CAP_SYNC: ${{ steps.cap_sync.outcome }}
          ANDROID_CONFIG: ${{ steps.android_config.outcome }}
          SETUP_JAVA: ${{ steps.setup_java.outcome }}
          SETUP_ANDROID_ACTION: ${{ steps.setup_android_action.outcome }}
          ANDROID_COMPILE_DEBUG: ${{ steps.android_compile_debug.outcome }}
          ANDROID_COMPILE_RELEASE: ${{ steps.android_compile_release.outcome }}
          ANDROID_UNIT: ${{ steps.android_unit.outcome }}
          ANDROID_LINT_DEBUG: ${{ steps.android_lint_debug.outcome }}
          ANDROID_LINT_RELEASE: ${{ steps.android_lint_release.outcome }}
          ANDROID_DEBUG: ${{ steps.android_debug.outcome }}
          ANDROID_RELEASE: ${{ steps.android_release.outcome }}
          FINAL_STATIC: ${{ steps.final_static.outcome }}
          COLLECT_RESULT: ${{ steps.collect_result.outcome }}
          UPLOAD_RESULT: ${{ steps.upload_result.outcome }}
        run: |
          set -euo pipefail
          failed=0
          root_failures=()
          require_success() {
            local name="$1" value="$2"
            printf '%s=%s\n' "$name" "$value"
            if [ "$value" != success ]; then failed=1; root_failures+=("$name=$value"); fi
          }
          blocked_or_require() {
            local parent_ok="$1" name="$2" value="$3"
            if [ "$parent_ok" = true ]; then
              require_success "$name" "$value"
            else
              printf '%s=%s (blocked by upstream root; not counted as a separate failure)\n' "$name" "$value"
            fi
          }

          require_success p01_apply "$P01_APPLY"; require_success p01_test "$P01_TEST"
          require_success p02_apply "$P02_APPLY"; require_success p02_test "$P02_TEST"
          require_success p03_apply "$P03_APPLY"; require_success p03_test "$P03_TEST"
          require_success p04_apply "$P04_APPLY"; require_success p04_test "$P04_TEST"
          require_success p05_apply "$P05_APPLY"; require_success p05_test "$P05_TEST"
          require_success p06_apply "$P06_APPLY"; require_success p06_test "$P06_TEST"
          require_success p07_apply "$P07_APPLY"; require_success p07_test "$P07_TEST"
          require_success p06_refinement_apply "$P06_REFINEMENT_APPLY"; require_success p06_refinement_test "$P06_REFINEMENT_TEST"
          require_success p08_apply "$P08_APPLY"; require_success p08_test "$P08_TEST"
          require_success p09_apply "$P09_APPLY"; require_success p09_test "$P09_TEST"
          require_success p10_apply "$P10_APPLY"; require_success p10_test "$P10_TEST"
          require_success p11_apply "$P11_APPLY"; require_success p11_test "$P11_TEST"
          require_success p12_apply "$P12_APPLY"; require_success p12_test "$P12_TEST"
          require_success p13_apply "$P13_APPLY"; require_success p13_test "$P13_TEST"
          require_success p14_apply "$P14_APPLY"; require_success p14_test "$P14_TEST"

          require_success postrepair "$POSTREPAIR"
          require_success root_closure "$ROOT_CLOSURE"
          require_success source_sanity_pre "$SOURCE_SANITY_PRE"
          require_success final_reconcile "$FINAL_RECONCILE"
          require_success source_sanity_post "$SOURCE_SANITY_POST"
          require_success source_audit "$SOURCE_AUDIT"
          require_success build_readiness "$BUILD_READINESS"
          require_success install "$INSTALL"
          require_success source_parse "$SOURCE_PARSE"
          require_success import_graph "$IMPORT_GRAPH"
          require_success module_exports "$MODULE_EXPORTS"
          require_success runtime_contract "$RUNTIME_CONTRACT"
          require_success lint "$LINT"
          require_success format "$FORMAT"
          require_success static_verify "$STATIC_VERIFY"
          require_success web_build "$WEB_BUILD"
          require_success setup_java "$SETUP_JAVA"
          require_success setup_android_action "$SETUP_ANDROID_ACTION"
          require_success android_sdk "$ANDROID_SDK"

          cap_parent=false
          if [ "$WEB_BUILD" = success ] && [ "$ANDROID_SDK" = success ]; then cap_parent=true; fi
          blocked_or_require "$cap_parent" cap_sync "$CAP_SYNC"

          config_parent=false
          if [ "$CAP_SYNC" = success ] && [ "$SETUP_JAVA" = success ] && [ "$SETUP_ANDROID_ACTION" = success ]; then config_parent=true; fi
          blocked_or_require "$config_parent" android_config "$ANDROID_CONFIG"

          gradle_parent=false
          if [ "$ANDROID_CONFIG" = success ]; then gradle_parent=true; fi
          blocked_or_require "$gradle_parent" android_compile_debug "$ANDROID_COMPILE_DEBUG"
          blocked_or_require "$gradle_parent" android_compile_release "$ANDROID_COMPILE_RELEASE"
          blocked_or_require "$gradle_parent" android_unit "$ANDROID_UNIT"
          blocked_or_require "$gradle_parent" android_lint_debug "$ANDROID_LINT_DEBUG"
          blocked_or_require "$gradle_parent" android_lint_release "$ANDROID_LINT_RELEASE"

          debug_parent=false
          if [ "$ANDROID_COMPILE_DEBUG" = success ] && [ "$ANDROID_LINT_DEBUG" = success ]; then debug_parent=true; fi
          blocked_or_require "$debug_parent" android_debug "$ANDROID_DEBUG"
          release_parent=false
          if [ "$ANDROID_COMPILE_RELEASE" = success ] && [ "$ANDROID_LINT_RELEASE" = success ]; then release_parent=true; fi
          blocked_or_require "$release_parent" android_release "$ANDROID_RELEASE"

          final_parent=false
          if [ "$ANDROID_DEBUG" = success ] && [ "$ANDROID_RELEASE" = success ]; then final_parent=true; fi
          blocked_or_require "$final_parent" final_static "$FINAL_STATIC"

          require_success collect_result "$COLLECT_RESULT"
          require_success upload_result "$UPLOAD_RESULT"

          if [ "$failed" -ne 0 ]; then
            printf 'RUN18 ROOT FAILURES (%s):\n' "${#root_failures[@]}"
            printf ' - %s\n' "${root_failures[@]}"
            echo 'RUN18 FINAL GATE: FAILED - inspect only the root failures above; blocked downstream gates were not counted twice.'
            exit 1
          fi
          echo 'RUN18 FINAL GATE: PASS - P01-P14, web build, Capacitor sync, Android compile/lint and debug/release APK gates all passed.'
