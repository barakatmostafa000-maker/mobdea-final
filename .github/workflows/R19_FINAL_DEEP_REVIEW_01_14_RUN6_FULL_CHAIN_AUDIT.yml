        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      run: |
        set -euo pipefail
        if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
          echo "SKIPPED_NO_CLOUDFLARE_SECRET" > /tmp/final-worker-deploy-status.txt
          echo "Cloud Worker deployment skipped because CLOUDFLARE_API_TOKEN is not configured."
