name: R19 FINAL Deep Review 01-14 RUN6 - Full Chain Audit

"on":
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  r19-final-deep-review-01-14-run6:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      CI: "true"
      R19_BASE_COMMIT: cd7e7cd597af23ca1169e1f19c3ac954727c3f2d
      R19_PATCH_SHA256: 
        cdde2432847080323e32430c86e5a717877a6f54a5c21a32820072c1761c7332
      R19_FIX3_PAYLOAD_COMMIT: 3477b1b9b7f2210823054634e4f840ff9744910c
      MOBDEA_WORKER_URL: 
        https://mobdea-platform-api.barakatmostafa000.workers.dev

    steps:
    - name: Runner allocation smoke test
      shell: bash
      run: |
        set -euo pipefail
        echo "RUNNER_STARTED=1"
        echo "Workflow: R19 FINAL Deep Review 01-14 RUN6 Full Chain Audit"
        echo "Runner OS: ${RUNNER_OS:-unknown}"
        echo "Runner arch: ${RUNNER_ARCH:-unknown}"
        echo "Run ID: ${GITHUB_RUN_ID:-unknown}"
        uname -a
        date -u
        test "${RUNNER_OS:-}" = "Linux"

    - name: Checkout exact R19 baseline
      uses: actions/checkout@v4
      with:
        ref: cd7e7cd597af23ca1169e1f19c3ac954727c3f2d
        fetch-depth: 1

    - name: Setup Node 22
      uses: actions/setup-node@v4
      with:
        node-version: "22"
        cache: npm


    - name: Recover exact tested R19 Fix8.13 source
      shell: bash
      run: |
        set -euo pipefail
        trap 'echo "::error::R19 recovery failed at line $LINENO: $BASH_COMMAND"' ERR

        test "$(git rev-parse HEAD)" = "$R19_BASE_COMMIT"

        HISTORICAL_COMMIT="976e70f2b20c369d512a56250b7ef0b9a02e8659"
        HISTORICAL_WORKFLOW=".github/workflows/R19_FINAL_RELEASE_FIX8_13.yml"

        echo "Fetching deterministic historical workflow source..."
        git fetch --no-tags --depth=1 origin "$HISTORICAL_COMMIT"
        git show "$HISTORICAL_COMMIT:$HISTORICAL_WORKFLOW" > /tmp/r19-fix813-historical.yml
        test -s /tmp/r19-fix813-historical.yml

        python3 - <<'PY_RECOVER_R19'
        from pathlib import Path
        import base64
        import gzip
        import hashlib
        import re

        workflow = Path("/tmp/r19-fix813-historical.yml").read_text(encoding="utf-8")
        pattern = re.compile(
            r"cat > /tmp/r19-fix8-13\.patch\.gz\.b64 <<'EOF_PATCH'\n"
            r"(?P<payload>[\s\S]*?)\n\s*EOF_PATCH"
        )
        match = pattern.search(workflow)
        if not match:
            raise SystemExit("Historical Fix8.13 patch payload block was not found.")

        payload = "".join(line.strip() for line in match.group("payload").splitlines())
        if len(payload) < 1000:
            raise SystemExit("Historical Fix8.13 patch payload is unexpectedly small.")

        compressed = base64.b64decode(payload, validate=True)
        patch = gzip.decompress(compressed)
        if len(patch) < 1000:
            raise SystemExit("Historical Fix8.13 decoded patch is unexpectedly small.")

        Path("/tmp/r19-fix8-13.patch").write_bytes(patch)
        print(f"Recovered historical patch bytes: {len(patch)}")
        print(f"Recovered historical patch SHA256: {hashlib.sha256(patch).hexdigest()}")
        PY_RECOVER_R19

        PATCH="/tmp/r19-fix8-13.patch"
        test -s "$PATCH"

        ACTUAL_PATCH_SHA="$(sha256sum "$PATCH" | awk '{print $1}')"
        echo "Expected patch SHA256: $R19_PATCH_SHA256"
        echo "Actual patch SHA256:   $ACTUAL_PATCH_SHA"
        test "$ACTUAL_PATCH_SHA" = "$R19_PATCH_SHA256"

        git apply --check "$PATCH"
        git apply "$PATCH"
        git diff --check

        test -f src/pages/ClassMode.jsx
        test -f src/main.jsx

        node - <<'NODE_R19_VERSION'
        const fs = require('node:fs');
        const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
        if (pkg.version !== '10.14.1') throw new Error(`Unexpected recovered R19 version: ${pkg.version}`);
        if (Number(pkg.mobdea?.versionCode) !== 118) throw new Error(`Unexpected recovered R19 versionCode: ${pkg.mobdea?.versionCode}`);
        console.log('Recovered exact R19 Fix8.13 version 10.14.1 / versionCode 118');
        NODE_R19_VERSION

        grep -Fq 'CanvasOverlay' src/pages/ClassMode.jsx
        grep -Fq 'classmode-board-surface' src/pages/ClassMode.jsx

        echo "R19 Fix8.13 source recovery: PASS"

    - name: Complete historical Fix8.13 source components
      shell: bash
      run: |
        set -euo pipefail
        trap 'echo "::error::Historical R19 completion failed at line $LINENO: $BASH_COMMAND"' ERR
        test -s /tmp/r19-fix813-historical.yml

        python3 - <<'PY_HISTORICAL_STEPS'
        from pathlib import Path

        workflow = Path("/tmp/r19-fix813-historical.yml").read_text(encoding="utf-8")

        def extract_run_step(name, output):
            lines = workflow.splitlines()
            target = f"- name: {name}"
            start = next((i for i, line in enumerate(lines) if line.strip() == target), None)
            if start is None:
                raise SystemExit(f"Historical step not found: {name}")
            run_index = next(
                (i for i in range(start + 1, min(len(lines), start + 24)) if lines[i].strip() == "run: |"),
                None,
            )
            if run_index is None:
                raise SystemExit(f"Historical run block not found: {name}")
            body = []
            for line in lines[run_index + 1:]:
                if line.startswith("      - name:"):
                    break
                if line.startswith("          "):
                    body.append(line[10:])
                elif not line.strip():
                    body.append("")
                else:
                    break
            script = "\n".join(body).rstrip() + "\n"
            if len(script) < 50:
                raise SystemExit(f"Historical run block unexpectedly short: {name}")
            Path(output).write_text(script, encoding="utf-8")

        extract_run_step("Restore omitted R19 targeted stylesheet", "/tmp/r19_restore_targeted.sh")
        extract_run_step("Install Class Mode interaction stability repair", "/tmp/r19_install_stability.sh")
        PY_HISTORICAL_STEPS

        bash /tmp/r19_restore_targeted.sh
        bash /tmp/r19_install_stability.sh

        test -s src/styles/r19-targeted-fixes.css
        test -s src/services/r19InteractionFixes.js
        grep -Fq "r19-targeted-fixes.css" src/main.jsx
        grep -Fq "r19InteractionFixes" src/main.jsx
        git diff --check
        echo "Historical Fix8.13 source components: PASS"

    - name: Materialize hardened Repairs 01-14
      shell: bash
      run: |
        set -euo pipefail
        rm -rf /tmp/mobdea-repairs
        mkdir -p /tmp/mobdea-repairs
        printf '%s' '' | base64 -d > /tmp/mobdea-repairs.tar.gz
        gzip -t /tmp/mobdea-repairs.tar.gz
        tar -xzf /tmp/mobdea-repairs.tar.gz -C /tmp/mobdea-repairs
        test "$(find /tmp/mobdea-repairs -type f | wc -l)" -eq 26
        test "$(find /tmp/mobdea-repairs -type f -name '*.py' | wc -l)" -eq 17
        test "$(find /tmp/mobdea-repairs -type f -name '*.mjs' | wc -l)" -eq 9
        for file in /tmp/mobdea-repairs/*.py; do
          test -s "$file"
          python3 -m py_compile "$file"
        done
        for file in /tmp/mobdea-repairs/*.mjs; do
          test -s "$file"
          node --check "$file"
        done
        echo "Hardened repair/test bundle: PASS"

    - name: Deep integrated preflight Repairs 01-14 before real apply
      shell: bash
      run: |
        set -euo pipefail
        trap 'echo "::error::Integrated repair preflight shell failure at line $LINENO: $BASH_COMMAND"; cat /tmp/R19_REPAIRS_01_14_PREFLIGHT.log 2>/dev/null || true' ERR

        rm -rf /tmp/r19-preflight
        mkdir -p /tmp/r19-preflight
        rsync -a --delete --exclude='.git' --exclude='node_modules' --exclude='dist' ./ /tmp/r19-preflight/

        : > /tmp/R19_REPAIRS_01_14_PREFLIGHT.log
        : > /tmp/R19_REPAIRS_01_14_FAILURES.txt
        cd /tmp/r19-preflight
        git init -q
        git config user.name "Mobdea Preflight"
        git config user.email "mobdea-preflight@invalid.local"
        git add -A
        git commit -qm "preflight baseline"

        declare -A APPLY_OK
        FAIL_COUNT=0

        record_failure() {
          local kind="$1"
          local label="$2"
          FAIL_COUNT=$((FAIL_COUNT + 1))
          echo "${kind}:${label}" | tee -a /tmp/R19_REPAIRS_01_14_FAILURES.txt /tmp/R19_REPAIRS_01_14_PREFLIGHT.log
        }

        run_repair() {
          local label="$1"
          local script="$2"
          echo "===== APPLY $label =====" | tee -a /tmp/R19_REPAIRS_01_14_PREFLIGHT.log
          if python3 "$script" >> /tmp/R19_REPAIRS_01_14_PREFLIGHT.log 2>&1; then
            APPLY_OK["$label"]=1
            echo "PREFLIGHT_APPLY_PASS=$label" | tee -a /tmp/R19_REPAIRS_01_14_PREFLIGHT.log
          else
            APPLY_OK["$label"]=0
            echo "PREFLIGHT_APPLY_FAILED=$label" | tee -a /tmp/R19_REPAIRS_01_14_PREFLIGHT.log
            record_failure "APPLY" "$label"
          fi
        }

        run_contract() {
          local label="$1"
          shift
          if [ "${APPLY_OK[$label]:-0}" != "1" ]; then
            echo "PREFLIGHT_TEST_SKIPPED=$label (apply failed)" | tee -a /tmp/R19_REPAIRS_01_14_PREFLIGHT.log
            return 0
          fi
          echo "===== TEST $label =====" | tee -a /tmp/R19_REPAIRS_01_14_PREFLIGHT.log
          if "$@" >> /tmp/R19_REPAIRS_01_14_PREFLIGHT.log 2>&1; then
            echo "PREFLIGHT_TEST_PASS=$label" | tee -a /tmp/R19_REPAIRS_01_14_PREFLIGHT.log
          else
            echo "PREFLIGHT_TEST_FAILED=$label" | tee -a /tmp/R19_REPAIRS_01_14_PREFLIGHT.log
            record_failure "TEST" "$label"
          fi
        }

        run_repair "PROJECT01" /tmp/mobdea-repairs/apply_project01.py
        run_contract "PROJECT01" node /tmp/mobdea-repairs/project01-test.mjs
        run_repair "PROJECT02" /tmp/mobdea-repairs/apply_project02.py
        run_contract "PROJECT02" node /tmp/mobdea-repairs/project02-test.mjs
        run_repair "PROJECT03" /tmp/mobdea-repairs/apply_project03.py
        run_contract "PROJECT03" node /tmp/mobdea-repairs/project03-test.mjs
        run_repair "PROJECT04" /tmp/mobdea-repairs/apply_project04.py
        run_contract "PROJECT04" node /tmp/mobdea-repairs/project04-test.mjs
        run_repair "PROJECT05" /tmp/mobdea-repairs/apply_project05.py
        run_contract "PROJECT05" node /tmp/mobdea-repairs/project05-test.mjs
        run_repair "PROJECT06" /tmp/mobdea-repairs/apply_project06.py
        run_contract "PROJECT06" node /tmp/mobdea-repairs/project06-test.mjs
        run_repair "PROJECT07" /tmp/mobdea-repairs/apply_project07.py
        run_contract "PROJECT07" node /tmp/mobdea-repairs/project07-test.mjs
        run_repair "PROJECT06_REFINEMENT" /tmp/mobdea-repairs/apply_project06_refinement.py
        run_contract "PROJECT06_REFINEMENT" node /tmp/mobdea-repairs/project06-refinement-test.mjs
        run_repair "PROJECT08" /tmp/mobdea-repairs/apply_project08.py
        run_contract "PROJECT08" node /tmp/mobdea-repairs/project08-test.mjs
        run_repair "PROJECT09" /tmp/mobdea-repairs/apply_project09.py
        run_contract "PROJECT09" node --test tests/project09-dashboard-responsive.test.mjs
        run_repair "PROJECT10" /tmp/mobdea-repairs/apply_project10.py
        run_contract "PROJECT10" node --test tests/project10-online-class.test.mjs
        run_repair "PROJECT11" /tmp/mobdea-repairs/apply_project11.py
        run_contract "PROJECT11" node --test tests/project11-student-sync.test.mjs
        run_repair "PROJECT12" /tmp/mobdea-repairs/apply_project12.py
        run_contract "PROJECT12" node --test tests/project12-integrated.test.mjs
        run_repair "PROJECT13" /tmp/mobdea-repairs/apply_project13.py
        run_contract "PROJECT13" node --test tests/project13-integrated.test.mjs
        run_repair "PROJECT14" /tmp/mobdea-repairs/apply_project14.py
        run_contract "PROJECT14" node --test tests/project14-youtube-auto-sync.test.mjs

        if [ "$FAIL_COUNT" -ne 0 ]; then
          echo "===== CONSOLIDATED PREFLIGHT FAILURES ====="
          cat /tmp/R19_REPAIRS_01_14_FAILURES.txt
          echo "TOTAL_PREFLIGHT_FAILURES=$FAIL_COUNT"
          echo "::error::Repairs 01-14 preflight found $FAIL_COUNT failure(s). See the consolidated list and diagnostic artifact."
          exit 1
        fi

        run_repair "FINAL_RECONCILIATION" /tmp/mobdea-repairs/final_integration_reconciliation.py
        run_repair "FINAL_SOURCE_AUDIT" /tmp/mobdea-repairs/final_source_audit.py

        if [ "$FAIL_COUNT" -ne 0 ]; then
          echo "===== FINAL INTEGRATION FAILURES ====="
          cat /tmp/R19_REPAIRS_01_14_FAILURES.txt
          exit 1
        fi

        python3 - <<'PY_PREFLIGHT_AUDIT'
        from pathlib import Path
        import re

        roots = [Path("src"), Path("android"), Path("cloud-worker")]
        marker_groups = [
            ("P01", ("PROJECT01_WHITEBOARD_ENGINE_V1",)),
            ("P02", ("PROJECT02_PDF_IMAGE_VIEWER_V1",)),
            ("P03", ("PROJECT03_TWIN_STUDENT_PANELS_V1",)),
            ("P04", ("PROJECT04_EDUCATIONAL_CARD_LAYOUT_V1",)),
            ("P05", ("PROJECT05_DUPLEX_STUDENT_CARDS_V1",)),
            ("P06", ("PROJECT06_PROFESSIONAL_TEACHING_MAPS_V1",)),
            ("P07", ("PROJECT07_MAP_CHALLENGE_SHARED_ENGINE_V1",)),
            ("P08", ("PROJECT08_OCR_EXAM_IMPORT_V1",)),
            ("P09", ("PROJECT09_DASHBOARD_RESPONSIVE_V1",)),
            ("P10", ("PROJECT10_ONLINE_CLASS_V1",)),
            ("P11", ("PROJECT11_RANDOM_STUDENT_SELECTION_V1", "PROJECT11_CROSS_DEVICE_CLASS_SYNC_V1")),
            ("P12", ("PROJECT12_UNIFIED_CLOUD_STUDENT_PORTAL_V1",)),
            ("P13", ("PROJECT13_BARCODE_ATTENDANCE_ACCOUNTING_V1",)),
            ("P14", ("PROJECT14_YOUTUBE_AUTO_SYNC_V1",)),
        ]
        corpus_parts = []
        conflicts = []
        for root in roots:
            if not root.exists():
                raise SystemExit(f"Required preflight root missing: {root}")
            for path in root.rglob("*"):
                if not path.is_file():
                    continue
                if path.suffix.lower() in {".js",".jsx",".mjs",".css",".java",".xml",".json",".gradle",".properties"}:
                    try:
                        text = path.read_text(encoding="utf-8")
                    except UnicodeDecodeError:
                        continue
                    corpus_parts.append(text)
                    if re.search(r"^(<<<<<<<|=======|>>>>>>>)", text, re.M):
                        conflicts.append(str(path))
        corpus = "\n".join(corpus_parts)
        missing = [name for name, choices in marker_groups if not all(choice in corpus for choice in choices)]
        if missing:
            raise SystemExit("Missing repair markers after full preflight: " + ", ".join(missing))
        if conflicts:
            raise SystemExit("Merge conflict markers: " + ", ".join(conflicts))
        print("All repair markers and merge-conflict checks: PASS")
        PY_PREFLIGHT_AUDIT

        find src cloud-worker -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | while IFS= read -r -d '' file; do
          node --check "$file"
        done

        cd "$GITHUB_WORKSPACE"
        echo "ALL_REPAIRS_01_14_PREFLIGHT=PASS"

    - name: Upload consolidated preflight diagnostics on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: mobdea-r19-run6-preflight-diagnostics
        path: "/tmp/R19_REPAIRS_01_14_PREFLIGHT.log\n/tmp/R19_REPAIRS_01_14_FAILURES.txt"
        if-no-files-found: warn
        retention-days: 14
    - name: Apply Project 01 whiteboard repair only
      shell: bash
      run: |
        set -euo pipefail
        python3 /tmp/mobdea-repairs/apply_project01.py
        git add -N src/styles/project01-whiteboard.css
        git diff --check

    - name: Project 01 contract tests
      shell: bash
      run: |
        set -euo pipefail
        node /tmp/mobdea-repairs/project01-test.mjs


    - name: Apply Project 02 PDF and image viewer repair only
      shell: bash
      run: |
        set -euo pipefail
        python3 /tmp/mobdea-repairs/apply_project02.py
        git add -N src/styles/project02-pdf-image-viewer.css
        git diff --check
    - name: Project 02 PDF and image viewer contract tests
      shell: bash
      run: |
        set -euo pipefail
        node /tmp/mobdea-repairs/project02-test.mjs
    - name: Apply Project 03 twin student panels repair only
      shell: bash
      run: |
        set -euo pipefail
        python3 /tmp/mobdea-repairs/apply_project03.py
        git add -N src/components/classmode/Project03StudentPanels.jsx src/styles/project03-student-panels.css
        git diff --check
    - name: Project 03 student panels contract tests
      shell: bash
      run: |
        set -euo pipefail
        node --check src/components/classmode/Project03StudentPanels.jsx || true
        node /tmp/mobdea-repairs/project03-test.mjs
    - name: Apply Project 04 educational card hierarchy and auto-fit only
      shell: bash
      run: |
        set -euo pipefail
        python3 /tmp/mobdea-repairs/apply_project04.py
        git add -N src/services/project04CardLayout.js src/styles/project04-card-layout.css
        git diff --check
    - name: Project 04 educational card contract tests
      shell: bash
      run: |
        set -euo pipefail
        node --check src/services/project04CardLayout.js
        node /tmp/mobdea-repairs/project04-test.mjs
    - name: Apply Project 05 student-card automatic duplex repair only
      shell: bash
      run: |
        set -euo pipefail
        python3 /tmp/mobdea-repairs/apply_project05.py
        git add -N src/styles/project05-student-card-duplex.css
        git diff --check
    - name: Project 05 duplex student-card contract tests
      shell: bash
      run: |
        set -euo pipefail
        node /tmp/mobdea-repairs/project05-test.mjs

    - name: Apply Project 06 professional teaching maps only
      shell: bash
      run: |
        set -euo pipefail
        python3 /tmp/mobdea-repairs/apply_project06.py
        git add -N src/data/project06TeachingMaps.js src/styles/project06-teaching-maps.css
        git diff --check
    - name: Project 06 professional teaching-map contract tests
      shell: bash
      run: |
        set -euo pipefail
        node --check src/data/project06TeachingMaps.js
        node /tmp/mobdea-repairs/project06-test.mjs

    - name: Apply Project 07 Map Challenge shared map engine only
      shell: bash
      run: |
        set -euo pipefail
        python3 /tmp/mobdea-repairs/apply_project07.py
        git add -N src/styles/project07-map-challenge-engine.css
        git diff --check
    - name: Project 07 Map Challenge shared-engine contract tests
      shell: bash
      run: |
        set -euo pipefail
        node /tmp/mobdea-repairs/project07-test.mjs

    - name: Preserve Project 06 Nile atlas blank-mode refinements
      shell: bash
      run: |
        set -euo pipefail
        python3 /tmp/mobdea-repairs/apply_project06_refinement.py
        git diff --check
    - name: Project 06 Nile refinement contract tests
      shell: bash
      run: |
        set -euo pipefail
        node /tmp/mobdea-repairs/project06-refinement-test.mjs
    - name: Apply Project 08 OCR exam import and game-bank repair only
      shell: bash
      run: |
        set -euo pipefail
        python3 /tmp/mobdea-repairs/apply_project08.py
        git add -N             src/services/project08QuestionImport.js             src/components/questions/Project08ExamOcrImport.jsx             src/styles/project08-ocr-question-import.css
        git diff --check
    - name: Project 08 OCR exam-import contract tests
      shell: bash
      run: |
        set -euo pipefail
        node --check src/services/ocrQuestionParser.js
        node --check src/services/project08QuestionImport.js
        node /tmp/mobdea-repairs/project08-test.mjs

    - name: Apply Project 09 responsive dashboard and tablet shell only
      shell: bash
      run: |
        set -euo pipefail
        python3 /tmp/mobdea-repairs/apply_project09.py
        git add -N             src/styles/project09-dashboard-responsive.css             tests/project09-dashboard-responsive.test.mjs
        git diff --check
    - name: Project 09 responsive dashboard contract tests
      shell: bash
      run: |
        set -euo pipefail
        node --check tests/project09-dashboard-responsive.test.mjs
        node --test tests/project09-dashboard-responsive.test.mjs


    - name: Apply Project 10 online lesson visibility connection and sync repair
      shell: bash
      run: |
        set -euo pipefail
        python3 /tmp/mobdea-repairs/apply_project10.py
        git add -N             src/styles/project10-online-class.css             tests/project10-online-class.test.mjs
        git diff --check
    - name: Project 10 online lesson contract tests
      shell: bash
      run: |
        set -euo pipefail
        node --check tests/project10-online-class.test.mjs
        node --test tests/project10-online-class.test.mjs


    - name: Apply Project 11 cross-device class sync random student picker and 
        improvement verification
      shell: bash
      run: |
        set -euo pipefail
        python3 /tmp/mobdea-repairs/apply_project11.py
        git add -N             src/services/project11StudentSelection.js             src/services/project11ClassSync.js             src/components/classmode/Project11ClassSyncBridge.jsx             src/styles/project11-student-sync.css             tests/project11-student-sync.test.mjs
        git diff --check
    - name: Project 11 cross-device sync random picker and improvement contract 
        tests
      shell: bash
      run: |
        set -euo pipefail
        node --check src/services/project11StudentSelection.js
        node --check src/services/project11ClassSync.js
        node --check tests/project11-student-sync.test.mjs
        node --test tests/project11-student-sync.test.mjs


    - name: Apply Project 12 integrated ClassMode questions cloud student portal
        and tablet voice
      shell: bash
      run: |
        set -euo pipefail
        python3 /tmp/mobdea-repairs/apply_project12.py
        printf '%s' '' | base64 -d | gzip -d > tests/project12-integrated.test.mjs
        git add -N src/services/project12PageQuestions.js src/components/classmode/Project12PageQuestionDock.jsx src/services/project12StudentCloud.js src/components/auth/Project12StudentPinGate.jsx src/styles/project12-classmode-cloud-voice.css tests/project12-integrated.test.mjs
        git diff --check
    - name: Project 12 integrated contract tests
      shell: bash
      run: |
        set -euo pipefail
        node --check src/services/project12PageQuestions.js
        node --check src/services/project12StudentCloud.js
        node --check tests/project12-integrated.test.mjs
        node --test tests/project12-integrated.test.mjs
        node --check cloud-worker/worker.js
        grep -q 'PROJECT12_TABLET_TTS_V1' android/app/src/main/java/com/mobdea/education/voice/MobdeaTextToSpeechPlugin.java
        grep -q 'PROJECT12_UNIFIED_CLOUD_STUDENT_PORTAL_V1' cloud-worker/worker.js

    - name: Apply Project 13 PDF focus barcode attendance links and exam 
        analytics
      shell: bash
      run: |
        set -euo pipefail
