          echo "All Repairs 01-14 source markers and final integration audit: PASS"
        } > /tmp/R19_FINAL_RELEASE_AUDIT.txt
        sha256sum "$APK" >> /tmp/R19_FINAL_RELEASE_AUDIT.txt
        cat /tmp/R19_FINAL_RELEASE_AUDIT.txt

    - name: Package final deep-reviewed Repairs 01-14 result
      shell: bash
      run: |
        set -euo pipefail
        OUT="/tmp/r19-final-deep-review-output"
        mkdir -p "$OUT"
        APK="android/app/build/outputs/apk/debug/app-debug.apk"
        cp "$APK" "$OUT/mobdea-r19-final-reviewed-01-14-debug.apk"
