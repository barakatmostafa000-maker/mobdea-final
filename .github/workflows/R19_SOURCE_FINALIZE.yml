name: Mobdea R19 Source Stabilize

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/R19_SOURCE_FINALIZE.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mobdea-r19-source-stabilize
  cancel-in-progress: false

jobs:
  stabilize-source:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout materialized R19 source
        uses: actions/checkout@v4
        with:
          ref: r19-unified
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Confirm R19 is already materialized
        shell: bash
        run: |
          set -euo pipefail

          node --input-type=module <<'NODE'
          const v = await import('./src/config/version.js');
          if (v.APP_VERSION !== '10.14.0') throw new Error(`Unexpected APP_VERSION: ${v.APP_VERSION}`);
          if (v.APP_VERSION_CODE !== 117) throw new Error(`Unexpected APP_VERSION_CODE: ${v.APP_VERSION_CODE}`);
          if (v.RELEASE_TAG !== 'R19') throw new Error(`Unexpected RELEASE_TAG: ${v.RELEASE_TAG}`);
          NODE

          test "$(node -p "require('./package.json').version")" = "10.14.0"
          test "$(node -p "require('./package.json').mobdea.versionCode")" = "117"

          test -f src/styles/r19-classmode-phase1.css
          test -f src/styles/r19-master-repairs.css
          test -f tests/r19-classmode-phase1.test.mjs
          test -f tests/r19-master-repairs.test.mjs
          test -f tests/r19-final-v3.test.mjs
          test -f src/data/countryCards.js

          grep -q 'versionCode 117' android/app/build.gradle
          grep -q 'versionName "10.14.0"' android/app/build.gradle

          grep -q 'data-testid="selected-student-point-plus"' src/pages/ClassMode.jsx
          grep -q 'data-testid="selected-student-praise"' src/pages/ClassMode.jsx
          grep -q 'data-testid="selected-student-warning"' src/pages/ClassMode.jsx
          ! grep -q 'student-point-minus' src/pages/ClassMode.jsx

          grep -q 'MOBDEA_RUNTIME_ICE' src/services/liveClass.js
          grep -q 'rememberLiveIceServers(created)' src/services/liveClass.js
          grep -q 'rememberLiveIceServers(joined)' src/services/liveClass.js

          grep -q 'MAX_ASSET_BYTES = 500 \* 1024 \* 1024' src/services/cloudSync.js
          grep -q 'MAX_ASSET_BYTES = 500 \* 1024 \* 1024' cloud-worker/worker.js
          grep -q 'MOBDEA_TURN_URLS' cloud-worker/worker.js

          grep -q 'MOBDEA_R19_FINAL' src/styles/r19-master-repairs.css
          grep -q 'object-fit: contain !important' src/styles/r19-master-repairs.css
          ! grep -Eq 'object-fit[[:space:]]*:[[:space:]]*fill[[:space:]]*!important' src/styles/r19-master-repairs.css

      - name: Make version synchronization deterministic and Prettier-safe
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/sync-version.mjs")
          text = path.read_text(encoding="utf-8")

          replacements = [
              ("APP_VERSION = '${version}';", 'APP_VERSION = "${version}";'),
              ("RELEASE_CHANNEL = 'stable';", 'RELEASE_CHANNEL = "stable";'),
              ("RELEASE_TAG = 'R19';", 'RELEASE_TAG = "R19";'),
          ]

          for old, new in replacements:
              if old in text:
                  text = text.replace(old, new)
              elif new not in text:
                  raise SystemExit(f"Version generator contract missing: {old}")

          path.write_text(text, encoding="utf-8")
          PY

          node scripts/sync-version.mjs

          node --input-type=module <<'NODE'
          const v = await import(`./src/config/version.js?stabilized=${Date.now()}`);
          if (v.APP_VERSION !== '10.14.0') throw new Error('Version sync changed APP_VERSION');
          if (v.APP_VERSION_CODE !== 117) throw new Error('Version sync changed APP_VERSION_CODE');
          if (v.RELEASE_TAG !== 'R19') throw new Error('Version sync changed RELEASE_TAG');
          NODE

          grep -Fq 'APP_VERSION = "${version}";' scripts/sync-version.mjs
          grep -Fq 'RELEASE_CHANNEL = "stable";' scripts/sync-version.mjs
          grep -Fq 'RELEASE_TAG = "R19";' scripts/sync-version.mjs

      - name: Final stable-source contracts
        shell: bash
        run: |
          set -euo pipefail

          node scripts/sync-version.mjs

          node --input-type=module <<'NODE'
          const v = await import(`./src/config/version.js?final=${Date.now()}`);
          if (v.APP_VERSION !== '10.14.0') throw new Error('Final APP_VERSION mismatch');
          if (v.APP_VERSION_CODE !== 117) throw new Error('Final APP_VERSION_CODE mismatch');
          if (v.RELEASE_TAG !== 'R19') throw new Error('Final RELEASE_TAG mismatch');
          NODE

          grep -Fq 'APP_VERSION = "${version}";' scripts/sync-version.mjs
          grep -Fq 'RELEASE_TAG = "R19";' scripts/sync-version.mjs
          grep -q 'versionCode 117' android/app/build.gradle
          grep -q 'versionName "10.14.0"' android/app/build.gradle
          grep -q 'data-testid="selected-student-point-plus"' src/pages/ClassMode.jsx
          ! grep -q 'student-point-minus' src/pages/ClassMode.jsx
          grep -q 'MOBDEA_RUNTIME_ICE' src/services/liveClass.js
          grep -q 'MAX_ASSET_BYTES = 500 \* 1024 \* 1024' src/services/cloudSync.js
          grep -q 'MAX_ASSET_BYTES = 500 \* 1024 \* 1024' cloud-worker/worker.js
          grep -q 'object-fit: contain !important' src/styles/r19-master-repairs.css
          ! grep -Eq 'object-fit[[:space:]]*:[[:space:]]*fill[[:space:]]*!important' src/styles/r19-master-repairs.css
          git diff --check

      - name: Persist stabilized R19 source
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            scripts/sync-version.mjs \
            src/config/version.js \
            android/app/build.gradle \
            public/update.manifest.json

          if git diff --cached --quiet; then
            echo "R19 source stabilization was already committed."
          else
            git commit -m "Stabilize R19 source version contract"
            git push origin HEAD:r19-unified
          fi

          echo "Stable R19 source HEAD: $(git rev-parse HEAD)"

      - name: Stabilization summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Mobdea R19 Source Stabilization"
            echo "- Existing final R19 source is preserved."
            echo "- Version generator is deterministic and Prettier-safe."
            echo "- No workflow file is created or updated in r19-unified."
            echo "- Only normal source files are pushed to r19-unified."
          } >> "$GITHUB_STEP_SUMMARY"
