name: R20 SAFE SURGICAL MERGE ON PROTECTED R19 FIX01-25
'on':
  workflow_dispatch: null
  push:
    branches:
    - main
    paths:
    - .github/workflows/R20_SAFE_R19_FIX01_25.yml
    - .github/r20_payload.zip
permissions:
  contents: read
  actions: read
env:
  R19_BASE_COMMIT: cd7e7cd597af23ca1169e1f19c3ac954727c3f2d
  EXPECTED_VERSION_NAME: 10.14.1
  EXPECTED_VERSION_CODE: '118'
  R19_PATCH_SHA256: cdde2432847080323e32430c86e5a717877a6f54a5c21a32820072c1761c7332
  R19_FIX3_PAYLOAD_COMMIT: 3477b1b9b7f2210823054634e4f840ff9744910c
jobs:
  r20_final_audited_01_26:
    name: Safe surgical R19 + FIX01-25 + final audit
    runs-on: ubuntu-24.04
    timeout-minutes: 800
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
    - name: Checkout workflow package commit
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
    - name: Preserve and verify R20 surgical repair payload
      shell: bash
      run: |
        set -euo pipefail
        test -f .github/r20_payload.zip
        echo "b6958f87ce6287685e98c3fd707eb7b7e0eec84eaa3471c615153b437138bb39  .github/r20_payload.zip" | sha256sum -c -
        cp .github/r20_payload.zip "$RUNNER_TEMP/r20_payload.zip"
    - name: Checkout exact protected R19 baseline
      uses: actions/checkout@v4
      with:
        ref: ${{ env.R19_BASE_COMMIT }}
        fetch-depth: 1
        clean: true
    - name: Restore FIX01-25 scripts over protected R19 workspace
      shell: bash
      run: |
        set -euo pipefail
        unzip -q "$RUNNER_TEMP/r20_payload.zip" -d .
        test -f .github/r20/scripts/002_Confirm_protected_baseline.sh
        chmod +x .github/r20/scripts/*.sh
    - name: Confirm protected baseline
