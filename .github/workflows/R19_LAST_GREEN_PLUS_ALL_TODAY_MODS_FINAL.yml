        \ = [token for token in forbidden if token in text]\nif remaining:\n    raise SystemExit(\n        \"API-26 file I/O\
        \ remains in OCR plugin: \" + \", \".join(remaining)\n    )\n\nrequired = [\n    \"java.io.InputStream in = new java.io.FileInputStream(file)\"\
        ,\n    \"java.io.ByteArrayOutputStream out = new java.io.ByteArrayOutputStream()\",\n    \"while ((n = in.read(buffer))\
        \ != -1)\",\n    \"StandardCharsets.UTF_8\",\n]\nmissing = [token for token in required if token not in text]\nif\
        \ missing:\n    raise SystemExit(\n        \"API-23-safe OCR file reader contract incomplete: \" + \", \".join(missing)\n\
        \    )\n\nprint(\"R20 OCR Android file reader is API-23-safe: PASS\")\nPY_ANDROID_API23\n\n! grep -Fq \"java.nio.file.Files\"\
        \ android/app/src/main/java/com/mobdea/education/ocr/R20PageOcrPlugin.java\n! grep -Fq \"Files.readAllBytes\" android/app/src/main/java/com/mobdea/education/ocr/R20PageOcrPlugin.java\n\
        ! grep -Fq \"file.toPath()\" android/app/src/main/java/com/mobdea/education/ocr/R20PageOcrPlugin.java\n"
    - name: Verify last-green Android runtime toolchain
      shell: bash
      run: "set -euo pipefail\n\nSDK=\"${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}\"\nBT=\"$SDK/build-tools/35.0.0\"\n\ntest -n\
        \ \"$SDK\"\ntest -s \"$SDK/platforms/android-35/android.jar\"\ntest -x \"$BT/aapt\"\ntest -x \"$BT/apksigner\"\ntest\
        \ -x \"$BT/zipalign\"\n\njava -version 2>&1 | tee /tmp/r20-java-version.txt\nnode --version | tee /tmp/r20-node-version.txt\n\
        \n(\n  cd android\n  chmod +x gradlew\n  ./gradlew --version\n) 2>&1 | tee /tmp/r20-gradle-version.txt\n\ngrep -Eq\
        \ 'Gradle[[:space:]]+8\\.11\\.1' /tmp/r20-gradle-version.txt\n\n# Gradle itself proves the Android project/configuration\
        \ loads.\n# This replaces brittle literal greps against build.gradle formatting.\n(\n  cd android\n  ./gradlew --no-daemon\
        \ :app:tasks --all\n) 2>&1 | tee /tmp/r20-gradle-project-load.log\n\n\"$BT/aapt\" version | tee /tmp/r20-aapt-version.txt\n\
        \"$BT/apksigner\" --version | tee /tmp/r20-apksigner-version.txt\n\n# Help output is diagnostic only; some versions\
        \ return non-zero for -h.\n\"$BT/zipalign\" -h > /tmp/r20-zipalign-help.txt 2>&1 || true\n\necho \"Last-green Android\
        \ runtime toolchain: PASS\"\n"
    - name: Android Java compile gate
      shell: bash
      working-directory: android
      run: "set -euo pipefail\nchmod +x gradlew\n\nset +e\n./gradlew --no-daemon :app:compileDebugJavaWithJavac --stacktrace\
        \ 2>&1 | tee /tmp/r20-java-compile.log\nJAVA_RC=${PIPESTATUS[0]}\nset -e\n\nif [ \"$JAVA_RC\" -ne 0 ]; then\n  echo\
        \ \"::group::Java compiler error summary\"\n  grep -nE '(^|: )(error:|cannot find symbol|symbol:|location:)' /tmp/r20-java-compile.log\
        \ || true\n  echo \"::endgroup::\"\n  exit \"$JAVA_RC\"\nfi\n\necho \"Android Java compile: PASS\"\n"
    - name: Android debug unit test gate
