    - name: Verify final APK identity signature and alignment
      shell: bash
      run: 'set -euo pipefail

        SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

        BT="$SDK/build-tools/35.0.0"

        APK="android/app/build/outputs/apk/debug/app-debug.apk"


        test -s "$APK"

        test -x "$BT/aapt"

        test -x "$BT/apksigner"

        test -x "$BT/zipalign"


        "$BT/aapt" dump badging "$APK" > /tmp/apk-badging.txt

        head -30 /tmp/apk-badging.txt


        grep -Fq "package: name=''com.mobdea.education''" /tmp/apk-badging.txt

        grep -Fq "versionCode=''$EXPECTED_VERSION_CODE''" /tmp/apk-badging.txt

        grep -Fq "versionName=''$EXPECTED_VERSION_NAME''" /tmp/apk-badging.txt


        unzip -l "$APK" > /tmp/apk-files.txt

        grep -Fq "assets/public/index.html" /tmp/apk-files.txt


        unzip -t "$APK" 2>&1 | tee /tmp/apk-unzip-test.log


        "$BT/apksigner" verify --verbose --print-certs "$APK" 2>&1 | tee /tmp/apksigner.txt

        "$BT/zipalign" -c -v 4 "$APK" 2>&1 | tee /tmp/zipalign.txt


        sha256sum "$APK" | tee /tmp/apk.sha256

        echo "Final R20 APK verification: PASS"

        '
