        \ /tmp/r20-unit-test.log\nTEST_RC=${PIPESTATUS[0]}\nset -e\n\nif [ \"$TEST_RC\" -ne 0 ]; then\n  echo \"::group::Android\
        \ unit-test failure summary\"\n  grep -nE 'FAILED|FAILURE:|There were failing tests|Execution failed for task|error:|Exception'\
