name: R19 LAST GREEN + ALL TODAY MODS FINAL
'on':
  workflow_dispatch: null
  push:
    branches:
    - main
    paths:
    - .github/workflows/R19_LAST_GREEN_PLUS_ALL_TODAY_MODS_FINAL.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: r19-last-green-plus-all-today-mods-final
  cancel-in-progress: true
env:
  R19_BASE_COMMIT: cd7e7cd597af23ca1169e1f19c3ac954727c3f2d
  RUN17_RUN_ID: '32697570904'
  RUN17_ARTIFACT_NAME: mobdea-r19-run17-full-result
  RUN17_PATCH_SHA256: 6bc7ddab1e908916cf1bb01c59a4aff463c33220931f82c314c27178ce7d4270
  RUN17_FIXED_TAR_SHA256: d7b7ef0f92f4396e0bdb3cfdb55d19ca3669564ed2ab61a6e2b98d74352dd1b0
  LAST_GREEN_RUN_ID: '32714480207'
  LAST_GREEN_ARTIFACT_NAME: mobdea-r19-final-01-14-fix8-13-v118
  R20_SOURCE_TAR_SHA256: 03804eefcfa7b8c2284dfb56303b7ff187af672036f041f41f267dd4283f653c
  EXPECTED_VERSION_NAME: 10.14.1
  EXPECTED_VERSION_CODE: '118'
jobs:
  build-r20-final:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
    - name: Checkout exact R19 baseline
      uses: actions/checkout@v4
      with:
        ref: ${{ env.R19_BASE_COMMIT }}
        fetch-depth: 1
    - name: Verify exact clean baseline
      shell: bash
      run: 'set -euo pipefail

        test "$(git rev-parse HEAD)" = "$R19_BASE_COMMIT"

        test -z "$(git status --porcelain)"

        test -f package.json

        test -f package-lock.json

        test -d android

        echo "Exact R19 baseline verified: $R19_BASE_COMMIT"

        '
    - name: Setup Node 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: package-lock.json
    - name: Setup Java 21
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
        cache: gradle
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    - name: Install required Android SDK packages
      shell: bash
      run: "set -euo pipefail\nSDK=\"${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}\"\ntest -n \"$SDK\"\nyes | sdkmanager --licenses\
        \ >/dev/null 2>&1 || true\nfor attempt in 1 2 3; do\n  if sdkmanager \"platform-tools\" \"platforms;android-35\" \"\
        build-tools;34.0.0\" \"build-tools;35.0.0\"; then\n    break\n  fi\n  if [ \"$attempt\" -eq 3 ]; then\n    echo \"\
        ::error::Android SDK package installation failed.\"\n    exit 1\n  fi\n  sleep $((attempt * 5))\ndone\ntest -s \"\
        $SDK/platforms/android-35/android.jar\"\ntest -x \"$SDK/build-tools/34.0.0/aapt2\"\ntest -x \"$SDK/build-tools/35.0.0/aapt\"\
        \ntest -x \"$SDK/build-tools/35.0.0/apksigner\"\ntest -x \"$SDK/build-tools/35.0.0/zipalign\"\necho \"$SDK/build-tools/35.0.0\"\
        \ >> \"$GITHUB_PATH\"\nprintf 'sdk.dir=%s\\n' \"$SDK\" > android/local.properties\n"
    - name: Download reviewed RUN17 repair artifact
      uses: actions/download-artifact@v4
      with:
        name: ${{ env.RUN17_ARTIFACT_NAME }}
        run-id: ${{ env.RUN17_RUN_ID }}
        github-token: ${{ github.token }}
        repository: ${{ github.repository }}
        path: /tmp/r19-run17
    - name: Verify and apply reviewed Repairs 01-14 final diff
      shell: bash
      run: "set -euo pipefail\nPATCH=\"/tmp/r19-run17/R19_RUN17_FINAL.patch\"\ntest -s \"$PATCH\"\nACTUAL=\"$(sha256sum \"\
        $PATCH\" | awk '{print $1}')\"\ntest \"$ACTUAL\" = \"$RUN17_PATCH_SHA256\"\n\ngit apply --check \"$PATCH\"\ngit apply\
        \ \"$PATCH\"\n\nFIXED_TAR=\"/tmp/r19-run17/R19_RUN17_FIXED_FILES.tar.gz\"\ntest -s \"$FIXED_TAR\"\nTAR_ACTUAL=\"$(sha256sum\
        \ \"$FIXED_TAR\" | awk '{print $1}')\"\ntest \"$TAR_ACTUAL\" = \"$RUN17_FIXED_TAR_SHA256\"\n\ntar -xzf \"$FIXED_TAR\"\
        \ -C . \\\n  tests/run15-build-readiness.test.mjs \\\n  tests/run15-runtime-contract.test.mjs\n\ntest -s tests/run15-build-readiness.test.mjs\n\
        test -s tests/run15-runtime-contract.test.mjs\ngit add -N tests/run15-build-readiness.test.mjs tests/run15-runtime-contract.test.mjs\n\
        \ngit diff --check\n\nnode - <<'NODE_VERSION'\nconst fs = require('node:fs');\nconst pkg = JSON.parse(fs.readFileSync('package.json',\
        \ 'utf8'));\nif (pkg.version !== process.env.EXPECTED_VERSION_NAME) {\n  throw new Error(`Unexpected versionName:\
        \ ${pkg.version}`);\n}\nif (String(pkg.mobdea?.versionCode) !== process.env.EXPECTED_VERSION_CODE) {\n  throw new\
        \ Error(`Unexpected versionCode: ${pkg.mobdea?.versionCode}`);\n}\nNODE_VERSION\n"
    - name: Close RUN18 Attendance WhatsApp root cause
      shell: bash
      run: "set -euo pipefail\npython3 - <<'PY_RUN18_ROOT'\nfrom pathlib import Path\nimport re\n\nnotifications = Path(\"\
        src/services/notifications.js\")\nattendance = Path(\"src/pages/Attendance.jsx\")\nif not notifications.is_file()\
        \ or not attendance.is_file():\n    raise SystemExit(\"Required Attendance/notifications source missing\")\n\nsource\
        \ = notifications.read_text(encoding=\"utf-8\")\nif not re.search(r\"\\bexport\\s+(?:async\\s+)?function\\s+sendAbsenceWhatsApp\\\
        b\", source):\n    source = source.rstrip() + r'''\n\n// RUN18_ATTENDANCE_WHATSAPP_EXPORT_CLOSURE_V1\nexport function\
        \ sendAbsenceWhatsApp(student = {}, session = {}, date = '') {\n  const rawPhone = String(student?.guardianPhone ||\
        \ '').trim();\n  const normalized = rawPhone.replace(/\\D/g, '').replace(/^0/, '20');\n  if (!normalized) {\n    return\
        \ { ok: false, message: 'لا يوجد رقم هاتف مسجل لولي الأمر.' };\n  }\n  const safeDate = String(date || new Date().toISOString().slice(0,\
        \ 10));\n  const message = cleanWhatsAppMessage(\n    buildAttendanceMessage(student?.name || 'الطالب', 'absent',\
        \ safeDate),\n  );\n  if (typeof window === 'undefined' || typeof window.open !== 'function') {\n    return { ok:\
        \ false, message: 'فتح واتساب متاح من التطبيق أو المتصفح فقط.' };\n  }\n  const url = `https://wa.me/${normalized}?text=${encodeURIComponent(message)}`;\n\
        \  window.open(url, '_blank', 'noopener,noreferrer');\n  return { ok: true, message: `تم فتح واتساب لإبلاغ ولي أمر\
        \ ${student?.name || 'الطالب'}.` };\n}\n'''\n    notifications.write_text(source, encoding=\"utf-8\")\n\nattendance_source\
        \ = attendance.read_text(encoding=\"utf-8\")\nif \"sendAbsenceWhatsApp\" not in attendance_source:\n    raise SystemExit(\"\
        Attendance no longer calls sendAbsenceWhatsApp\")\nupdated = notifications.read_text(encoding=\"utf-8\")\nif not re.search(r\"\
        \\bexport\\s+(?:async\\s+)?function\\s+sendAbsenceWhatsApp\\b\", updated):\n    raise SystemExit(\"sendAbsenceWhatsApp\
        \ export was not created\")\nPY_RUN18_ROOT\n\nnode --check src/services/notifications.js\ngit diff --check\n"
    - name: Download actual last green R19 V6 artifact
      uses: actions/download-artifact@v4
      with:
        name: ${{ env.LAST_GREEN_ARTIFACT_NAME }}
        run-id: ${{ env.LAST_GREEN_RUN_ID }}
        github-token: ${{ github.token }}
        repository: ${{ github.repository }}
        path: /tmp/r19-last-green
    - name: Restore exact last green V6 source closures
      shell: bash
      run: "set -euo pipefail\n\nfor f in \\\n  /tmp/r19-last-green/ClassMode.V6.jsx \\\n  /tmp/r19-last-green/MapChallenge.V6.jsx\
        \ \\\n  /tmp/r19-last-green/AppShell.V6.jsx \\\n  /tmp/r19-last-green/R19-FINAL-RUNTIME-FIXES.css \\\n  /tmp/r19-last-green/REGRESSION-CONTRACT-COMPATIBILITY.patch;\
        \ do\n  test -s \"$f\" || { echo \"::error::Missing last-green artifact file: $f\"; exit 1; }\ndone\n\ncp /tmp/r19-last-green/ClassMode.V6.jsx\
        \ src/pages/ClassMode.jsx\ncp /tmp/r19-last-green/MapChallenge.V6.jsx src/pages/MapChallenge.jsx\ncp /tmp/r19-last-green/AppShell.V6.jsx\
        \ src/components/AppShell.jsx\ncp /tmp/r19-last-green/R19-FINAL-RUNTIME-FIXES.css src/styles/r19-final-runtime-fixes.css\n\
        \npython3 - <<'PY_V6_IMPORT'\nfrom pathlib import Path\n\nmain = Path(\"src/main.jsx\")\nsource = main.read_text(encoding=\"\
        utf-8\")\nfinal_import = \"import './styles/r19-final-runtime-fixes.css';\"\nanchor = \"import './styles/project14-youtube-auto-sync.css';\"\
        \n\nsource = source.replace(final_import + \"\\n\", \"\").replace(final_import, \"\")\nif anchor not in source:\n\
        \    raise SystemExit(\"Last-green CSS import anchor missing\")\nsource = source.replace(anchor, anchor + \"\\n\"\
        \ + final_import, 1)\nmain.write_text(source, encoding=\"utf-8\")\n\ncheck = main.read_text(encoding=\"utf-8\")\n\
        if check.find(final_import) < check.find(anchor):\n    raise SystemExit(\"Last-green CSS precedence verification failed\"\
        )\nPY_V6_IMPORT\n\ngit apply --check /tmp/r19-last-green/REGRESSION-CONTRACT-COMPATIBILITY.patch\ngit apply /tmp/r19-last-green/REGRESSION-CONTRACT-COMPATIBILITY.patch\n\
        \ngit diff --check\n"
    - name: Validate and repair recovered Android Gradle structure
      shell: bash
      run: "set -euo pipefail\npython3 - <<'PY_GRADLE_STRUCTURE'\nfrom pathlib import Path\n\npath = Path('android/app/build.gradle')\n\
        text = path.read_text(encoding='utf-8')\nbad = \"    lint {\\n        abortOnError true\\n        checkReleaseBuilds\
        \ true\\n        warningsAsErrors false\\n    }\\n    }\\n}\\n\\nrepositories {\"\ngood = \"    lint {\\n        abortOnError\
        \ true\\n        checkReleaseBuilds true\\n        warningsAsErrors false\\n    }\\n}\\n\\nrepositories {\"\n\nif\
        \ bad in text:\n    path.write_text(text.replace(bad, good, 1), encoding='utf-8')\nelif good not in text:\n    if\
        \ 'android {' not in text or 'defaultConfig {' not in text:\n        raise SystemExit('Android Gradle structure is\
        \ not recognized')\nPY_GRADLE_STRUCTURE\n\ngit diff --check\n"
    - name: Last green R19 V6 source guards
      shell: bash
      run: "set -euo pipefail\n\npython3 - <<'PY_R19_GUARDS'\nfrom pathlib import Path\n\nclass_source = Path(\"src/pages/ClassMode.jsx\"\
        ).read_text(encoding=\"utf-8\")\nrelated = class_source.find(\"const relatedQuestions = useMemo\")\nproject12 = class_source.find(\"\
        const [project12QuestionScope\")\nif related < 0 or project12 < 0 or related >= project12:\n    raise SystemExit(\"\
        ClassMode TDZ guard failed\")\n\nmain_source = Path(\"src/main.jsx\").read_text(encoding=\"utf-8\")\nif \"r19-final-runtime-fixes.css\"\
        \ not in main_source:\n    raise SystemExit(\"Final runtime stylesheet import missing\")\n\nmap_source = Path(\"src/pages/MapChallenge.jsx\"\
        ).read_text(encoding=\"utf-8\")\nkeys = map_source.split(\"const coreRegionKeys\", 1)[1].split(\"];\", 1)[0]\nif '\"\
        nile\"' not in keys:\n    raise SystemExit(\"Map Challenge Nile tab guard failed\")\n\nshell_source = Path(\"src/components/AppShell.jsx\"\
        ).read_text(encoding=\"utf-8\")\nif \"document.querySelector('.app-shell-v103:not(.lesson-mode-shell) > .app-content')\"\
        \ not in shell_source:\n    raise SystemExit(\"AppShell content-scroll reset guard failed\")\n\nruntime_css = Path(\"\
        src/styles/r19-final-runtime-fixes.css\").read_text(encoding=\"utf-8\")\nfor marker in (\n    \"R19_FINAL_RUNTIME_FIXES_V2\"\
        ,\n    \".map-challenge-pro > .map-game-layout\",\n    \".map-challenge-pro .map-game-question-panel\",\n    \".dashboard-v103\
        \ .dashboard-reference-copy p\",\n    \"overflow-y: auto !important\",\n):\n    if marker not in runtime_css:\n  \
        \      raise SystemExit(f\"R19 V6 CSS marker missing: {marker}\")\nPY_R19_GUARDS\n\ngit diff --check\n"
    - name: Fetch and verify fixed R20 source package
      shell: bash
      run: "set -euo pipefail\n\nREPO=\"${GITHUB_REPOSITORY}\"\nREF=\"${GITHUB_SHA}\"\nBASE_URL=\"https://raw.githubusercontent.com/${REPO}/${REF}\"\
        \n\nrm -rf /tmp/r20-parts\nmkdir -p /tmp/r20-parts\n\nfor n in 01 02 03 04; do\n  FILE=\"R20_SOURCE_RELEASE_FIXED2.tar.gz.b64.part${n}\"\
        \n  curl --fail --location --retry 4 --retry-all-errors \\\n    --connect-timeout 20 --max-time 120 \\\n    \"${BASE_URL}/${FILE}\"\
        \ \\\n    --output \"/tmp/r20-parts/${FILE}\"\n  test -s \"/tmp/r20-parts/${FILE}\"\ndone\n\ncat /tmp/r20-parts/R20_SOURCE_RELEASE_FIXED2.tar.gz.b64.part*\
        \ \\\n  | base64 -d > /tmp/R20_SOURCE_RELEASE.tar.gz\n\nACTUAL=\"$(sha256sum /tmp/R20_SOURCE_RELEASE.tar.gz | awk\
        \ '{print $1}')\"\necho \"R20 source expected: $R20_SOURCE_TAR_SHA256\"\necho \"R20 source actual:   $ACTUAL\"\ntest\
        \ \"$ACTUAL\" = \"$R20_SOURCE_TAR_SHA256\"\n\ntar -tzf /tmp/R20_SOURCE_RELEASE.tar.gz > /tmp/r20-tar-list.txt\ntest\
        \ -s /tmp/r20-tar-list.txt\n"
    - name: Apply all today mods onto protected R19 last green
      shell: bash
      run: "set -euo pipefail\n\nrm -rf /tmp/r20-safe-overlay\nmkdir -p /tmp/r20-safe-overlay\ntar -xzf /tmp/R20_SOURCE_RELEASE.tar.gz\
        \ -C /tmp/r20-safe-overlay\n\necho \"R20 archive extracted to /tmp only. R19 tree is still protected.\"\n\npython3\
        \ - <<'PY_SAFE_R20_MERGE'\nfrom pathlib import Path\nimport shutil\nimport re\nimport base64\n\nroot = Path(\".\"\
        )\noverlay = Path(\"/tmp/r20-safe-overlay\")\n\ndef copy_file(rel):\n    src = overlay / rel\n    dst = root / rel\n\
        \    if not src.is_file():\n        raise SystemExit(f\"Missing R20 overlay file: {rel}\")\n    dst.parent.mkdir(parents=True,\
        \ exist_ok=True)\n    shutil.copy2(src, dst)\n\nfor pattern in [\n    \"scripts/r20*\",\n    \"src/config/r20*\",\n\
        \    \"src/services/r20*\",\n    \"src/styles/r20*\",\n    \"tests/r20*.test.mjs\",\n]:\n    for src in overlay.glob(pattern):\n\
        \        if not src.is_file():\n            continue\n        rel = src.relative_to(overlay)\n        dst = root /\
        \ rel\n        dst.parent.mkdir(parents=True, exist_ok=True)\n        shutil.copy2(src, dst)\n\ncopy_file(\"android/app/src/main/java/com/mobdea/education/ocr/R20PageOcrPlugin.java\"\
        )\ncopy_file(\"cloud-worker/r20PortalAccounts.js\")\n\nr20_owned = []\nfor pattern in [\n    \"scripts/r20*\",\n \
        \   \"src/config/r20*\",\n    \"src/services/r20*\",\n    \"src/styles/r20*\",\n    \"tests/r20*.test.mjs\",\n]:\n\
        \    for source in overlay.glob(pattern):\n        if source.is_file():\n            rel = source.relative_to(overlay)\n\
        \            target = root / rel\n            if not target.is_file() or target.read_bytes() != source.read_bytes():\n\
        \                raise SystemExit(f\"R20 owned file copy mismatch: {rel}\")\n            r20_owned.append(str(rel))\n\
        \nif len(set(r20_owned)) != 128:\n    raise SystemExit(\n        f\"Expected 128 R20-owned patterned files, got {len(set(r20_owned))}\"\
        \n    )\n\nfor rel in [\n    \"android/app/src/main/java/com/mobdea/education/ocr/R20PageOcrPlugin.java\",\n    \"\
        cloud-worker/r20PortalAccounts.js\",\n]:\n    if not (root / rel).is_file():\n        raise SystemExit(f\"Missing\
        \ required R20 additive file: {rel}\")\n\nprint(\"All 130 additive R20 files preserved before integration: PASS\"\
        )\n\nr19_css = root / \"src/styles/r19-final-runtime-fixes.css\"\nif not r19_css.is_file():\n    copy_file(\"src/styles/r19-final-runtime-fixes.css\"\
        )\n\npath = root / \"android/app/src/main/java/com/mobdea/education/MainActivity.java\"\ntext = path.read_text(encoding=\"\
        utf-8\")\nif \"import com.mobdea.education.ocr.R20PageOcrPlugin;\" not in text:\n    anchor = \"import com.mobdea.education.ocr.MobdeaPdfOcrPlugin;\"\
        \n    if anchor not in text:\n        raise SystemExit(\"R19 MainActivity OCR import anchor is missing\")\n    text\
        \ = text.replace(anchor, anchor + \"\\nimport com.mobdea.education.ocr.R20PageOcrPlugin;\", 1)\nif \"registerPlugin(R20PageOcrPlugin.class);\"\
        \ not in text:\n    anchor = \"        registerPlugin(MobdeaPdfOcrPlugin.class);\"\n    if anchor not in text:\n \
        \       raise SystemExit(\"R19 MainActivity OCR registration anchor is missing\")\n    text = text.replace(anchor,\
        \ anchor + \"\\n        registerPlugin(R20PageOcrPlugin.class);\", 1)\nif \"R20_FIX01_TABLET_MEDIA_WEBVIEW_V1\" not\
        \ in text:\n    anchor = \"        super.onCreate(savedInstanceState);\"\n    if anchor not in text:\n        raise\
        \ SystemExit(\"R19 MainActivity onCreate anchor is missing\")\n    block = \"\"\"\n        // R20_FIX01_TABLET_MEDIA_WEBVIEW_V1\n\
        \        if (getBridge() != null && getBridge().getWebView() != null) {\n            getBridge().getWebView().post(()\
        \ -> {\n                android.webkit.WebSettings settings =\n                    getBridge().getWebView().getSettings();\n\
        \                settings.setMediaPlaybackRequiresUserGesture(false);\n                settings.setDomStorageEnabled(true);\n\
        \                settings.setAllowContentAccess(true);\n                settings.setAllowFileAccess(true);\n     \
        \           if (android.os.Build.VERSION.SDK_INT >=\n                    android.os.Build.VERSION_CODES.LOLLIPOP)\
        \ {\n                    settings.setMixedContentMode(\n                        android.webkit.WebSettings.MIXED_CONTENT_COMPATIBILITY_MODE\n\
        \                    );\n                }\n            });\n        }\n\"\"\"\n    text = text.replace(anchor, anchor\
        \ + block, 1)\npath.write_text(text, encoding=\"utf-8\")\n\npath = root / \"cloud-worker/worker.js\"\ntext = path.read_text(encoding=\"\
        utf-8\")\nif \"maybeHandleR20PortalAccounts\" not in text:\n    text = \"import { maybeHandleR20PortalAccounts } from\
        \ './r20PortalAccounts.js';\\n\" + text\nif \"const R20_LEGACY_WORKER =\" not in text:\n    token = \"export default\
        \ {\"\n    index = text.find(token)\n    if index < 0:\n        raise SystemExit(\"R19 worker export default was not\
        \ found\")\n    text = text[:index] + \"const R20_LEGACY_WORKER = {\" + text[index + len(token):]\n    text += \"\"\
        \"\n\n/* R20_FIX04_WORKER_WRAPPER_V1\n * SAFE MERGE: the complete R19 worker remains the default handler.\n */\nexport\
        \ default {\n  async fetch(request, env, ctx) {\n    const accountResponse = await maybeHandleR20PortalAccounts(request,\
        \ env);\n    if (accountResponse) return accountResponse;\n    return R20_LEGACY_WORKER.fetch(request, env, ctx);\n\
        \  },\n};\n\"\"\"\npath.write_text(text, encoding=\"utf-8\")\n\n# R20 portal login must feed the existing R19 App\
        \ role model.\npath = root / \"src/services/r20PortalLoginBridge.js\"\ntext = path.read_text(encoding=\"utf-8\")\n\
        old = 'function appSession(s){if(![\"student\",\"parent\"].includes(s?.role))return;localStorage.setItem(APP_AUTH_KEY,JSON.stringify({role:s.role,name:s.displayName||\"\
        \",expiresAt:Date.now()+43200000,r20Portal:true,accountId:s.accountId,studentId:s.studentId||null,linkedStudentIds:s.linkedStudentIds||[]}));}'\n\
        new = 'function appSession(s){if(![\"student\",\"parent\"].includes(s?.role))return;const appRole=s.role===\"parent\"\
        ?\"guardian\":\"student\";localStorage.setItem(APP_AUTH_KEY,JSON.stringify({role:appRole,name:s.displayName||\"\"\
        ,expiresAt:Date.now()+43200000,r20Portal:true,cloudPortal:true,accountId:s.accountId,studentId:s.studentId||null,studentCode:s.role===\"\
        student\"?(s.accountId||\"\"):\"\",guardianPhone:s.role===\"parent\"?(s.accountId||\"\"):\"\",linkedStudentIds:s.linkedStudentIds||[]}));}'\n\
        if old in text:\n    text = text.replace(old, new, 1)\nelif new not in text:\n    raise SystemExit(\"R20 portal app-session\
        \ integration anchor changed unexpectedly\")\npath.write_text(text, encoding=\"utf-8\")\n\npath = root / \"src/services/ocrQuestionParser.js\"\
        \ntext = path.read_text(encoding=\"utf-8\")\nif \"block.sourceAnswer = answer;\" not in text:\n    old = \"  let answer\
        \ = normalizeOcrText(rawAnswer);\\n  if (!answer) return;\"\n    new = (\n        \"  let answer = normalizeOcrText(rawAnswer);\\\
        n\"\n        \"  if (!answer) return;\\n\"\n        \"  // R20 SAFE: preserve explicit source label for review/display.\\\
        n\"\n        \"  block.sourceAnswer = answer;\"\n    )\n    if old not in text:\n        raise SystemExit(\"R19 OCR\
        \ answer anchor changed unexpectedly\")\n    text = text.replace(old, new, 1)\nif \"output.push(`الإجابة: ${block.sourceAnswer\
        \ || block.answer}`);\" not in text:\n    old = \"output.push(`الإجابة: ${block.answer}`);\"\n    if old not in text:\n\
        \        raise SystemExit(\"R19 OCR output anchor changed unexpectedly\")\n    text = text.replace(old, \"output.push(`الإجابة:\
        \ ${block.sourceAnswer || block.answer}`);\", 1)\nif \"sourceAnswer: block.sourceAnswer || block.answer,\" not in\
        \ text:\n    old = \"      answer: block.answer,\\n      answerIndex:\"\n    if old not in text:\n        raise SystemExit(\"\
        R19 OCR record anchor changed unexpectedly\")\n    text = text.replace(\n        old,\n        \"      answer: block.answer,\\\
        n\"\n        \"      sourceAnswer: block.sourceAnswer || block.answer,\\n\"\n        \"      answerIndex:\",\n   \
        \     1,\n    )\npath.write_text(text, encoding=\"utf-8\")\n\npath = root / \"src/services/pdfQuestionOcr.js\"\ntext\
        \ = path.read_text(encoding=\"utf-8\")\ntext = text.replace('registerPlugin(\"R20PageOcr\")', 'registerPlugin(\"MobdeaPdfOcr\"\
        )')\npath.write_text(text, encoding=\"utf-8\")\n\npath = root / \"src/pages/ClassMode.jsx\"\ntext = path.read_text(encoding=\"\
        utf-8\")\nif \"recognizePageForQuestions\" not in text:\n    anchor = \"import Project13LinkHub from '../components/links/Project13LinkHub';\"\
        \n    if anchor not in text:\n        raise SystemExit(\"R19 V6 ClassMode import anchor is missing\")\n    text =\
        \ text.replace(\n        anchor,\n        anchor + \"\\nimport { recognizePageForQuestions } from '../services/r20PageOcrPipeline.js';\"\
        ,\n        1,\n    )\nif \"R20_FIX08_CLASSMODE_OCR_BRIDGE\" not in text:\n    anchor = \"const PROJECT13_CLASSMODE_IMAGE_LINKS_V1\
