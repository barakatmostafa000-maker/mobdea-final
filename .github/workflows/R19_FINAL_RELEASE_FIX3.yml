name: R19 Final Release Fix3 APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r19-final-release-fix3-apk
  cancel-in-progress: true

jobs:
  build-r19-final:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      CI: "true"
      R19_TARGETED_BACKUP: /tmp/r19-targeted-backup
      R19_BASE_COMMIT: cd7e7cd597af23ca1169e1f19c3ac954727c3f2d

    steps:
      - name: Checkout exact reviewed R19 source
        uses: actions/checkout@v4
        with:
          ref: cd7e7cd597af23ca1169e1f19c3ac954727c3f2d
          fetch-depth: 1

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Verify exact R19 baseline semantically
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$R19_BASE_COMMIT"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const version = await import('./src/config/version.js');
          const manifest = JSON.parse(fs.readFileSync('public/update.manifest.json', 'utf8'));
          const gradle = fs.readFileSync('android/app/build.gradle', 'utf8');
          const fail = (message) => { throw new Error(message); };
          if (pkg.version !== '10.14.0') fail(`package version is ${pkg.version}`);
          if (Number(pkg.mobdea?.versionCode) !== 117) fail(`package versionCode is ${pkg.mobdea?.versionCode}`);
          if (version.APP_VERSION !== '10.14.0') fail(`APP_VERSION is ${version.APP_VERSION}`);
          if (Number(version.APP_VERSION_CODE) !== 117) fail(`APP_VERSION_CODE is ${version.APP_VERSION_CODE}`);
          if (version.RELEASE_TAG !== 'R19') fail(`RELEASE_TAG is ${version.RELEASE_TAG}`);
          if (manifest.version !== '10.14.0') fail(`update manifest version is ${manifest.version}`);
          if (!/versionCode\s+117\b/.test(gradle)) fail('Android versionCode 117 missing');
          if (!/versionName\s+["']10\.14\.0["']/.test(gradle)) fail('Android versionName 10.14.0 missing');
          for (const asset of [
            'android/app/src/main/assets/ara.traineddata.gz',
            'android/app/src/main/assets/eng.traineddata.gz',
          ]) {
            if (!fs.existsSync(asset) || fs.statSync(asset).size <= 0) fail(`baseline OCR asset missing: ${asset}`);
          }
          console.log('Semantic R19 baseline OK.');
          NODE
          grep -Fq 'com.rmtheis:tess-two:9.1.0' android/app/build.gradle

      - name: Restore reviewed cumulative R19 repair payload
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/r19-final-bundle "$R19_TARGETED_BACKUP"
          mkdir -p /tmp/r19-final-bundle/payload

