      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Android SDK 35
        id: android_sdk
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK"
          command -v sdkmanager >/dev/null
          (yes | sdkmanager --licenses >/dev/null 2>&1) || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" 2>&1 | tee /tmp/r19-run13-logs/android-sdk.log
          printf 'sdk.dir=%s\n' "$SDK" > android/local.properties

      - name: Sync verified web build into Android
        id: cap_sync
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          npx cap sync android 2>&1 | tee /tmp/r19-run13-logs/cap-sync.log
          test -s android/app/src/main/assets/public/index.html
          git diff --check

      - name: Android unit tests and lint gates
        id: android_test
        continue-on-error: true
        shell: bash
        working-directory: android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest lintDebug lintRelease --stacktrace 2>&1 | tee /tmp/r19-run13-logs/android-tests-lint.log

      - name: Build debug and release APKs
        id: android_build
        continue-on-error: true
        shell: bash
        working-directory: android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug assembleRelease --stacktrace 2>&1 | tee /tmp/r19-run13-logs/android-build.log
          test -s app/build/outputs/apk/debug/app-debug.apk
          RELEASE_APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit 2>/dev/null || true)"
          test -n "$RELEASE_APK"
          test -s "$RELEASE_APK"
          find app/build/outputs/apk -type f -name '*.apk' -print

      - name: Final no-regression static gate after Android sync
        id: final_static
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          node --check cloud-worker/worker.js
          npm run test 2>&1 | tee /tmp/r19-run13-logs/final-tests.log
          test -s dist/index.html
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          test -n "$(find android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit 2>/dev/null || true)"

      - name: Collect RUN13 repaired source, APKs and all diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          OUT=r19-run13-output
          rm -rf "$OUT"
          mkdir -p "$OUT/logs" "$OUT/apk"
          cp -a /tmp/r19-run13-logs/. "$OUT/logs/" 2>/dev/null || true
          cp /tmp/R19_FINAL_DEEP_SOURCE_AUDIT.txt "$OUT/logs/" 2>/dev/null || true
          git status --short > "$OUT/git-status.txt"
          git diff --binary > "$OUT/R19_RUN13_FINAL.patch"
          git diff --stat > "$OUT/R19_RUN13_DIFFSTAT.txt"
          find android/app/build/outputs/apk -type f -name '*.apk' -exec cp {} "$OUT/apk/" \; 2>/dev/null || true
          python - <<'PY2'
          from pathlib import Path
          import subprocess, tarfile
          out=Path('r19-run13-output')
          tracked=subprocess.check_output(['git','diff','--name-only','-z']).split(b'\0')
          untracked=subprocess.check_output(['git','ls-files','--others','--exclude-standard','-z']).split(b'\0')
          files=[]
          for raw in tracked+untracked:
              if not raw: continue
              p=Path(raw.decode())
              if not p.exists() or not p.is_file(): continue
              if any(x in p.parts for x in ('.git','node_modules','.gradle')): continue
              if p.parts and p.parts[0]=='r19-run13-output': continue
              files.append(p)
          with tarfile.open(out/'R19_RUN13_FIXED_FILES.tar.gz','w:gz') as tf:
              for p in sorted(set(files),key=str): tf.add(p,arcname=str(p))
          PY2

      - name: Upload RUN13 complete result and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobdea-r19-run13-full-result
          path: r19-run13-output/
          if-no-files-found: error
          retention-days: 14

      - name: Final RUN13 gate - no repair, test or build failure accepted
        if: always()
        shell: bash
        env:
          P01_APPLY: ${{ steps.p01_apply.outcome }}
          P01_TEST: ${{ steps.p01_test.outcome }}
          P02_APPLY: ${{ steps.p02_apply.outcome }}
          P02_TEST: ${{ steps.p02_test.outcome }}
          P03_APPLY: ${{ steps.p03_apply.outcome }}
          P03_TEST: ${{ steps.p03_test.outcome }}
          P04_APPLY: ${{ steps.p04_apply.outcome }}
          P04_TEST: ${{ steps.p04_test.outcome }}
          P05_APPLY: ${{ steps.p05_apply.outcome }}
          P05_TEST: ${{ steps.p05_test.outcome }}
          P06_APPLY: ${{ steps.p06_apply.outcome }}
          P06_TEST: ${{ steps.p06_test.outcome }}
          P07_APPLY: ${{ steps.p07_apply.outcome }}
          P07_TEST: ${{ steps.p07_test.outcome }}
          P06_REFINEMENT_APPLY: ${{ steps.p06_refinement_apply.outcome }}
