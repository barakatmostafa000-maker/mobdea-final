      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Setup Android SDK 35
        uses: android-actions/setup-android@v3

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          printf 'sdk.dir=%s\n' "$SDK" > android/local.properties

      - name: Sync web app to Android
        shell: bash
        run: |
          set -euo pipefail
          npx cap sync android
          test -s android/app/src/main/assets/public/index.html

      - name: Android test lint and APK build
        shell: bash
        working-directory: android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest --stacktrace
          ./gradlew --no-daemon lintDebug --stacktrace
          ./gradlew --no-daemon assembleDebug --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Deploy final Cloud Worker after all app tests
        shell: bash
        working-directory: cloud-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "SKIPPED_NO_CLOUDFLARE_SECRET" > /tmp/final-worker-deploy-status.txt
            echo "Cloud Worker deployment skipped because CLOUDFLARE_API_TOKEN is not configured."
            exit 0
          fi
          node --check worker.js
          npx --yes wrangler@4 deploy --config wrangler.jsonc
          cd ..
          curl --fail --silent --show-error --retry 4 --retry-delay 2 "$MOBDEA_WORKER_URL/health" > /tmp/final-worker-health.json
          test -s /tmp/final-worker-health.json
          echo "DEPLOYED_AND_HEALTHY" > /tmp/final-worker-deploy-status.txt

      - name: Final APK and integration release audit
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          test -s dist/index.html
          test -s /tmp/R19_FINAL_DEEP_SOURCE_AUDIT.txt
          node --check cloud-worker/worker.js
          git diff --check
          {
            echo "R19 FINAL RELEASE AUDIT 01-14"
            echo "Timestamp UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "Baseline: $R19_BASE_COMMIT"
            echo "R19 Fix8.13 patch SHA256: $R19_PATCH_SHA256"
            echo "Web tests/lint/format/static/build: PASS"
            echo "Android unit tests/lint/assembleDebug: PASS"
            echo "APK: PASS"
            echo "Cloud Worker: $(cat /tmp/final-worker-deploy-status.txt 2>/dev/null || echo NOT_ATTEMPTED)"
            echo "All Repairs 01-14 source markers and final integration audit: PASS"
          } > /tmp/R19_FINAL_RELEASE_AUDIT.txt
          sha256sum "$APK" >> /tmp/R19_FINAL_RELEASE_AUDIT.txt
          cat /tmp/R19_FINAL_RELEASE_AUDIT.txt

      - name: Package final deep-reviewed Repairs 01-14 result
        shell: bash
        run: |
          set -euo pipefail
          OUT="/tmp/r19-final-deep-review-output"
          mkdir -p "$OUT"
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          cp "$APK" "$OUT/mobdea-r19-final-reviewed-01-14-debug.apk"
          sha256sum "$OUT/mobdea-r19-final-reviewed-01-14-debug.apk" > "$OUT/mobdea-r19-final-reviewed-01-14-debug.sha256"
          cp cloud-worker/worker.js "$OUT/R19-FINAL-cloud-worker.js"
          cp /tmp/R19_FINAL_DEEP_SOURCE_AUDIT.txt "$OUT/R19-FINAL-DEEP-SOURCE-AUDIT.txt"
          cp /tmp/R19_FINAL_RELEASE_AUDIT.txt "$OUT/R19-FINAL-RELEASE-AUDIT.txt"
          if [ -f /tmp/final-worker-deploy-status.txt ]; then cp /tmp/final-worker-deploy-status.txt "$OUT/R19-FINAL-WORKER-DEPLOY-STATUS.txt"; fi
          if [ -f /tmp/final-worker-health.json ]; then cp /tmp/final-worker-health.json "$OUT/R19-FINAL-WORKER-HEALTH.json"; fi
          git diff --binary > "$OUT/R19-FINAL-REVIEWED-01-14.patch"
          git diff --stat > "$OUT/R19-FINAL-REVIEWED-01-14-stat.txt"

          cat > "$OUT/R19-FINAL-REVIEWED-01-14-VERIFICATION.txt" <<'VERIFY_01_14'
          CUMULATIVE PROJECTS 01 + 02 + 03 + 04 + 05 + 06 + 07 + 08 + 09 + 10 + 11 + 12 + 13 + 14

          Implemented:
          - Whiteboard tools are a small click/touch icon instead of a permanent wide rail.
          - The tools no longer reserve a dead column from the writable surface.
          - Board/PDF/image annotation spans the complete teaching surface.
          - PDF/image ink aligns below the resource title bar.
          - Pointer Events + pointer capture stabilize mouse, touch and stylus input at all edges.
          - Canvas coordinates remain canonical while display resolution follows device pixel ratio.
          - Highlighter opacity and selected width are respected.
          - Arabic font choices use distinct Arabic families when bundled.
          - Persistent board-layer save is visible in the compact tools flyout.
          - Snapshot export remains a separate action.

          Project 02 — PDF / images:
          - Zoom is extended from 100% to 600% with a real pan mode.
          - Native PDF pages re-render at 1600 / 2200 / 2800 / 3200px tiers as zoom rises.
          - PDF/image and annotation canvas share the same zoom/pan transform.
          - Reset returns the resource to 100% and recenters it.

          Project 03 — students:
          - The complete roster is sorted and split evenly between right and left panels.
          - Both panels are scrollable and independently draggable with pointer capture.
          - Praise and warning buttons bind the selected student name before speech.
          - Auto ordering never guesses gender from names; explicit metadata is used when available.

          Project 04 — educational cards:
          - Definition / country / event cards get a stable visual hierarchy.
          - Definition cards show the term as the title and suppress redundant helper-label boxes.
          - Card text auto-fits from measured width, height and content density.
          - ResizeObserver re-fits typography whenever the card is resized.
          - MutationObserver applies the same engine to cards created later during the lesson.

          Project 05 — student-card duplex printing:
          - Automatic two-sided jobs are emitted as front sheet 1 -> mirrored back sheet 1 -> front sheet 2 -> mirrored back sheet 2.
          - Front and back card DOM nodes carry the same student identity for alignment verification.
          - Long-edge flip mirrors columns; short-edge flip rotates the complete slot order.
          - Empty slots on an incomplete final sheet are mirrored too, preventing last-page card mismatches.
          - Print-only duplex pages suppress extra headers/labels and isolate every physical side with a page break.
          - Existing approved front/back template artwork and card-grid dimensions are preserved.

          Project 06 — professional teaching maps:
          - Lesson maps render real latitude reference lines instead of point markers.
          - The five principal latitude references are part of the platform map engine: Equator 0°, Tropic of Cancer 23.5°N, Tropic of Capricorn 23.5°S, Arctic Circle 66.5°N, and Antarctic Circle 66.5°S.
          - Each principal latitude is drawn as a full horizontal teaching line with its Arabic name and degree whenever that latitude crosses the selected map extent.
          - World view shows all five principal latitude references together; regional maps show only the references that geographically cross that region.
          - The Prime Meridian / Greenwich 0° is permanently visible when it crosses the selected teaching map.
          - Selecting latitude or longitude layers emphasizes the corresponding reference lines.
          - Africa river mode renders continuous paths for the Nile, Congo, Niger, Zambezi and Orange rivers.
          - A dedicated Nile Basin region is added to the existing region engine.
          - Nile Basin map shows White Nile, Blue Nile, Atbara, main Nile and both delta branches as continuous routes.
          - Nile landmarks include Lake Victoria, Lake Tana, Khartoum confluence, Atbara, High Dam/Aswan, Cairo and Nile Delta.
          - Nile map supports Atlas and Blank (صماء) display modes, persisted with the lesson.
          - Full Nile-basin teaching detail also includes Sennar Reservoir, Jebel Aulia Reservoir, Sobat River, Bahr al-Jabal, Lake Kyoga, Lake Edward, Owen Falls Dam, Kagera River, Lake Albert, Bahr al-Arab, Bahr el-Ghazal and Victoria Nile.

          Project 07 — Map Challenge shared engine:
          - Map Challenge now opts into the exact same ProfessionalMap teaching engine used by LessonMapStudio.
          - Challenge latitude/longitude answers are the actual full map lines, not point markers.
          - The five principal latitude lines are challenge targets on World view when geographically valid.
          - Regional challenges exclude reference lines that do not cross that region; no more clamping a polar circle or 60°E onto a map edge.
          - River challenges use the same continuous river routes drawn in lesson mode and the route itself is clickable.
          - Hint highlighting follows the complete target river/reference line instead of highlighting a detached point.
          - Nile Basin challenge includes White Nile, Blue Nile, Atbara and main Nile targets.
          - Challenge drawing tools now include the same highlighter behavior and the map zoom ceiling matches lesson mode at 2.1x.
          - Existing challenge scoring, lives, timer, modes, build placements and result saving remain intact.

          Project 08 — OCR + exam import + game question bank:
          - Native OCR creates a fresh software ARGB_8888 bitmap before Tesseract and retries at 72% if the first bitmap is rejected.
          - JavaScript retries bitmap/decode/memory OCR failures at 1600px, 1280px, then 960px without changing the requested pages.
          - OCR choices are parsed before numeric question detection, preventing choices from becoming fake questions.
          - Separate answer-key sections are mapped back to numbered questions.
          - Missing answers remain empty and are marked needsAnswer=true; the platform never invents a default answer.
          - Question Bank can OCR-import directly from the selected grade's official exam PDF by page range.
          - Incomplete questions are visibly marked "مطلوب إجابة" and cannot be committed to games until the teacher enters and approves the answer.
          - Strong Arabic-normalized fingerprints reject repeated imported questions before storage.
          - JSON import/duplicate cleanup use the same stronger duplicate logic.
          - Games filter out every question that lacks a confirmed usable answer.
          - Existing Fix8.13 staging, cancellation, tess304 model pack and native asset path are preserved.

          Project 09 — Homepage / Dashboard responsive layout:
          - Tablet landscape no longer keeps the desktop sidebar beside the Dashboard; touch tablets up to 1366px use the drawer shell.
          - Closed tablet sidebar is visibility-hidden and pointer-disabled, so it cannot cover the Dashboard or intercept taps.
          - Desktop keeps the sidebar layout; collapsed desktop mode reduces it to a compact 82px rail.
          - Dashboard top search/account area stays inside the visible width and search results are scroll-bounded.
          - Hero reflows from desktop columns to tablet two-column and phone single-column layouts.
          - Today's schedule adapts instead of relying on fixed-width rows.
          - Homepage action cards wrap to 3 columns on tablets, 2 on phones and 1 on very narrow phones; horizontal card scrolling is removed.
          - Current class, announcements and upcoming exams reflow to tablet and phone grids without clipping.
          - Old short-landscape rules that hid card details and the lower Dashboard are overridden; every section remains reachable by vertical scrolling.
          - Primary Dashboard touch controls keep at least 44px hit height.
          - Dashboard data, navigation, search, sessions, announcements and exams behavior remain unchanged.

          Project 10 — Online lesson:
          - "الحصة الأونلاين" becomes a dedicated Radio-icon entry in the main sidebar and a visible Dashboard action.
          - A dedicated onlineClass route reuses ClassMode and automatically opens the live-room panel instead of leaving the teacher to search for it.
          - ClassMode also keeps a persistent Radio shortcut visible even when the management panel is closed; the old text-only top action now has a Radio icon.
          - Existing room creation, student public link/join code, Cloudflare Worker setup, screen sharing, teacher microphone, student microphone approval, chat and reactions remain intact.
          - Teacher WebRTC treats disconnected peers as recoverable failures instead of leaving a dead peer object in place.
          - Student WebRTC treats disconnected peers like failed peers and re-announces student-ready so the teacher can negotiate a fresh connection.
          - Online class-state synchronization now uses explicit mutation revisions for boardActions and points; moving/editing an existing board element triggers a fresh synchronized snapshot even when array length is unchanged.
          - Live state also republishes as elapsed lesson time changes.
          - Student fallback view still receives synchronized board/PDF/image snapshots whenever full screen-share video is not active.
          - Existing /live/rooms backend routes remain mandatory in Project10 tests.
          - This repair does not invent a TURN server; the existing ICE/STUN setup is preserved and connectivity recovery is improved without claiming impossible network guarantees.

          Project 11 — Cross-device class sync + student random picker:
          - ClassMode/onlineClass/whiteboard use a 5-second cloud receive cadence while visible; local edits still trigger the existing dirty-state push path within roughly one second.
          - Online/focus/pageshow/visibility reconnect events all trigger an immediate cloud sync attempt.
          - A compact classLiveSync state now carries current session, lesson, resource, content mode, page, board template, board actions, points and selected student between teacher devices.
          - Board stroke points are bounded before cloud transfer so live class state cannot grow without limit.
          - A remote classLiveSync state is applied only when it belongs to the same class session, comes from another device, is newer than the last applied state and is not stale.
          - mergeAppData now merges classPointSessions record-by-record and resolves classLiveSync by updatedAt, preventing the previous class-improvement history from being lost during two-device merges.
          - The visible twin student panels receive the real studentProgress object calculated from current points versus the previous classPointSessions record.
          - "الأكثر تحسنًا" is a functional sort: highest positive delta first, then current points, then Arabic name; each student's delta is shown beside the score when non-zero.
          - A Dices random-picker icon is added above the student lists.
          - Random option 1 chooses one student without repetition until every student in the current class group has been selected.
          - Random option 2 accepts a requested count and chooses that many unique students; it also respects the no-repeat cycle and never duplicates a student inside the same result.
          - When a draw reaches the end of the no-repeat cycle, all remaining students are used first and only then does a new cycle begin.
          - Randomly selected students are highlighted in both student panels, the first selected student becomes the active student, and the current selected names are shown in the picker.
          - The picker operates on the students prop already scoped to the current class group, not the entire school roster.

          Project 12 — ClassMode layout + page-aware questions + unified cloud/student portal + tablet voice:
          - ClassMode gets one safe central dock for إدارة / حفظ / ملء العرض / عودة للحصة so controls no longer float across games, maps or PDF content.
          - Online-game and challenge layouts are width-bounded and wrap controls on tablet landscape instead of clipping the left side.
          - Map symbols become a compact drawer opened by a dedicated "رموز الخريطة" control on tablet.
          - OCR questions from Project08 are linked to the current PDF page by source asset/resource/file + OCR page metadata.
          - The PDF question dock exposes current page / whole lesson / manual scopes and uses only questions with confirmed usable answers.
          - Class challenge payloads use project12GameQuestions from the selected scope rather than the old unscoped relatedQuestions list.
          - New students receive temporary PIN 123456 and teachers can reset any student to 123456.
          - Temporary 123456 forces the student to choose a different 6–10 digit PIN before normal account use, and the student can later reopen "تغيير PIN" from their account.
          - Successful teacher/admin login can bootstrap a random secure workspace token when endpoint/workspace exist but token is absent, immediately attempts the first full cloud push, and enables auto sync.
          - Worker authentication accepts the existing environment token or the securely stored dynamic token digest; students never receive either teacher token.
          - Student login works from any device through /student/login using student code + PIN and returns only that authenticated student's own portal data.
          - Student portal includes the student's own attendance, grades, detailed results, payments, games, maps, achievements, rewards, messages/notifications and grade-visible content.
          - Student cloud sessions support refresh and change-PIN; portal refresh runs every 15 seconds while logged in.
          - Native Android TTS waits for engine readiness, resolves only after UtteranceProgressListener.onStart, uses MEDIA/SPEECH audio attributes and reports Arabic voice availability.
          - Browser TTS timeout is treated as failure so fallback cannot falsely report successful speech.
          - Device Diagnostics tests native Arabic TTS on Android tablets instead of only browser speechSynthesis.
          - Workflow deploys the patched Cloud Worker only when CLOUDFLARE_API_TOKEN is available; otherwise deployment status is explicitly marked skipped and APK build continues.
          - Repair11 random picker, most-improved calculation and cross-device class sync remain covered by regression tests.

          Project 13 — PDF focus + barcode attendance/accounting + links/images + exam error analytics:
          - PDF teaching view is decluttered: the large Project12 dock is hidden, student panels start collapsed, viewer/page buttons are smaller and semi-transparent, and page navigation arrows are compact translucent circles.
          - The resource title/header floats translucently instead of reserving teaching height; PDF/image body fills the available preview stage.
          - The page-question feature remains but is collapsed to one small "أسئلة" chip and expands only when requested.
          - Android attendance scanning uses a native Google Code Scanner plugin and accepts QR, Code 128 and Code 39; browser BarcodeDetector remains the fallback.
          - Scanning a student asks Paid / Due, then upserts present attendance plus exactly one linked accounting row for that student/session/date.
          - Rescanning or correcting Paid / Due updates the same accounting row instead of duplicating it.
          - Payments shows session, status, amount and source, so barcode attendance is visible directly in accounts.
          - Fixed YouTube / Facebook / TikTok URLs are stored in Settings and shown in a reusable link hub.
          - Each lesson can store its own lessonLink. Student lesson viewer exposes it alongside lesson media.
          - Visible lesson-recording upload/list is removed from the workflow. Sessions is now "الحصص وروابط المحتوى" with schedule + fixed links + lesson links.
          - ClassMode hides the legacy recordings panel and replaces it with social/lesson links. Recording buttons are hidden and save/end class no longer auto-create recordings.
          - Existing historical lessonRecordings data is left untouched for migration safety but is not presented as an active feature.
          - The existing screenshot slot becomes "صورة للطلاب": current board/PDF/image plus annotations is stored as a studentVisible lesson image asset without adding another permanent toolbar button.
          - Permanent grade exam resources are resolved while grading; resource/asset/file identifiers are stored on each result.
          - GradeScanner displays wrong/partial/blank questions immediately during marking and stores errorQuestionIds/errorCount with the result.
          - Re-saving the same student/exam/date replaces the prior detailed result/grade row instead of creating a duplicate.
          - ResultDetails defaults to "عرض الأخطاء فقط" and builds an exam-wide error index with the most missed questions and student codes.
          - Repairs 01-12 remain in the cumulative workflow; Repair13 adds regression checks for the Project12 cloud/TTS/page-question foundation.

          Project 14 — YouTube auto-sync by grade:
          - The supplied YouTube channel is the default source; videos do not need to be uploaded twice.
          - Every grade can be linked to its own YouTube Playlist; exact Playlist membership is always preferred.
          - If no Playlist is configured, optional Arabic title/description matching classifies recent channel videos by grade.
          - Public YouTube Atom/RSS feeds are fetched server-side, so the normal automatic path does not require a YouTube Data API key.
          - Worker results cache for 180 seconds and student Content Library refreshes every 3 minutes plus reconnect/visibility.
          - Students see the automatic YouTube feed only for their own grade.
          - Student cloud portal receives socialLinks and youtubeAutoSync settings while the teacher cloud token remains removed.
          - Project14 worker deployment is deferred until web + Android tests have passed, so an intermediate worker is never deployed before the final source is validated.
          - Final integration reconciliation restores the supplied YouTube/Facebook/TikTok links as actual defaults in seed, settings, student link hub and YouTube sync.
          - Student-visible lesson images now have a private student-session asset route and are downloaded into the student device asset store after portal refresh.
          - The final workflow validates the exact recovered Fix8.13 patch SHA256 and expected version 10.14.1 / versionCode 118 before any repair is applied.
          - Node is pinned before every contract test; all 14 repairs are applied in dependency order 01 -> 14, with Project13 before Project14.
          - Final source audit rejects empty changed files, merge-conflict markers, duplicate exact imports, CRLF/trailing whitespace/missing final newline, and missing critical repair markers.
          - Web verification includes tests, lint, format check, static verification and production build; Android verification includes unit tests, lintDebug and assembleDebug.

          NOT CHANGED IN PROJECTS 01-14:
          legacy checklist items whose exact historical meaning has not yet been recovered.
          VERIFY_01_14

      - name: Upload final deep-reviewed Repairs 01-14 artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobdea-r19-final-reviewed-01-14
          path: /tmp/r19-final-deep-review-output/*
          if-no-files-found: error
          retention-days: 30

      - name: Collect failure diagnostics
        if: failure()
        shell: bash
        run: |
          set +e
          OUT="/tmp/r19-final-deep-review-failure"
          mkdir -p "$OUT"
          git status --short > "$OUT/git-status.txt" 2>&1
          git diff --check > "$OUT/git-diff-check.txt" 2>&1
          git diff > "$OUT/r19-final-current.diff" 2>&1
          npm run build > "$OUT/web-build.txt" 2>&1 || true
          cp android/app/build/reports/lint-results-debug.html "$OUT/" 2>/dev/null || true
          cp /tmp/R19_FINAL_DEEP_SOURCE_AUDIT.txt "$OUT/" 2>/dev/null || true
          cp /tmp/R19_FINAL_RELEASE_AUDIT.txt "$OUT/" 2>/dev/null || true
          cp /tmp/final-worker-deploy-status.txt "$OUT/" 2>/dev/null || true
          cp cloud-worker/worker.js "$OUT/final-worker.js" 2>/dev/null || true

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mobdea-r19-final-reviewed-01-14-failure
          path: /tmp/r19-final-deep-review-failure/*
          if-no-files-found: ignore
          retention-days: 14
