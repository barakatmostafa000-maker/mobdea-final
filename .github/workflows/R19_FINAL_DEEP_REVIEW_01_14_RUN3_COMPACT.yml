name: R19 FINAL Deep Review 01-14 RUN3 - Compact

"on":
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  r19-final-deep-review-01-14-run3:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      CI: "true"
      R19_BASE_COMMIT: cd7e7cd597af23ca1169e1f19c3ac954727c3f2d
      R19_PATCH_SHA256: cdde2432847080323e32430c86e5a717877a6f54a5c21a32820072c1761c7332
      MOBDEA_WORKER_URL: https://mobdea-platform-api.barakatmostafa000.workers.dev
      PREVIOUS_WORKFLOW: R19_FINAL_RELEASE_FIX8_13.yml
      PREVIOUS_ARTIFACT: mobdea-r19-final-release-fix8-13-apk

    steps:
      - name: Runner allocation smoke test
        shell: bash
        run: |
          set -euo pipefail
          echo "RUNNER_STARTED=1"
          echo "Workflow: R19 FINAL Deep Review 01-14 RUN3 Compact"
          echo "Runner OS: ${RUNNER_OS:-unknown}"
          echo "Runner arch: ${RUNNER_ARCH:-unknown}"
          echo "Run ID: ${GITHUB_RUN_ID:-unknown}"
          uname -a
          date -u
          test "${RUNNER_OS:-}" = "Linux"

      - name: Checkout exact R19 baseline
        uses: actions/checkout@v4
        with:
          ref: cd7e7cd597af23ca1169e1f19c3ac954727c3f2d
          fetch-depth: 1

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm


      - name: Recover exact tested R19 Fix8.13 source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$R19_BASE_COMMIT"
          rm -rf /tmp/r19-fix813
          mkdir -p /tmp/r19-fix813

          RUN_ID="$(gh run list --workflow "$PREVIOUS_WORKFLOW" --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          test -n "$RUN_ID"
          gh run download "$RUN_ID" --name "$PREVIOUS_ARTIFACT" --dir /tmp/r19-fix813

          PATCH="$(find /tmp/r19-fix813 -type f \( -iname '*applied.patch' -o -iname '*.patch' \) -size +100c | head -n 1)"
          test -n "$PATCH"
          test -s "$PATCH"
          ACTUAL_PATCH_SHA="$(sha256sum "$PATCH" | awk '{print $1}')"
          test "$ACTUAL_PATCH_SHA" = "$R19_PATCH_SHA256"
          git apply --check "$PATCH"
          git apply "$PATCH"
          git diff --check

          # Reuse the same offline Arabic fonts from the already-verified APK if present.
          BASE_APK="$(find /tmp/r19-fix813 -type f -name '*.apk' | head -n 1 || true)"
          if [ -n "$BASE_APK" ] && [ -s "$BASE_APK" ]; then
            mkdir -p public/fonts
            unzip -Z1 "$BASE_APK" 2>/dev/null | grep -E '^assets/public/fonts/[^/]+\.ttf$' | while IFS= read -r entry; do
              name="${entry##*/}"
              unzip -p "$BASE_APK" "$entry" > "public/fonts/$name"
            done || true
          fi

          test -f src/pages/ClassMode.jsx
          test -f src/main.jsx
          node - <<'NODE_R19_VERSION'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (pkg.version !== '10.14.1') throw new Error(`Unexpected recovered R19 version: ${pkg.version}`);
          if (Number(pkg.mobdea?.versionCode) !== 118) throw new Error(`Unexpected recovered R19 versionCode: ${pkg.mobdea?.versionCode}`);
          console.log('Recovered exact R19 Fix8.13 version 10.14.1 / versionCode 118');
          NODE_R19_VERSION
          grep -Fq 'CanvasOverlay' src/pages/ClassMode.jsx
          grep -Fq 'classmode-board-surface' src/pages/ClassMode.jsx

      - name: Apply Project 01 whiteboard repair only
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/apply_project01.py <<'PY_PROJECT01'
          from pathlib import Path
          import re

          page_path = Path("src/pages/ClassMode.jsx")
          main_path = Path("src/main.jsx")
          css_path = Path("src/styles/project01-whiteboard.css")
          page = page_path.read_text(encoding="utf-8")
          main = main_path.read_text(encoding="utf-8")
          MARKER = "PROJECT01_WHITEBOARD_ENGINE_V1"

          def replace_once(source, old, new, label):
              if old not in source:
                  raise SystemExit(f"Project01 source contract changed: {label}")
              return source.replace(old, new, 1)

          if MARKER not in page:
              anchor = "function CanvasOverlay({ actions, onDrawAction, onMoveAction, onSelectAction, selectedActionId, template, zoom, boardRef, tool, selectedColor, strokeWidth, shapeKind, arrowMode, textValue, textStyle, fontFamily, fontSize, boardReady, setBoardReady, hasResourceHeader = false }) {"
              page = replace_once(
                  page,
                  anchor,
                  "const BOARD_COORD_WIDTH = 1200;\nconst BOARD_COORD_HEIGHT = 720;\nconst PROJECT01_WHITEBOARD_ENGINE_V1 = true;\n\n" + anchor,
                  "CanvasOverlay anchor",
              )

              page = page.replace(
                  "stamp.fontFamily || 'Tahoma, Arial, sans-serif'",
                  "stamp.fontFamily || 'Noto Naskh Arabic, Tahoma, serif'",
                  1,
              )

              page = replace_once(
                  page,
                  """    ctx.globalAlpha = action.tool === 'highlighter' ? 0.3 : 1;
              ctx.globalCompositeOperation = action.tool === 'eraser' ? 'destination-out' : 'source-over';
              ctx.strokeStyle = action.tool === 'eraser' ? 'rgba(0,0,0,1)' : action.color || '#111827';
              ctx.lineWidth = action.tool === 'eraser' ? 22 : action.tool === 'highlighter' ? 16 : action.width || 4;""",
                  """    const actionWidth = Math.max(1, Number(action.width || 4));
              ctx.globalAlpha = action.tool === 'highlighter' ? 0.24 : 1;
              ctx.globalCompositeOperation = action.tool === 'eraser' ? 'destination-out' : 'source-over';
              ctx.strokeStyle = action.tool === 'eraser' ? 'rgba(0,0,0,1)' : action.color || '#111827';
              ctx.lineWidth = action.tool === 'eraser'
                ? Math.max(22, actionWidth)
                : action.tool === 'highlighter'
                  ? Math.max(10, actionWidth)
                  : actionWidth;""",
                  "highlighter renderer",
              )

              page = replace_once(
                  page,
                  """  const canvasRef = useRef(null);
              const currentStroke = useRef(null);
              const drawing = useRef(false);
              const moving = useRef(null);

              const render = (preview = null) => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                const { width, height } = canvas;
                ctx.clearRect(0, 0, width, height);
                actions.forEach((action) => drawBoardAction(ctx, action, action.id === selectedActionId));
                if (preview) drawBoardAction(ctx, preview, false);
              };

              useEffect(() => { render(); }, [actions, selectedActionId]);""",
                  """  const canvasRef = useRef(null);
              const currentStroke = useRef(null);
              const drawing = useRef(false);
              const moving = useRef(null);
              const actionsRef = useRef(actions);
              const selectedActionIdRef = useRef(selectedActionId);
              actionsRef.current = actions;
              selectedActionIdRef.current = selectedActionId;

              const render = (preview = null) => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                ctx.setTransform(1, 0, 0, 1, 0, 0);
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.setTransform(
                  canvas.width / BOARD_COORD_WIDTH,
                  0,
                  0,
                  canvas.height / BOARD_COORD_HEIGHT,
                  0,
                  0,
                );
                actionsRef.current.forEach((action) =>
                  drawBoardAction(ctx, action, action.id === selectedActionIdRef.current)
                );
                if (preview) drawBoardAction(ctx, preview, false);
              };

              useEffect(() => { render(); }, [actions, selectedActionId]);

              useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return undefined;
                const resizeCanvas = () => {
                  const rect = canvas.getBoundingClientRect();
                  const dpr = Math.min(2, Math.max(1, Number(globalThis.devicePixelRatio || 1)));
                  const nextWidth = Math.max(1, Math.round(rect.width * dpr));
                  const nextHeight = Math.max(1, Math.round(rect.height * dpr));
                  if (canvas.width !== nextWidth || canvas.height !== nextHeight) {
                    canvas.width = nextWidth;
                    canvas.height = nextHeight;
                  }
                  render();
                };
                resizeCanvas();
                const observer = typeof ResizeObserver !== 'undefined' ? new ResizeObserver(resizeCanvas) : null;
                observer?.observe(canvas);
                globalThis.addEventListener?.('resize', resizeCanvas);
                return () => {
                  observer?.disconnect();
                  globalThis.removeEventListener?.('resize', resizeCanvas);
                };
              }, []);""",
                  "resolution-independent canvas",
              )

              page = replace_once(
                  page,
                  """  const getPoint = (event) => {
                const canvas = canvasRef.current;
                const rect = canvas.getBoundingClientRect();
                const point = event.touches?.[0] || event;
                return {
                  x: ((point.clientX - rect.left) / rect.width) * canvas.width,
                  y: ((point.clientY - rect.top) / rect.height) * canvas.height,
                };
              };""",
                  """  const getPoint = (event) => {
                const canvas = canvasRef.current;
                const rect = canvas.getBoundingClientRect();
                const width = Math.max(1, rect.width);
                const height = Math.max(1, rect.height);
                const x = ((event.clientX - rect.left) / width) * BOARD_COORD_WIDTH;
                const y = ((event.clientY - rect.top) / height) * BOARD_COORD_HEIGHT;
                return {
                  x: Math.max(0, Math.min(BOARD_COORD_WIDTH, x)),
                  y: Math.max(0, Math.min(BOARD_COORD_HEIGHT, y)),
                };
              };""",
                  "pointer coordinate mapping",
              )

              page = replace_once(
                  page,
                  """  const onPointerDown = (event) => {
                if (!canvasRef.current) return;
                event.preventDefault();
                const point = getPoint(event);""",
                  """  const onPointerDown = (event) => {
                if (!canvasRef.current) return;
                if (event.pointerType === 'mouse' && event.button !== 0) return;
                event.preventDefault();
                event.currentTarget?.setPointerCapture?.(event.pointerId);
                const point = getPoint(event);""",
                  "pointer capture",
              )

              page = replace_once(
                  page,
                  """      width: tool === 'highlighter' ? (strokeWidth || 4) * 2.5 : (strokeWidth || 4),
                  points: [point],""",
                  """      width: tool === 'highlighter'
                    ? Math.max(10, (strokeWidth || 4) * 3.2)
                    : tool === 'eraser'
                      ? Math.max(22, (strokeWidth || 4) * 5)
                      : (strokeWidth || 4),
                  points: [point],""",
                  "highlighter width",
              )

              page = replace_once(
                  page,
                  """        onMouseDown={onPointerDown}
                  onMouseMove={onPointerMove}
                  onMouseUp={onPointerUp}
                  onMouseLeave={onPointerUp}
                  onTouchStart={onPointerDown}
                  onTouchMove={onPointerMove}
                  onTouchEnd={onPointerUp}""",
                  """        onPointerDown={onPointerDown}
                  onPointerMove={onPointerMove}
                  onPointerUp={onPointerUp}
                  onPointerCancel={onPointerUp}
                  onLostPointerCapture={onPointerUp}""",
                  "pointer event wiring",
              )

              page = replace_once(
                  page,
                  """  const [boardReady, setBoardReady] = useState(false);
              const [shareNotice, setShareNotice] = useState('');""",
                  """  const [boardReady, setBoardReady] = useState(false);
              const [boardToolsExpanded, setBoardToolsExpanded] = useState(false);
              const [shareNotice, setShareNotice] = useState('');""",
                  "compact tool state",
              )

              old_tools = """              {boardToolsVisible && <div className=\"classmode-board-sidebar-left\">
                    {toolOptions.map(({ key, label, icon: Icon }) => (
                      <button key={key} type=\"button\" className={tool === key ? 'active' : ''} onClick={() => setTool(key)} title={label}><Icon size={19} /><span>{label}</span></button>
                    ))}
                    <div className=\"classmode-left-toolbar-divider\" />
                    <button type=\"button\" onClick={() => setZoom((value) => Math.min(2, value + 0.15))} title=\"تكبير\"><ZoomIn size={19} /><span>تكبير</span></button>
                    <button type=\"button\" onClick={() => setZoom((value) => Math.max(1, value - 0.15))} title=\"تصغير\"><ZoomOut size={19} /><span>تصغير</span></button>
                    <button type=\"button\" onClick={undoBoard} title=\"تراجع\"><Undo2 size={19} /><span>تراجع</span></button>
                    <button type=\"button\" onClick={redoBoard} title=\"إعادة\"><Redo2 size={19} /><span>إعادة</span></button>
                    <button type=\"button\" onClick={saveBoard} title=\"حفظ\"><Save size={19} /><span>حفظ</span></button>
                  </div>}"""

              new_tools = """              {boardToolsVisible && (
                    <div className={`classmode-board-tool-flyout ${boardToolsExpanded ? 'open' : ''}`}>
                      <button
                        type=\"button\"
                        className=\"classmode-board-tool-toggle\"
                        onClick={() => setBoardToolsExpanded((value) => !value)}
                        aria-expanded={boardToolsExpanded}
                        aria-label=\"أدوات السبورة\"
                        title=\"أدوات السبورة\"
                      >
                        <LayoutGrid size={19} />
                      </button>
                      {boardToolsExpanded && (
                        <div className=\"classmode-board-sidebar-left\" role=\"toolbar\" aria-label=\"أدوات السبورة\">
                          {toolOptions.map(({ key, label, icon: Icon }) => (
                            <button key={key} type=\"button\" className={tool === key ? 'active' : ''} onClick={() => setTool(key)} title={label} aria-label={label}><Icon size={19} /><span>{label}</span></button>
                          ))}
                          <div className=\"classmode-left-toolbar-divider\" />
                          <button type=\"button\" onClick={() => setZoom((value) => Math.min(2, value + 0.15))} title=\"تكبير\" aria-label=\"تكبير\"><ZoomIn size={19} /><span>تكبير</span></button>
                          <button type=\"button\" onClick={() => setZoom((value) => Math.max(1, value - 0.15))} title=\"تصغير\" aria-label=\"تصغير\"><ZoomOut size={19} /><span>تصغير</span></button>
                          <button type=\"button\" onClick={undoBoard} title=\"تراجع\" aria-label=\"تراجع\"><Undo2 size={19} /><span>تراجع</span></button>
                          <button type=\"button\" onClick={redoBoard} title=\"إعادة\" aria-label=\"إعادة\"><Redo2 size={19} /><span>إعادة</span></button>
                          <button type=\"button\" onClick={persistCurrentBoardLayer} title=\"حفظ طبقة السبورة\" aria-label=\"حفظ طبقة السبورة\"><Save size={19} /><span>حفظ الطبقة</span></button>
                          <button type=\"button\" onClick={saveBoard} title=\"تصدير لقطة\" aria-label=\"تصدير لقطة\"><Camera size={19} /><span>تصدير</span></button>
                        </div>
                      )}
                    </div>
                  )}"""
              page = replace_once(page, old_tools, new_tools, "small tool flyout")

              page = replace_once(
                  page,
                  """          {boardToolsVisible && <div className=\"classmode-toolbar\">""",
                  """          {boardToolsVisible && boardToolsExpanded && <div className=\"classmode-toolbar\">""",
                  "advanced toolbar visibility",
              )

              old_font = """              <select value={fontFamily} onChange={(e) => setFontFamily(e.target.value)} title=\"نوع الخط\">
                    <option value=\"Tahoma, Arial, sans-serif\">عربي واضح</option>
                    <option value=\"Georgia, serif\">تاريخي</option>
                    <option value=\"Arial, sans-serif\">بسيط</option>
                    <option value=\"serif\">مخطوط</option>
                  </select>"""
              new_font = """              <select value={fontFamily} onChange={(e) => setFontFamily(e.target.value)} title=\"نوع الخط\">
                    <option value=\"'Noto Naskh Arabic', Tahoma, serif\">نسخ واضح</option>
                    <option value=\"'Noto Kufi Arabic', Tahoma, sans-serif\">كوفي</option>
                    <option value=\"'Aref Ruqaa', 'Amiri', serif\">رقعة</option>
                    <option value=\"'Amiri', serif\">أميري</option>
                    <option value=\"'Reem Kufi', Tahoma, sans-serif\">كوفي حديث</option>
                  </select>"""
              if old_font in page:
                  page = page.replace(old_font, new_font, 1)
              elif "Noto Kufi Arabic" not in page:
                  raise SystemExit("Project01 source contract changed: Arabic font selector")

              page = page.replace(
                  "const [fontFamily, setFontFamily] = useState('Tahoma, Arial, sans-serif');",
                  "const [fontFamily, setFontFamily] = useState(\"'Noto Naskh Arabic', Tahoma, serif\");",
                  1,
              )

              page_path.write_text(page.rstrip() + "\n", encoding="utf-8")

          css = """/* PROJECT01_WHITEBOARD_ENGINE_V1 — Class Mode whiteboard/PDF/image only. */
          @font-face { font-family:'Noto Naskh Arabic'; src:url('/fonts/NotoNaskhArabic-Variable.ttf') format('truetype'); font-style:normal; font-weight:100 900; font-display:swap; }
          @font-face { font-family:'Noto Kufi Arabic'; src:url('/fonts/NotoKufiArabic-Variable.ttf') format('truetype'); font-style:normal; font-weight:100 900; font-display:swap; }
          @font-face { font-family:'Aref Ruqaa'; src:url('/fonts/ArefRuqaa-Regular.ttf') format('truetype'); font-style:normal; font-weight:400; font-display:swap; }
          @font-face { font-family:'Amiri'; src:url('/fonts/Amiri-Regular.ttf') format('truetype'); font-style:normal; font-weight:400; font-display:swap; }
          @font-face { font-family:'Reem Kufi'; src:url('/fonts/ReemKufi-Variable.ttf') format('truetype'); font-style:normal; font-weight:400 900; font-display:swap; }

          .classmode-v103 .classmode-board-panel,
          .classmode-v103 .classmode-board-frame,
          .classmode-v103 .classmode-board-surface,
          .classmode-v103 .classmode-board-stage { position:relative !important; min-width:0 !important; min-height:0 !important; }

          .classmode-v103 .classmode-board-surface,
          .classmode-v103 .classmode-board-surface.with-tools { display:grid !important; grid-template-columns:minmax(0,1fr) !important; width:100% !important; height:100% !important; }
          .classmode-v103 .classmode-board-stage { width:100% !important; height:100% !important; overflow:hidden !important; isolation:isolate !important; }

          .classmode-v103 .classmode-board-tool-flyout { position:absolute !important; z-index:90 !important; top:8px !important; left:8px !important; width:42px !important; pointer-events:auto !important; }
          .classmode-v103 .classmode-board-tool-toggle { width:42px !important; height:42px !important; min-width:42px !important; min-height:42px !important; padding:0 !important; display:grid !important; place-items:center !important; border:1px solid rgba(215,173,53,.62) !important; border-radius:12px !important; background:rgba(8,10,14,.96) !important; color:#f1d88d !important; box-shadow:0 7px 20px rgba(0,0,0,.38) !important; backdrop-filter:blur(9px) !important; }
          .classmode-v103 .classmode-board-tool-toggle:hover,
          .classmode-v103 .classmode-board-tool-toggle:focus-visible,
          .classmode-v103 .classmode-board-tool-flyout.open .classmode-board-tool-toggle { border-color:#e7bd48 !important; background:#17140c !important; outline:none !important; }

          .classmode-v103 .classmode-board-sidebar-left { position:absolute !important; z-index:91 !important; top:48px !important; left:0 !important; width:42px !important; min-width:42px !important; height:auto !important; max-height:calc(100vh - 160px) !important; padding:4px !important; display:flex !important; flex-direction:column !important; gap:4px !important; overflow-x:hidden !important; overflow-y:auto !important; border:1px solid rgba(215,173,53,.48) !important; border-radius:11px !important; background:rgba(8,10,14,.97) !important; box-shadow:0 10px 28px rgba(0,0,0,.46) !important; }
          .classmode-v103 .classmode-board-sidebar-left button { flex:0 0 32px !important; width:32px !important; min-width:32px !important; height:32px !important; min-height:32px !important; padding:0 !important; margin:0 !important; display:grid !important; place-items:center !important; border-radius:8px !important; }
          .classmode-v103 .classmode-board-sidebar-left button svg { width:17px !important; height:17px !important; }
          .classmode-v103 .classmode-board-sidebar-left button span { display:none !important; }
          .classmode-v103 .classmode-left-toolbar-divider { width:26px !important; height:1px !important; min-height:1px !important; margin:2px auto !important; background:rgba(215,173,53,.30) !important; }

          .classmode-v103 .classmode-resource-preview { z-index:1 !important; }
          .classmode-v103 .resource-preview-head { position:relative !important; z-index:40 !important; }
          .classmode-v103 .resource-preview-body { position:relative !important; min-width:0 !important; min-height:0 !important; }
          .classmode-v103 .resource-annotation-overlay { pointer-events:none !important; }

          .classmode-v103 .class-board-canvas-shell { position:absolute !important; z-index:20 !important; inset:0 !important; width:100% !important; height:100% !important; min-width:0 !important; min-height:0 !important; max-width:none !important; max-height:none !important; margin:0 !important; padding:0 !important; overflow:hidden !important; transform:none !important; aspect-ratio:auto !important; pointer-events:auto !important; user-select:none !important; -webkit-user-select:none !important; overscroll-behavior:contain !important; }
          .classmode-v103 .class-board-canvas-shell.has-resource-head { top:34px !important; right:0 !important; bottom:0 !important; left:0 !important; width:100% !important; height:calc(100% - 34px) !important; background:transparent !important; }
          .classmode-v103 .class-board-canvas,
          .classmode-v103 .class-board-canvas-shell canvas { position:absolute !important; z-index:2 !important; inset:0 !important; display:block !important; width:100% !important; height:100% !important; min-width:100% !important; min-height:100% !important; max-width:none !important; max-height:none !important; margin:0 !important; padding:0 !important; object-fit:fill !important; background:transparent !important; pointer-events:auto !important; touch-action:none !important; user-select:none !important; -webkit-user-select:none !important; -webkit-touch-callout:none !important; }
          .classmode-v103 .classmode-board-identity { z-index:0 !important; pointer-events:none !important; }

          .classmode-v103 .classmode-toolbar { position:absolute !important; z-index:80 !important; left:58px !important; bottom:8px !important; width:auto !important; max-width:calc(100% - 74px) !important; min-height:36px !important; max-height:44px !important; margin:0 !important; padding:3px 5px !important; display:flex !important; flex:none !important; overflow-x:auto !important; overflow-y:hidden !important; border:1px solid rgba(215,173,53,.44) !important; border-radius:11px !important; background:rgba(8,10,14,.96) !important; box-shadow:0 8px 22px rgba(0,0,0,.38) !important; backdrop-filter:blur(8px) !important; }
          .classmode-v103 .classmode-toolbar .classmode-tool-group button,
          .classmode-v103 .classmode-toolbar .classmode-tool-group select,
          .classmode-v103 .classmode-toolbar .classmode-tool-group input { min-height:28px !important; height:28px !important; }

          @media (max-width:1100px), (max-height:650px) {
            .classmode-v103 .classmode-board-tool-flyout { top:5px !important; left:5px !important; width:38px !important; }
            .classmode-v103 .classmode-board-tool-toggle { width:38px !important; height:38px !important; min-width:38px !important; min-height:38px !important; border-radius:10px !important; }
            .classmode-v103 .classmode-board-sidebar-left { top:43px !important; width:38px !important; min-width:38px !important; max-height:calc(100vh - 125px) !important; padding:3px !important; }
            .classmode-v103 .classmode-board-sidebar-left button { flex-basis:29px !important; width:29px !important; min-width:29px !important; height:29px !important; min-height:29px !important; }
            .classmode-v103 .classmode-toolbar { left:49px !important; bottom:5px !important; max-width:calc(100% - 59px) !important; min-height:32px !important; max-height:37px !important; padding:2px 4px !important; }
            .classmode-v103 .classmode-toolbar .classmode-tool-group button,
            .classmode-v103 .classmode-toolbar .classmode-tool-group select,
            .classmode-v103 .classmode-toolbar .classmode-tool-group input { min-height:25px !important; height:25px !important; font-size:.62rem !important; }
          }
          """
          css_path.write_text(css.strip() + "\n", encoding="utf-8")

