name: R20 SAFE SURGICAL R19 FIX01-25 GREEN BOOTSTRAP V3
'on':
  workflow_dispatch: null
  push:
    branches:
    - main
    paths:
    - .github/workflows/R20_SAFE_R19_FIX01_25_GREEN_BOOTSTRAP_V3.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: r20-safe-surgical-r19-fix01-25-green-bootstrap-v3
  cancel-in-progress: true
env:
  R19_BASE_COMMIT: cd7e7cd597af23ca1169e1f19c3ac954727c3f2d
  EXPECTED_VERSION_NAME: 10.14.1
  EXPECTED_VERSION_CODE: '118'
  R19_PATCH_SHA256: cdde2432847080323e32430c86e5a717877a6f54a5c21a32820072c1761c7332
  R19_FIX3_PAYLOAD_COMMIT: 3477b1b9b7f2210823054634e4f840ff9744910c
  RUN17_RUN_ID: '32697570904'
  RUN17_ARTIFACT_NAME: mobdea-r19-run17-full-result
  RUN17_PATCH_SHA256: 6bc7ddab1e908916cf1bb01c59a4aff463c33220931f82c314c27178ce7d4270
  RUN17_FIXED_TAR_SHA256: d7b7ef0f92f4396e0bdb3cfdb55d19ca3669564ed2ab61a6e2b98d74352dd1b0
  LAST_GREEN_RUN_ID: '32714480207'
  LAST_GREEN_ARTIFACT_NAME: mobdea-r19-final-01-14-fix8-13-v118
  R20_EMBEDDED_PAYLOAD_SHA256: 3e4b660533f9310340ae6691237ad837676c01b538846dd4132cb0c7cb3fefb2
jobs:
  r20_final_audited_01_26:
    name: Safe surgical R19 + FIX01-25 + final audit
    runs-on: ubuntu-24.04
    timeout-minutes: 800
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
    - name: Checkout exact protected R19 baseline
