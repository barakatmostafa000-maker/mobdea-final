      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP"
        ARCHIVE="$RUNNER_TEMP/r20_payload.tar.xz"
        ROOT="$RUNNER_TEMP/r20_payload"
        rm -rf "$ROOT" "$ARCHIVE" "$RUNNER_TEMP/r20_payload.b64"
        cat > "$RUNNER_TEMP/r20_payload.b64" <<'R20_PAYLOAD_B64'
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        R20_PAYLOAD_B64
        base64 -d "$RUNNER_TEMP/r20_payload.b64" > "$ARCHIVE"
        echo "3e4b660533f9310340ae6691237ad837676c01b538846dd4132cb0c7cb3fefb2  $ARCHIVE" | sha256sum -c -
        mkdir -p "$ROOT"
        tar -xJf "$ARCHIVE" -C "$ROOT"
        SCRIPT_ROOT="$ROOT/.github/r20/scripts"
        test -d "$SCRIPT_ROOT"
        test "$(find "$SCRIPT_ROOT" -maxdepth 1 -type f -name '*.sh' | wc -l)" -eq 141
