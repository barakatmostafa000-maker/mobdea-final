name: R18 Complete Repair and APK

"on":
  push:
    branches:
      - v14-working
    paths:
      - .github/workflows/r18-complete-repair.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-build:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout current V14 working
        uses: actions/checkout@v4
        with:
          ref: v14-working
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Apply P1 plus complete R18 device repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYWRITE'
          from pathlib import Path
          import base64

          payloads = {
              'src/services/viewport.js': '',
              'src/styles/r18-classmode-viewport-fix.css': '',
              'src/styles/r18-complete-fixes.css': '',
              'src/services/nativeAssetBridge.js': '',
              'android/app/src/main/java/com/mobdea/education/MainActivity.java': '',
              'android/app/src/main/java/com/mobdea/education/assets/MobdeaNativeAssetPlugin.java': '',
          }
          for relative, encoded in payloads.items():
              target = Path(relative)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(base64.b64decode(encoded))

          Path('/tmp/r18_patch_sources.py').write_bytes(base64.b64decode(''))
          PYWRITE
          python3 /tmp/r18_patch_sources.py
          git diff --check
          echo "R18 repair payload applied successfully."

      - name: Verify repair acceptance markers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYVERIFY'
          from pathlib import Path

          checks = {
              'viewport P1': 'stableViewportValue' in Path('src/services/viewport.js').read_text(),
              'immersive Android': 'BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE' in Path('android/app/src/main/java/com/mobdea/education/MainActivity.java').read_text(),
              'native bridge': 'sizeText' in Path('src/services/nativeAssetBridge.js').read_text(),
              'native asset limit': '256L * 1024L * 1024L' in Path('android/app/src/main/java/com/mobdea/education/assets/MobdeaNativeAssetPlugin.java').read_text(),
              'PDF pinch zoom': 'صفحة PDF — قرّب بإصبعين' in Path('src/components/classmode/MediaRenderer.jsx').read_text(),
              'PPTX fallback': 'parsePptxNative(blob).catch' in Path('src/components/classmode/PptxPreview.jsx').read_text(),
              'OCR editable pages': "form.questionPageStart ?? ''" in Path('src/pages/ContentLibrary.jsx').read_text(),
              'Nile map': "title: 'حوض نهر النيل'" in Path('src/data/geography.js').read_text(),
              'Nile tributaries': 'NILE_TEACHING_LINES' in Path('src/components/maps/LessonMapStudio.jsx').read_text(),
              'native map voice': 'speakArabic(text' in Path('src/components/maps/LessonMapStudio.jsx').read_text(),
              'bottom Nile control': 'lesson-map-quick-toggle nile' in Path('src/components/maps/LessonMapStudio.jsx').read_text(),
              'map zoom persistence': 'Math.min(5, Number(saved.zoom || 1))' in Path('src/services/lessonMapState.js').read_text(),
              'smaller lesson cards': 'Math.max(150' in Path('src/pages/ClassMode.jsx').read_text(),
              'smaller country cards': 'Math.max(180' in Path('src/pages/ClassMode.jsx').read_text(),
              'student card both sides': 'both-sides' in Path('src/pages/StudentCards.jsx').read_text(),
              'final CSS': 'R18 COMPLETE DEVICE FIXES' in Path('src/styles/r18-complete-fixes.css').read_text(),
          }
          missing = [name for name, ok in checks.items() if not ok]
          if missing:
              raise SystemExit('Missing repair markers: ' + ', '.join(missing))
          print(f'Acceptance markers passed: {len(checks)}/{len(checks)}')
          PYVERIFY

      - name: Install JavaScript dependencies
        run: npm ci --ignore-scripts

      - name: Run full web verification
        run: npm run verify

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Run Android unit tests
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest

      - name: Run Android lint with full report
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          if ! ./gradlew --no-daemon lintDebug; then
            echo "===== Android lint text reports ====="
            find app/build/reports -maxdepth 4 -type f \( -name '*.txt' -o -name '*.html' \) -print || true
            for report in app/build/reports/lint-results-debug.txt app/build/reports/lint-results-debug.html; do
              if [ -f "$report" ]; then
                echo "===== $report ====="
                sed -n '1,260p' "$report" || true
              fi
            done
            exit 1
          fi

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Verify APK exists
        shell: bash
        run: |
          set -euo pipefail
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload complete debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mobdea-r18-complete-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Commit verified R18 repairs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/main.jsx \
            src/services/viewport.js \
            src/styles/r18-classmode-viewport-fix.css \
            src/styles/r18-complete-fixes.css \
            src/services/nativeAssetBridge.js \
            src/components/classmode/MediaRenderer.jsx \
            src/components/classmode/PptxPreview.jsx \
            src/pages/ContentLibrary.jsx \
            src/data/geography.js \
            src/components/maps/LessonMapStudio.jsx \
            src/services/lessonMapState.js \
            src/pages/MapChallenge.jsx \
            src/pages/ClassMode.jsx \
            src/pages/StudentCards.jsx \
            android/app/src/main/java/com/mobdea/education/MainActivity.java \
            android/app/src/main/java/com/mobdea/education/assets/MobdeaNativeAssetPlugin.java
          if git diff --cached --quiet; then
            echo "No source changes remain to commit."
          else
            git commit -m "Repair R18 classroom media maps cards and Android fullscreen"
            git push origin HEAD:v14-working
          fi

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mobdea-r18-complete-diagnostics
          path: |
            android/app/build/reports/**
            android/app/build/test-results/**
            android/app/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7
