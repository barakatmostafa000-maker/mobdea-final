        run-id: ${{ env.LAST_GREEN_RUN_ID }}
        github-token: ${{ github.token }}
        repository: ${{ github.repository }}
        path: /tmp/r19-last-green
    - name: Restore exact last green R19 V6 source closures
      shell: bash
      run: |
        set -euo pipefail
        for f in \
          /tmp/r19-last-green/ClassMode.V6.jsx \
          /tmp/r19-last-green/MapChallenge.V6.jsx \
          /tmp/r19-last-green/AppShell.V6.jsx \
          /tmp/r19-last-green/R19-FINAL-RUNTIME-FIXES.css \
          /tmp/r19-last-green/REGRESSION-CONTRACT-COMPATIBILITY.patch; do
          test -s "$f" || { echo "::error::Missing last-green artifact file: $f"; exit 1; }
        done
        cp /tmp/r19-last-green/ClassMode.V6.jsx src/pages/ClassMode.jsx
        cp /tmp/r19-last-green/MapChallenge.V6.jsx src/pages/MapChallenge.jsx
        cp /tmp/r19-last-green/AppShell.V6.jsx src/components/AppShell.jsx
        cp /tmp/r19-last-green/R19-FINAL-RUNTIME-FIXES.css src/styles/r19-final-runtime-fixes.css
        python3 - <<'PY_V6_IMPORT'
        from pathlib import Path
        main = Path("src/main.jsx")
        source = main.read_text(encoding="utf-8")
        final_import = "import './styles/r19-final-runtime-fixes.css';"
        anchor = "import './styles/project14-youtube-auto-sync.css';"
        source = source.replace(final_import + "\n", "").replace(final_import, "")
        if anchor not in source:
            raise SystemExit("Last-green CSS import anchor missing")
        source = source.replace(anchor, anchor + "\n" + final_import, 1)
        main.write_text(source, encoding="utf-8")
        check = main.read_text(encoding="utf-8")
        if check.find(final_import) < check.find(anchor):
            raise SystemExit("Last-green CSS precedence verification failed")
        PY_V6_IMPORT
        git apply --check /tmp/r19-last-green/REGRESSION-CONTRACT-COMPATIBILITY.patch
        git apply /tmp/r19-last-green/REGRESSION-CONTRACT-COMPATIBILITY.patch
        git diff --check
    - name: Validate and repair recovered Android Gradle structure
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY_GRADLE_STRUCTURE'
        from pathlib import Path
        path = Path('android/app/build.gradle')
        text = path.read_text(encoding='utf-8')
        bad = "    lint {\n        abortOnError true\n        checkReleaseBuilds true\n        warningsAsErrors false\n    }\n    }\n}\n\nrepositories {"
        good = "    lint {\n        abortOnError true\n        checkReleaseBuilds true\n        warningsAsErrors false\n    }\n}\n\nrepositories {"
        if bad in text:
            path.write_text(text.replace(bad, good, 1), encoding='utf-8')
        elif good not in text and ('android {' not in text or 'defaultConfig {' not in text):
            raise SystemExit('Android Gradle structure is not recognized')
        PY_GRADLE_STRUCTURE
        git diff --check
    - name: Last green R19 V6 source guards before any R20 FIX
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY_R19_GUARDS'
        from pathlib import Path
        class_source = Path("src/pages/ClassMode.jsx").read_text(encoding="utf-8")
        related = class_source.find("const relatedQuestions = useMemo")
        project12 = class_source.find("const [project12QuestionScope")
        if related < 0 or project12 < 0 or related >= project12:
            raise SystemExit("ClassMode TDZ guard failed")
        main_source = Path("src/main.jsx").read_text(encoding="utf-8")
        if "r19-final-runtime-fixes.css" not in main_source:
            raise SystemExit("Final runtime stylesheet import missing")
        map_source = Path("src/pages/MapChallenge.jsx").read_text(encoding="utf-8")
        keys = map_source.split("const coreRegionKeys", 1)[1].split("];", 1)[0]
        if '"nile"' not in keys:
            raise SystemExit("Map Challenge Nile tab guard failed")
        shell_source = Path("src/components/AppShell.jsx").read_text(encoding="utf-8")
        if "document.querySelector('.app-shell-v103:not(.lesson-mode-shell) > .app-content')" not in shell_source:
            raise SystemExit("AppShell content-scroll reset guard failed")
        runtime_css = Path("src/styles/r19-final-runtime-fixes.css").read_text(encoding="utf-8")
        for marker in ("R19_FINAL_RUNTIME_FIXES_V2", ".map-challenge-pro > .map-game-layout", ".map-challenge-pro .map-game-question-panel", ".dashboard-v103 .dashboard-reference-copy p", "overflow-y: auto !important"):
            if marker not in runtime_css:
                raise SystemExit(f"R19 V6 CSS marker missing: {marker}")
        PY_R19_GUARDS
        git diff --check
    - name: Verify green toolchain and app identity without patch-level overconstraint
