      - name: Capacitor Android sync with recovery
        shell: bash
        run: |
          set -euo pipefail
          rm -rf android/capacitor-cordova-android-plugins
          rm -f android/app/capacitor.build.gradle android/capacitor.settings.gradle

          set +e
          npx cap sync android
          SYNC_RC=$?
          set -e

          if [ "$SYNC_RC" -ne 0 ] \
             || [ ! -s android/capacitor-cordova-android-plugins/cordova.variables.gradle ] \
             || [ ! -s android/app/capacitor.build.gradle ]; then
            echo "Primary cap sync incomplete; running update + copy recovery."
            npx cap update android
            npx cap copy android
          fi

          test -s android/app/src/main/assets/public/index.html
          test -s android/capacitor-cordova-android-plugins/cordova.variables.gradle
          test -s android/app/capacitor.build.gradle
          test -s android/capacitor.settings.gradle
          grep -Fq "cordova.variables.gradle" android/app/capacitor.build.gradle
          echo "Capacitor Android sync + generated Gradle files: PASS"

