          python3 /tmp/mobdea-repairs/apply_project14.py
          printf '%s' '' | base64 -d | gzip -d > tests/project14-youtube-auto-sync.test.mjs
          git add -N src/services/project14YoutubeSync.js src/components/settings/Project14YouTubeSyncSettings.jsx src/components/library/Project14YouTubeGradeFeed.jsx src/styles/project14-youtube-auto-sync.css tests/project14-youtube-auto-sync.test.mjs
