        continue-on-error: true
        shell: bash
        working-directory: android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug --stacktrace 2>&1 | tee /tmp/r19-run15-logs/android-debug-build.log
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk >/tmp/r19-run15-logs/android-debug-ziptest.log
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -Eq 'classes([0-9]+)?\.dex'

      - name: Build and verify release APK
        id: android_release
        continue-on-error: true
        shell: bash
        working-directory: android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease --stacktrace 2>&1 | tee /tmp/r19-run15-logs/android-release-build.log
          RELEASE_APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit 2>/dev/null || true)"
          test -n "$RELEASE_APK"
          test -s "$RELEASE_APK"
          unzip -t "$RELEASE_APK" >/tmp/r19-run15-logs/android-release-ziptest.log
          unzip -l "$RELEASE_APK" | grep -Eq 'classes([0-9]+)?\.dex'
          find app/build/outputs/apk -type f -name '*.apk' -print

