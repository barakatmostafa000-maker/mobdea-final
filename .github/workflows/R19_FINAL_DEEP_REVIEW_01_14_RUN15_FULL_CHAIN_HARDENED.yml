      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Android SDK 35
        id: android_sdk
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK"
          command -v sdkmanager >/dev/null
          (yes | sdkmanager --licenses >/dev/null 2>&1) || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" 2>&1 | tee /tmp/r19-run15-logs/android-sdk.log
          printf 'sdk.dir=%s\n' "$SDK" > android/local.properties

      - name: Sync verified web build into Android
