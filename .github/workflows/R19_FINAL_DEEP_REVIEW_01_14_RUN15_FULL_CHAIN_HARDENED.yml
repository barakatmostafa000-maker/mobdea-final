        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          npx cap sync android 2>&1 | tee /tmp/r19-run15-logs/cap-sync.log
          test -s android/app/src/main/assets/public/index.html
          git diff --check

      - name: Android generated configuration gate
        id: android_config
        continue-on-error: true
        shell: bash
        working-directory: android
        run: |
          set -euo pipefail
          chmod +x gradlew
          test -s capacitor-cordova-android-plugins/cordova.variables.gradle
          test -s app/capacitor.build.gradle
          ./gradlew --no-daemon projects --stacktrace 2>&1 | tee /tmp/r19-run15-logs/android-config.log

      - name: Android debug unit tests
