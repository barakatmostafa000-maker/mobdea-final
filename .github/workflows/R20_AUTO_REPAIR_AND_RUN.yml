name: R20 Auto Repair and Run

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/R20_AUTO_REPAIR_AND_RUN.yml

permissions:
  contents: write
  actions: write

jobs:
  repair-and-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Repair FIX23 gate
        shell: bash
        run: |
          set -euo pipefail
          FILE=".github/workflows/R20_SAFE_R19_FIX01_25_GREEN_BOOTSTRAP_V11.yml"

          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import sys

          p = Path(sys.argv[1])
          s = p.read_text(encoding="utf-8")

          old = "grep -Fq 'size: 210mm 297mm' src/styles/r20-fix23-duplex-print.css"
          new = """grep -Fq 'size:' src/styles/r20-fix23-duplex-print.css
                  grep -Fq '210mm' src/styles/r20-fix23-duplex-print.css
                  grep -Fq '297mm' src/styles/r20-fix23-duplex-print.css"""

          if old in s:
              p.write_text(s.replace(old, new, 1), encoding="utf-8")
              print("FIX23 gate repaired.")
          else:
              print("FIX23 gate is already repaired; nothing to change.")
          PY

      - name: Commit repair to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .github/workflows/R20_SAFE_R19_FIX01_25_GREEN_BOOTSTRAP_V11.yml

          if git diff --cached --quiet; then
            echo "No repair commit needed."
          else
            git commit -m "fix: repair R20 FIX23 duplex A4 gate"
            git push origin main
          fi

      - name: Trigger repaired R20 workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run R20_SAFE_R19_FIX01_25_GREEN_BOOTSTRAP_V11.yml \
            --repo "${{ github.repository }}" \
            --ref main
          echo "Repaired R20 workflow dispatched."
