jobs:
  r20_final_audited_01_26:
    name: Safe surgical R19 + FIX01-25 + final audit
    runs-on: ubuntu-24.04
    timeout-minutes: 800
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
    - name: Checkout exact protected R19 baseline
      uses: actions/checkout@v4
      with:
        ref: ${{ env.R19_BASE_COMMIT }}
        fetch-depth: 1
        clean: true
    - name: Verify exact clean R19 baseline
      shell: bash
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "$R19_BASE_COMMIT"
        test -z "$(git status --porcelain)"
        test -f package.json
        test -f package-lock.json
        test -d android
        echo "Exact protected R19 baseline verified: $R19_BASE_COMMIT"
    - name: Restore embedded FIX01-25 scripts outside protected workspace
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP"
        ARCHIVE="$RUNNER_TEMP/r20_payload.tar.xz"
