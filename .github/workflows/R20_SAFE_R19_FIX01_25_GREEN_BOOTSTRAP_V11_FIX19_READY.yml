  contents: read
  actions: read
concurrency:
  group: r20-safe-surgical-r19-fix01-25-green-bootstrap-v11
  cancel-in-progress: true
env:
  R19_BASE_COMMIT: cd7e7cd597af23ca1169e1f19c3ac954727c3f2d
  EXPECTED_VERSION_NAME: 10.14.1
  EXPECTED_VERSION_CODE: '118'
  R19_PATCH_SHA256: cdde2432847080323e32430c86e5a717877a6f54a5c21a32820072c1761c7332
