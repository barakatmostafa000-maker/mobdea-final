name: Verify and Build Mobdea Android

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Run tests, security checks, formatting and production build
        run: npm run verify

  debug-apk:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - run: npm ci --ignore-scripts
      - run: npm run cap:sync
      - name: Build and lint debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon lintDebug testDebugUnitTest assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mobdea-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  signed-release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MOBDEA_KEYSTORE_PASSWORD: ${{ secrets.MOBDEA_KEYSTORE_PASSWORD }}
      MOBDEA_KEY_ALIAS: ${{ secrets.MOBDEA_KEY_ALIAS }}
      MOBDEA_KEY_PASSWORD: ${{ secrets.MOBDEA_KEY_PASSWORD }}
      MOBDEA_APK_URL: ${{ vars.MOBDEA_APK_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Validate release signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.MOBDEA_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$MOBDEA_KEYSTORE_PASSWORD"
          test -n "$MOBDEA_KEY_ALIAS"
          test -n "$MOBDEA_KEY_PASSWORD"
          test -n "$MOBDEA_APK_URL"
          case "$MOBDEA_APK_URL" in https://*) ;; *) echo "MOBDEA_APK_URL must use HTTPS" >&2; exit 1 ;; esac
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mobdea-release.jks"
          echo "MOBDEA_KEYSTORE_PATH=$RUNNER_TEMP/mobdea-release.jks" >> "$GITHUB_ENV"
      - run: npm ci --ignore-scripts
      - run: npm run cap:sync
      - name: Build signed APK and AAB
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon lintRelease testReleaseUnitTest assembleRelease bundleRelease
      - name: Verify APK signature
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs android/app/build/outputs/apk/release/app-release.apk
      - name: Generate verified update manifest
        run: node scripts/create-update-manifest.mjs android/app/build/outputs/apk/release/app-release.apk "$MOBDEA_APK_URL"
      - name: Upload signed release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mobdea-signed-release
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/release/update.manifest.json
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
      - name: Remove decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/mobdea-release.jks"
