name: Build Mobdea Final Candidate APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build web application
        run: npm run build

      - name: Sync web files into Android
        run: npx cap sync android

      - name: Verify Android manifest
        run: |
          grep -q 'android.permission.CAMERA' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk mobdea-final-candidate-debug.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: mobdea-final-candidate-apk
          path: mobdea-final-candidate-debug.apk
          if-no-files-found: error
          retention-days: 30
