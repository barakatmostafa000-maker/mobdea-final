name: Build Mobdea Final Candidate APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install JavaScript dependencies
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
        run: |
          rm -rf node_modules
          npm config delete proxy || true
          npm config delete https-proxy || true
          npm config set registry https://registry.npmjs.org/
          npm cache clean --force
          npm install --package-lock=false --legacy-peer-deps --registry=https://registry.npmjs.org/
          npm install --no-save vite@6.1.0 @vitejs/plugin-react@4.4.1 typescript@5 @capacitor/cli@7.4.3 --registry=https://registry.npmjs.org/

      - name: Verify JavaScript tools
        run: |
          ./node_modules/.bin/vite --version
          ./node_modules/.bin/tsc --version
          npx cap --version

      - name: Build web application
        run: ./node_modules/.bin/vite build

      - name: Verify web build
        run: |
          test -f dist/index.html
          test -d dist/assets

      - name: Sync web files into Android
        run: npx cap sync android

      - name: Verify Android manifest
        run: |
          grep -q 'android.permission.CAMERA' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk mobdea-final-candidate-debug.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: mobdea-final-candidate-apk
          path: mobdea-final-candidate-debug.apk
          if-no-files-found: error
          retention-days: 30
