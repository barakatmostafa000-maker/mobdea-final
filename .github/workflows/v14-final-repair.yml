name: V14 Final Repair

on:
  push:
    branches:
      - v14-working
    paths:
      - .github/workflows/v14-final-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout v14-working
        uses: actions/checkout@v4
        with:
          ref: v14-working
          fetch-depth: 0

      - name: Apply five verified source repairs
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 --decode > /tmp/v14_repair.py
          python3 /tmp/v14_repair.py

      - name: Run focused regression tests
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/browser-p0-regression.test.mjs tests/browser-p0-v5-regression.test.mjs

      - name: Sync and install exact dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts
          npm ci --ignore-scripts

      - name: Run complete verification and production build
        run: npm run verify

      - name: Commit only after every check passes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/ContentLibrary.jsx src/components/classmode/ClassroomGamePanel.jsx src/hooks/usePdfPage.js src/styles/v107.css src/pages/ClassMode.jsx package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No source changes were needed."
            exit 0
          fi
          git commit -m "Repair five V14 regressions"
          git push origin HEAD:v14-working
