name: Build V14 Android APK Final

on:
  push:
    branches:
      - v14-working
    paths:
      - .github/workflows/android-apk-final.yml
      - android/app/src/main/java/com/mobdea/education/recording/MobdeaScreenRecorderPlugin.java
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout v14-working
        uses: actions/checkout@v4
        with:
          ref: v14-working
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Apply OCR and API23 compatibility repairs
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 --decode > /tmp/android_final_repair.py
          python3 /tmp/android_final_repair.py

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Verify frontend and sync Capacitor
        run: |
          npm run verify
          npx cap sync android

      - name: Run Android unit tests
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest

      - name: Run Android lint with full failure report
        working-directory: android
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon lintDebug
          STATUS=$?
          REPORT="app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt"
          if [ -f "$REPORT" ]; then
            echo "===== FULL ANDROID LINT REPORT ====="
            cat "$REPORT"
            echo "===== END ANDROID LINT REPORT ====="
          fi
          exit $STATUS

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Verify APK exists
        shell: bash
        run: |
          set -euo pipefail
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Commit verified Android repairs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            android/app/src/main/java/com/mobdea/education/ocr/MobdeaPdfOcrPlugin.java \
            android/app/src/main/java/com/mobdea/education/pptx/MobdeaPptxRendererPlugin.java \
            android/app/src/main/java/com/mobdea/education/recording/MobdeaScreenRecorderPlugin.java
          if git diff --cached --quiet; then
            echo "Android source already contains the verified repairs."
          else
            git commit -m "Repair Android OCR and API23 compatibility"
            git push origin HEAD:v14-working
          fi

      - name: Upload V14 debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mobdea-v14-final-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload lint report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mobdea-v14-android-diagnostics
          path: |
            android/app/build/reports/lint-results-debug.html
            android/app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          if-no-files-found: ignore
          retention-days: 7
