name: R20 FINAL FROM LAST GREEN R19 V6 FIX8

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/R20_FINAL_FROM_LAST_GREEN_FIX8.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: r20-final-from-last-green-r19-v6-fix8
  cancel-in-progress: true

env:
  R19_BASE_COMMIT: cd7e7cd597af23ca1169e1f19c3ac954727c3f2d
  RUN17_RUN_ID: "32697570904"
  RUN17_ARTIFACT_NAME: mobdea-r19-run17-full-result
  RUN17_PATCH_SHA256: 6bc7ddab1e908916cf1bb01c59a4aff463c33220931f82c314c27178ce7d4270
  RUN17_FIXED_TAR_SHA256: d7b7ef0f92f4396e0bdb3cfdb55d19ca3669564ed2ab61a6e2b98d74352dd1b0
  LAST_GREEN_RUN_ID: "32714480207"
  LAST_GREEN_ARTIFACT_NAME: mobdea-r19-final-01-14-fix8-13-v118
  R20_SOURCE_TAR_SHA256: 03804eefcfa7b8c2284dfb56303b7ff187af672036f041f41f267dd4283f653c
  EXPECTED_VERSION_NAME: "10.14.1"
  EXPECTED_VERSION_CODE: "118"

jobs:
  build-r20-final:
    runs-on: ubuntu-24.04
    timeout-minutes: 300

    steps:
      - name: Checkout exact R19 baseline
        uses: actions/checkout@v4
        with:
          ref: ${{ env.R19_BASE_COMMIT }}
          fetch-depth: 1

      - name: Verify exact clean baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$R19_BASE_COMMIT"
          test -z "$(git status --porcelain)"
          test -f package.json
          test -f package-lock.json
          test -d android
          echo "Exact R19 baseline verified: $R19_BASE_COMMIT"

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          for attempt in 1 2 3; do
            if sdkmanager "platform-tools" "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.0"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Android SDK package installation failed."
              exit 1
            fi
            sleep $((attempt * 5))
          done
          test -s "$SDK/platforms/android-35/android.jar"
          test -x "$SDK/build-tools/34.0.0/aapt2"
          test -x "$SDK/build-tools/35.0.0/aapt"
          test -x "$SDK/build-tools/35.0.0/apksigner"
          test -x "$SDK/build-tools/35.0.0/zipalign"
          echo "$SDK/build-tools/35.0.0" >> "$GITHUB_PATH"
          printf 'sdk.dir=%s\n' "$SDK" > android/local.properties

      - name: Download reviewed RUN17 repair artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.RUN17_ARTIFACT_NAME }}
          run-id: ${{ env.RUN17_RUN_ID }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: /tmp/r19-run17

      - name: Verify and apply reviewed Repairs 01-14 final diff
        shell: bash
        run: |
          set -euo pipefail
          PATCH="/tmp/r19-run17/R19_RUN17_FINAL.patch"
          test -s "$PATCH"
          ACTUAL="$(sha256sum "$PATCH" | awk '{print $1}')"
          test "$ACTUAL" = "$RUN17_PATCH_SHA256"

          git apply --check "$PATCH"
          git apply "$PATCH"

          FIXED_TAR="/tmp/r19-run17/R19_RUN17_FIXED_FILES.tar.gz"
          test -s "$FIXED_TAR"
          TAR_ACTUAL="$(sha256sum "$FIXED_TAR" | awk '{print $1}')"
          test "$TAR_ACTUAL" = "$RUN17_FIXED_TAR_SHA256"

          tar -xzf "$FIXED_TAR" -C . \
            tests/run15-build-readiness.test.mjs \
            tests/run15-runtime-contract.test.mjs

          test -s tests/run15-build-readiness.test.mjs
          test -s tests/run15-runtime-contract.test.mjs
          git add -N tests/run15-build-readiness.test.mjs tests/run15-runtime-contract.test.mjs

          git diff --check

          node - <<'NODE_VERSION'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (pkg.version !== process.env.EXPECTED_VERSION_NAME) {
            throw new Error(`Unexpected versionName: ${pkg.version}`);
          }
          if (String(pkg.mobdea?.versionCode) !== process.env.EXPECTED_VERSION_CODE) {
            throw new Error(`Unexpected versionCode: ${pkg.mobdea?.versionCode}`);
          }
          NODE_VERSION

      - name: Close RUN18 Attendance WhatsApp root cause
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_RUN18_ROOT'
          from pathlib import Path
          import re

          notifications = Path("src/services/notifications.js")
          attendance = Path("src/pages/Attendance.jsx")
          if not notifications.is_file() or not attendance.is_file():
              raise SystemExit("Required Attendance/notifications source missing")

          source = notifications.read_text(encoding="utf-8")
          if not re.search(r"\bexport\s+(?:async\s+)?function\s+sendAbsenceWhatsApp\b", source):
              source = source.rstrip() + r'''

          // RUN18_ATTENDANCE_WHATSAPP_EXPORT_CLOSURE_V1
          export function sendAbsenceWhatsApp(student = {}, session = {}, date = '') {
            const rawPhone = String(student?.guardianPhone || '').trim();
            const normalized = rawPhone.replace(/\D/g, '').replace(/^0/, '20');
            if (!normalized) {
              return { ok: false, message: 'لا يوجد رقم هاتف مسجل لولي الأمر.' };
            }
            const safeDate = String(date || new Date().toISOString().slice(0, 10));
            const message = cleanWhatsAppMessage(
              buildAttendanceMessage(student?.name || 'الطالب', 'absent', safeDate),
            );
            if (typeof window === 'undefined' || typeof window.open !== 'function') {
              return { ok: false, message: 'فتح واتساب متاح من التطبيق أو المتصفح فقط.' };
            }
            const url = `https://wa.me/${normalized}?text=${encodeURIComponent(message)}`;
            window.open(url, '_blank', 'noopener,noreferrer');
            return { ok: true, message: `تم فتح واتساب لإبلاغ ولي أمر ${student?.name || 'الطالب'}.` };
          }
          '''
              notifications.write_text(source, encoding="utf-8")

          attendance_source = attendance.read_text(encoding="utf-8")
          if "sendAbsenceWhatsApp" not in attendance_source:
              raise SystemExit("Attendance no longer calls sendAbsenceWhatsApp")
          updated = notifications.read_text(encoding="utf-8")
          if not re.search(r"\bexport\s+(?:async\s+)?function\s+sendAbsenceWhatsApp\b", updated):
              raise SystemExit("sendAbsenceWhatsApp export was not created")
          PY_RUN18_ROOT

          node --check src/services/notifications.js
          git diff --check

      - name: Download actual last green R19 V6 artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.LAST_GREEN_ARTIFACT_NAME }}
          run-id: ${{ env.LAST_GREEN_RUN_ID }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: /tmp/r19-last-green

      - name: Restore exact last green V6 source closures
        shell: bash
        run: |
          set -euo pipefail

          for f in \
            /tmp/r19-last-green/ClassMode.V6.jsx \
            /tmp/r19-last-green/MapChallenge.V6.jsx \
            /tmp/r19-last-green/AppShell.V6.jsx \
            /tmp/r19-last-green/R19-FINAL-RUNTIME-FIXES.css \
            /tmp/r19-last-green/REGRESSION-CONTRACT-COMPATIBILITY.patch; do
            test -s "$f" || { echo "::error::Missing last-green artifact file: $f"; exit 1; }
          done

          cp /tmp/r19-last-green/ClassMode.V6.jsx src/pages/ClassMode.jsx
          cp /tmp/r19-last-green/MapChallenge.V6.jsx src/pages/MapChallenge.jsx
          cp /tmp/r19-last-green/AppShell.V6.jsx src/components/AppShell.jsx
          cp /tmp/r19-last-green/R19-FINAL-RUNTIME-FIXES.css src/styles/r19-final-runtime-fixes.css

          python3 - <<'PY_V6_IMPORT'
          from pathlib import Path

          main = Path("src/main.jsx")
          source = main.read_text(encoding="utf-8")
          final_import = "import './styles/r19-final-runtime-fixes.css';"
          anchor = "import './styles/project14-youtube-auto-sync.css';"

          source = source.replace(final_import + "\n", "").replace(final_import, "")
          if anchor not in source:
              raise SystemExit("Last-green CSS import anchor missing")
          source = source.replace(anchor, anchor + "\n" + final_import, 1)
          main.write_text(source, encoding="utf-8")

          check = main.read_text(encoding="utf-8")
          if check.find(final_import) < check.find(anchor):
              raise SystemExit("Last-green CSS precedence verification failed")
          PY_V6_IMPORT

          git apply --check /tmp/r19-last-green/REGRESSION-CONTRACT-COMPATIBILITY.patch
          git apply /tmp/r19-last-green/REGRESSION-CONTRACT-COMPATIBILITY.patch

          git diff --check

      - name: Validate and repair recovered Android Gradle structure
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_GRADLE_STRUCTURE'
          from pathlib import Path

          path = Path('android/app/build.gradle')
          text = path.read_text(encoding='utf-8')
          bad = "    lint {\n        abortOnError true\n        checkReleaseBuilds true\n        warningsAsErrors false\n    }\n    }\n}\n\nrepositories {"
          good = "    lint {\n        abortOnError true\n        checkReleaseBuilds true\n        warningsAsErrors false\n    }\n}\n\nrepositories {"

          if bad in text:
              path.write_text(text.replace(bad, good, 1), encoding='utf-8')
          elif good not in text:
              if 'android {' not in text or 'defaultConfig {' not in text:
                  raise SystemExit('Android Gradle structure is not recognized')
          PY_GRADLE_STRUCTURE

          git diff --check

      - name: Last green R19 V6 source guards
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY_R19_GUARDS'
          from pathlib import Path

          class_source = Path("src/pages/ClassMode.jsx").read_text(encoding="utf-8")
          related = class_source.find("const relatedQuestions = useMemo")
          project12 = class_source.find("const [project12QuestionScope")
          if related < 0 or project12 < 0 or related >= project12:
              raise SystemExit("ClassMode TDZ guard failed")

          main_source = Path("src/main.jsx").read_text(encoding="utf-8")
          if "r19-final-runtime-fixes.css" not in main_source:
              raise SystemExit("Final runtime stylesheet import missing")

          map_source = Path("src/pages/MapChallenge.jsx").read_text(encoding="utf-8")
          keys = map_source.split("const coreRegionKeys", 1)[1].split("];", 1)[0]
          if '"nile"' not in keys:
              raise SystemExit("Map Challenge Nile tab guard failed")

          shell_source = Path("src/components/AppShell.jsx").read_text(encoding="utf-8")
          if "document.querySelector('.app-shell-v103:not(.lesson-mode-shell) > .app-content')" not in shell_source:
              raise SystemExit("AppShell content-scroll reset guard failed")

          runtime_css = Path("src/styles/r19-final-runtime-fixes.css").read_text(encoding="utf-8")
          for marker in (
              "R19_FINAL_RUNTIME_FIXES_V2",
              ".map-challenge-pro > .map-game-layout",
              ".map-challenge-pro .map-game-question-panel",
              ".dashboard-v103 .dashboard-reference-copy p",
              "overflow-y: auto !important",
          ):
              if marker not in runtime_css:
                  raise SystemExit(f"R19 V6 CSS marker missing: {marker}")
          PY_R19_GUARDS

          git diff --check

      - name: Fetch and verify fixed R20 source package
        shell: bash
        run: |
          set -euo pipefail

          REPO="${GITHUB_REPOSITORY}"
          REF="${GITHUB_SHA}"
          BASE_URL="https://raw.githubusercontent.com/${REPO}/${REF}"

          rm -rf /tmp/r20-parts
          mkdir -p /tmp/r20-parts

          for n in 01 02 03 04; do
            FILE="R20_SOURCE_RELEASE_FIXED2.tar.gz.b64.part${n}"
            curl --fail --location --retry 4 --retry-all-errors \
              --connect-timeout 20 --max-time 120 \
              "${BASE_URL}/${FILE}" \
              --output "/tmp/r20-parts/${FILE}"
            test -s "/tmp/r20-parts/${FILE}"
          done

          cat /tmp/r20-parts/R20_SOURCE_RELEASE_FIXED2.tar.gz.b64.part* \
            | base64 -d > /tmp/R20_SOURCE_RELEASE.tar.gz

          ACTUAL="$(sha256sum /tmp/R20_SOURCE_RELEASE.tar.gz | awk '{print $1}')"
          echo "R20 source expected: $R20_SOURCE_TAR_SHA256"
          echo "R20 source actual:   $ACTUAL"
          test "$ACTUAL" = "$R20_SOURCE_TAR_SHA256"

          tar -tzf /tmp/R20_SOURCE_RELEASE.tar.gz > /tmp/r20-tar-list.txt
          test -s /tmp/r20-tar-list.txt

      - name: Apply fixed R20 source release
        shell: bash
        run: |
          set -euo pipefail

          tar -xzf /tmp/R20_SOURCE_RELEASE.tar.gz -C .

          grep -Fq "R20_FIX24_MOBDEA_ONLINE_CONFIG_V2_VERIFIED_LINKS" src/config/r20MobdeaOnlineConfig.js
          grep -Fq "R20_FIX25_MONTHLY_EVALUATION_V1" src/services/r20MonthlyEvaluation.js
          grep -Fq "R20_FIX07_PDF_PINCH_PAN_BOARD_OVERLAY_V2_AUDITED" src/services/r20PdfGestures.js

          grep -Fq "R19_FINAL_RUNTIME_FIXES_V2" src/styles/r19-final-runtime-fixes.css
          grep -Fq "document.querySelector('.app-shell-v103:not(.lesson-mode-shell) > .app-content')" src/components/AppShell.jsx
          grep -Fq '"nile"' src/pages/MapChallenge.jsx

          git diff --check

      - name: Close all legacy duplex formatting regressions
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY_DUPLEX_COMPAT'
          from pathlib import Path

          path = Path("tests/student-card-printing-r14.test.mjs")
          if not path.is_file():
              raise SystemExit("Legacy R14 printing test is missing")

          text = path.read_text(encoding="utf-8")

          pairs = [
              (
                  """assert.match(source, /startPrinting\('both'\)/);""",
                  """assert.match(source, /startPrinting\(["']both["']\)/);""",
                  "startPrinting both",
              ),
              (
                  """assert.match(source, /printCurrentView\('بطاقات طلاب المبدع', \{/);""",
                  """assert.match(source, /printCurrentView\(["']بطاقات طلاب المبدع["']\s*,\s*\{/);""",
                  "printCurrentView title",
              ),
              (
                  """assert.match(source, /duplexMode: normalizedMode === 'both' \? nativeDuplexMode\(duplexMode\) : 'none'/);""",
                  """assert.match(source, /duplexMode:\s*normalizedMode\s*===\s*["']both["']\s*\?\s*nativeDuplexMode\(duplexMode\)\s*:\s*["']none["']/);""",
                  "duplex mode expression",
              ),
          ]

          changed = []
          for old, new, label in pairs:
              if old in text:
                  text = text.replace(old, new, 1)
                  changed.append(label)
              elif new in text:
                  pass
              else:
                  raise SystemExit(
                      f"Unexpected R14 assertion for {label}; refusing blind edit"
                  )

          path.write_text(text, encoding="utf-8")
          print("Closed legacy formatting assertions:", ", ".join(changed) or "already compatible")
          PY_DUPLEX_COMPAT

          node --check tests/student-card-printing-r14.test.mjs

          # Exact GitHub subtest that failed in FIX3.
          node --test \
            --test-name-pattern="top card print action prepares both faces" \
            tests/student-card-printing-r14.test.mjs

          # The production behavior itself remains mandatory.
          node --input-type=module - <<'NODE_DUPLEX_SOURCE'
          import fs from 'node:fs';

          const source = fs.readFileSync('src/pages/StudentCards.jsx', 'utf8');
          const required = [
            [/startPrinting\(["']both["']\)/, 'both print action'],
            [/printCurrentView\(["']بطاقات طلاب المبدع["']\s*,\s*\{/, 'print title'],
            [/duplexMode:\s*normalizedMode\s*===\s*["']both["']\s*\?\s*nativeDuplexMode\(duplexMode\)\s*:\s*["']none["']/, 'duplex mode mapping'],
            [/<DuplexPrintRun/, 'DuplexPrintRun'],
            [/data-side=["']front["']/, 'front side'],
            [/data-side=["']back["']/, 'back side'],
          ];

          for (const [pattern, label] of required) {
            if (!pattern.test(source)) {
              throw new Error(`Missing duplex behavior: ${label}`);
            }
          }

          const front = source.indexOf('duplex-front-page');
          const back = source.indexOf('duplex-back-page');
          if (front < 0 || back < 0 || front >= back) {
            throw new Error('Front/back physical order contract failed');
          }

          console.log('Legacy duplex production-source contract: PASS (7/7)');
          NODE_DUPLEX_SOURCE

      - name: Guard protected R19 pages and R20 critical markers
        shell: bash
        run: |
          set -euo pipefail

          require_file() {
            local file="$1"
            local min_bytes="$2"
            test -s "$file" || { echo "::error::Missing protected file: $file"; exit 1; }
            local size
            size="$(wc -c < "$file")"
            [ "$size" -ge "$min_bytes" ] || { echo "::error::Protected file unexpectedly small: $file ($size bytes)"; exit 1; }
          }

          require_marker() {
            local marker="$1"
            local file="$2"
            grep -Fq "$marker" "$file" || { echo "::error::Required marker [$marker] missing from $file"; exit 1; }
          }

          require_file src/pages/Attendance.jsx 8000
          require_file src/pages/Payments.jsx 4000
          require_file src/pages/Sessions.jsx 4500
          require_file src/pages/ResultDetails.jsx 4000

          require_marker "queueAbsenceNotification" src/pages/Attendance.jsx
          require_marker "sendAbsenceWhatsApp" src/pages/Attendance.jsx
          require_marker "PROJECT13_BARCODE_ATTENDANCE_ACCOUNTING_V1" src/pages/Attendance.jsx
          require_marker "Project13LinkHub" src/pages/Sessions.jsx
          require_marker "PROJECT13" src/pages/Payments.jsx
          require_marker "PROJECT13" src/pages/ResultDetails.jsx

          require_marker "CanvasOverlay" src/pages/ClassMode.jsx
          require_marker "classmode-board-surface" src/pages/ClassMode.jsx
          require_marker "Project08ExamOcrImport" src/pages/QuestionBankManager.jsx
          require_marker "PROJECT08_OCR_EXAM_IMPORT_V1" src/pages/Games.jsx
          require_marker "project08QuestionImport" src/pages/Games.jsx

          require_marker "R19_FINAL_RUNTIME_FIXES_V2" src/styles/r19-final-runtime-fixes.css

          require_marker "R20_FIX01" src/services/r20RuntimeCore.js
          require_marker "R20_FIX05" src/services/r20PortalDashboard.js
          require_marker "R20_FIX08" src/services/r20PageOcrPipeline.js
          require_marker "R20_FIX15" src/services/r20MapChallengeRuntime.js
          require_marker "R20_FIX19" src/services/r20QuestionBankPipeline.js
          require_marker "R20_FIX20" src/services/r20ExamTracking.js
          require_marker "R20_FIX21" src/services/r20ReportsWhatsApp.js
          require_marker "R20_FIX22" src/services/r20RemedialAssistant.js
          require_marker "R20_FIX23" src/services/r20DuplexPrinting.js
          require_marker "R20_FIX24" src/services/r20MobdeaOnline.js
          require_marker "R20_FIX25" src/services/r20MonthlyEvaluation.js

      - name: Preflight R19 and R20 source inventory
        shell: bash
        run: |
          set -euo pipefail

          node --check src/services/notifications.js
          node --check src/services/project13AttendanceAccounting.js
          node --check src/services/project13BarcodeScanner.js
          node --check src/services/project14YoutubeSync.js
          node --check src/services/projectFinalStudentAssets.js
          node --check cloud-worker/worker.js

          for f in src/services/r20*.js src/config/r20*.js tests/r20*.test.mjs; do
            node --check "$f"
          done
          node --check cloud-worker/r20PortalAccounts.js

          for test_file in \
            tests/final-integration-01-14.test.mjs \
            tests/project09-dashboard-responsive.test.mjs \
            tests/project10-online-class.test.mjs \
            tests/project11-student-sync.test.mjs \
            tests/project12-integrated.test.mjs \
            tests/project13-integrated.test.mjs \
            tests/project14-youtube-auto-sync.test.mjs \
            tests/r19-fix8-integrity.test.mjs \
            tests/r19-interaction-stability.test.mjs \
            tests/run15-build-readiness.test.mjs \
            tests/run15-runtime-contract.test.mjs \
            tests/r20-audit-phase01-08.test.mjs \
            tests/r20-fix25-monthly-evaluation.test.mjs; do
            test -s "$test_file" || { echo "::error::Missing regression test: $test_file"; exit 1; }
          done

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci

      - name: Source lint format static gates
        shell: bash
        run: |
          set -euo pipefail
          npm run lint
          npm run format:check
          npm run verify:static

      - name: Production web build import-export gate
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          test -s dist/index.html

      - name: Last green R19 cumulative regression tests
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/final-integration-01-14.test.mjs
          node --test tests/project09-dashboard-responsive.test.mjs
          node --test tests/project10-online-class.test.mjs
          node --test tests/project11-student-sync.test.mjs
          node --test tests/project12-integrated.test.mjs
          node --test tests/project13-integrated.test.mjs
          node --test tests/project14-youtube-auto-sync.test.mjs
          node --test tests/r19-fix8-integrity.test.mjs
          node --test tests/r19-interaction-stability.test.mjs
          node --test tests/run15-build-readiness.test.mjs
          node --test tests/run15-runtime-contract.test.mjs

      - name: OCR explicit-answer compatibility gate
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE_OCR_FIX2'
          import { structureOcrQuestions } from './src/services/ocrQuestionParser.js';

          const result = structureOcrQuestions([
            'أسئلة الدرس',
            '١- ما عاصمة مصر؟',
            'أ) القاهرة',
            'ب) الإسكندرية',
            'ج) أسوان',
            'د) الأقصر',
            'الإجابة: أ',
            '٢- يمر نهر النيل في مصر؟',
            'الإجابة: صح',
            '٣- اذكر نتيجة بناء السد العالي.',
          ].join('\n'));

          if (result.questionCount !== 3) throw new Error(`OCR questionCount=${result.questionCount}`);
          if (result.answeredCount !== 2) throw new Error(`OCR answeredCount=${result.answeredCount}`);
          if (result.reviewCount !== 1) throw new Error(`OCR reviewCount=${result.reviewCount}`);
          if (!/الإجابة: أ/.test(result.questionText)) throw new Error('OCR explicit source answer label was not preserved');
          if (result.questions?.[0]?.answer !== 'القاهرة') throw new Error('OCR grading answer did not resolve to option text');
          if (result.questions?.[0]?.sourceAnswer !== 'أ') throw new Error('OCR sourceAnswer was not preserved');
          console.log('OCR explicit-answer compatibility: PASS');
          NODE_OCR_FIX2

          node --test tests/pdf-question-ocr.test.mjs

      - name: Duplex legacy and R20 compatibility gate
        shell: bash
        run: |
          set -euo pipefail
