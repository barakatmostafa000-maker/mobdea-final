      - name: Capacitor Android sync with recovery
        shell: bash
        run: |
          set -euo pipefail
          rm -rf android/capacitor-cordova-android-plugins
          rm -f android/app/capacitor.build.gradle android/capacitor.settings.gradle

          set +e
          npx cap sync android
          SYNC_RC=$?
          set -e

          if [ "$SYNC_RC" -ne 0 ] \
             || [ ! -s android/capacitor-cordova-android-plugins/cordova.variables.gradle ] \
             || [ ! -s android/app/capacitor.build.gradle ]; then
            npx cap update android
            npx cap copy android
          fi

          test -s android/app/src/main/assets/public/index.html
          test -s android/capacitor-cordova-android-plugins/cordova.variables.gradle
          test -s android/app/capacitor.build.gradle
          test -s android/capacitor.settings.gradle
          grep -Fq "cordova.variables.gradle" android/app/capacitor.build.gradle

      - name: Close Android API 23 lint regressions
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY_ANDROID_API23'
          from pathlib import Path

          path = Path("android/app/src/main/java/com/mobdea/education/ocr/R20PageOcrPlugin.java")
          if not path.is_file():
              raise SystemExit(f"Missing OCR plugin: {path}")

          text = path.read_text(encoding="utf-8")

          old_method = (
              "    private String read(File file) throws Exception {\n"
              "        return new String(Files.readAllBytes(file.toPath()), StandardCharsets.UTF_8).trim();\n"
              "    }"
          )

          new_method = (
              "    private String read(File file) throws Exception {\n"
              "        try (java.io.InputStream in = new java.io.FileInputStream(file);\n"
              "             java.io.ByteArrayOutputStream out = new java.io.ByteArrayOutputStream()) {\n"
              "            byte[] buffer = new byte[8192];\n"
              "            int n;\n"
              "            while ((n = in.read(buffer)) != -1) {\n"
              "                out.write(buffer, 0, n);\n"
              "            }\n"
              "            return new String(out.toByteArray(), StandardCharsets.UTF_8).trim();\n"
              "        }\n"
              "    }"
          )

          if old_method in text:
              text = text.replace(old_method, new_method, 1)
          elif new_method in text:
              pass
          else:
              raise SystemExit(
                  "R20PageOcrPlugin.read(File) changed unexpectedly; refusing blind Android edit"
              )

          text = text.replace("import java.nio.file.Files;\n", "")
          path.write_text(text, encoding="utf-8")

          forbidden = ["java.nio.file.Files", "Files.readAllBytes", "file.toPath()"]
          remaining = [token for token in forbidden if token in text]
          if remaining:
              raise SystemExit(
                  "API-26 file I/O remains in OCR plugin: " + ", ".join(remaining)
              )

          required = [
              "java.io.InputStream in = new java.io.FileInputStream(file)",
              "java.io.ByteArrayOutputStream out = new java.io.ByteArrayOutputStream()",
              "while ((n = in.read(buffer)) != -1)",
              "StandardCharsets.UTF_8",
          ]
          missing = [token for token in required if token not in text]
          if missing:
              raise SystemExit(
                  "API-23-safe OCR file reader contract incomplete: " + ", ".join(missing)
              )

          print("R20 OCR Android file reader is API-23-safe: PASS")
          PY_ANDROID_API23

          ! grep -Fq "java.nio.file.Files" android/app/src/main/java/com/mobdea/education/ocr/R20PageOcrPlugin.java
          ! grep -Fq "Files.readAllBytes" android/app/src/main/java/com/mobdea/education/ocr/R20PageOcrPlugin.java
          ! grep -Fq "file.toPath()" android/app/src/main/java/com/mobdea/education/ocr/R20PageOcrPlugin.java

      - name: Verify last-green Android runtime toolchain
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          BT="$SDK/build-tools/35.0.0"

          test -n "$SDK"
          test -s "$SDK/platforms/android-35/android.jar"
          test -x "$BT/aapt"
          test -x "$BT/apksigner"
          test -x "$BT/zipalign"

          java -version 2>&1 | tee /tmp/r20-java-version.txt
          node --version | tee /tmp/r20-node-version.txt

          (
            cd android
            chmod +x gradlew
            ./gradlew --version
          ) 2>&1 | tee /tmp/r20-gradle-version.txt

          grep -Eq 'Gradle[[:space:]]+8\.11\.1' /tmp/r20-gradle-version.txt

          # Gradle itself proves the Android project/configuration loads.
          # This replaces brittle literal greps against build.gradle formatting.
          (
            cd android
            ./gradlew --no-daemon :app:tasks --all
          ) 2>&1 | tee /tmp/r20-gradle-project-load.log

          "$BT/aapt" version | tee /tmp/r20-aapt-version.txt
          "$BT/apksigner" --version | tee /tmp/r20-apksigner-version.txt

          # Help output is diagnostic only; some versions return non-zero for -h.
          "$BT/zipalign" -h > /tmp/r20-zipalign-help.txt 2>&1 || true

          echo "Last-green Android runtime toolchain: PASS"

      - name: Android Java compile gate
        shell: bash
        working-directory: android
        run: |
          set -euo pipefail
          chmod +x gradlew

          set +e
          ./gradlew --no-daemon :app:compileDebugJavaWithJavac --stacktrace 2>&1 | tee /tmp/r20-java-compile.log
          JAVA_RC=${PIPESTATUS[0]}
          set -e

          if [ "$JAVA_RC" -ne 0 ]; then
            echo "::group::Java compiler error summary"
            grep -nE '(^|: )(error:|cannot find symbol|symbol:|location:)' /tmp/r20-java-compile.log || true
            echo "::endgroup::"
            exit "$JAVA_RC"
          fi

          echo "Android Java compile: PASS"

      - name: Android debug unit test gate
        shell: bash
        working-directory: android
        run: |
          set -euo pipefail
          chmod +x gradlew

          set +e
          ./gradlew --no-daemon testDebugUnitTest --stacktrace 2>&1 | tee /tmp/r20-unit-test.log
          TEST_RC=${PIPESTATUS[0]}
          set -e

          if [ "$TEST_RC" -ne 0 ]; then
            echo "::group::Android unit-test failure summary"
            grep -nE 'FAILED|FAILURE:|There were failing tests|Execution failed for task|error:|Exception' /tmp/r20-unit-test.log || true
            echo "::endgroup::"
            exit "$TEST_RC"
          fi

          echo "Android debug unit tests: PASS"

      - name: Android lintDebug gate
        shell: bash
        working-directory: android
        run: |
          set -euo pipefail
          chmod +x gradlew

          set +e
          ./gradlew --no-daemon lintDebug --stacktrace 2>&1 | tee /tmp/r20-lint-debug.log
          LINT_RC=${PIPESTATUS[0]}
          set -e

          if [ "$LINT_RC" -ne 0 ]; then
            echo "::group::Android lint failure summary"
            grep -nE 'Error:|Fatal|NewApi|requires API|MissingPermission|WrongThread|UnsafeOptInUsageError|Execution failed for task|FAILURE:' /tmp/r20-lint-debug.log || true
            echo "::endgroup::"

            echo "::group::Full Android lint text report"
            while IFS= read -r report; do
              echo "===== $report ====="
              cat "$report" || true
            done < <(find app/build -type f -name 'lint-results-debug.txt' -print 2>/dev/null | sort)
            echo "::endgroup::"

            exit "$LINT_RC"
          fi

          echo "Android lintDebug: PASS"

      - name: Build debug APK
        shell: bash
        working-directory: android
        run: |
          set -euo pipefail
          chmod +x gradlew

          set +e
          ./gradlew --no-daemon clean :app:assembleDebug --stacktrace 2>&1 | tee /tmp/r20-assemble-debug.log
          BUILD_RC=${PIPESTATUS[0]}
          set -e

          if [ "$BUILD_RC" -ne 0 ]; then
            echo "::group::Android assemble failure summary"
            grep -nE 'FAILED|FAILURE:|Execution failed for task|error:|AAPT2|DexArchive|Duplicate class|Manifest merger failed|Could not resolve' /tmp/r20-assemble-debug.log || true
            echo "::endgroup::"
            exit "$BUILD_RC"
          fi

          test -s app/build/outputs/apk/debug/app-debug.apk
          echo "Android debug APK build: PASS"

      - name: Verify final APK identity signature and alignment
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          BT="$SDK/build-tools/35.0.0"
          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"
          test -x "$BT/aapt"
          test -x "$BT/apksigner"
          test -x "$BT/zipalign"

          "$BT/aapt" dump badging "$APK" > /tmp/apk-badging.txt
          head -30 /tmp/apk-badging.txt

          grep -Fq "package: name='com.mobdea.education'" /tmp/apk-badging.txt
          grep -Fq "versionCode='$EXPECTED_VERSION_CODE'" /tmp/apk-badging.txt
          grep -Fq "versionName='$EXPECTED_VERSION_NAME'" /tmp/apk-badging.txt

          unzip -l "$APK" > /tmp/apk-files.txt
          grep -Fq "assets/public/index.html" /tmp/apk-files.txt

          unzip -t "$APK" 2>&1 | tee /tmp/apk-unzip-test.log

          "$BT/apksigner" verify --verbose --print-certs "$APK" 2>&1 | tee /tmp/apksigner.txt
          "$BT/zipalign" -c -v 4 "$APK" 2>&1 | tee /tmp/zipalign.txt

          sha256sum "$APK" | tee /tmp/apk.sha256
          echo "Final R20 APK verification: PASS"

      - name: Package final R20 result
        shell: bash
        run: |
          set -euo pipefail
          OUT="/tmp/mobdea-r20-final"
          rm -rf "$OUT"
          mkdir -p "$OUT"

          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          FINAL_APK="$OUT/mobdea-r20-final-10.14.1-v118-debug.apk"

          test -s "$APK"
          cp "$APK" "$FINAL_APK"
          test -s "$FINAL_APK"
          cmp -s "$APK" "$FINAL_APK"

          sha256sum "$FINAL_APK" > "$OUT/mobdea-r20-final-10.14.1-v118-debug.sha256"

          cp /tmp/apk-badging.txt "$OUT/APK-BADGING.txt"
          cp /tmp/apksigner.txt "$OUT/APK-SIGNATURE.txt"
          cp /tmp/zipalign.txt "$OUT/APK-ZIPALIGN.txt"
          cp /tmp/apk-unzip-test.log "$OUT/APK-INTEGRITY.txt"
          cp /tmp/apk-files.txt "$OUT/APK-FILES.txt"

          git diff --check > "$OUT/GIT-DIFF-CHECK.txt" 2>&1 || true
          git diff --binary > "$OUT/R20-FINAL-SOURCE.patch" 2>/dev/null || true

          cat > "$OUT/FINAL-VERIFICATION.txt" <<'VERIFY'
          R20 FINAL FROM LAST GREEN R19 V6 FIX8
          Baseline: cd7e7cd597af23ca1169e1f19c3ac954727c3f2d
          Last green R19 V6 run: 32714480207
          R20 source release SHA256: 03804eefcfa7b8c2284dfb56303b7ff187af672036f041f41f267dd4283f653c
          VersionName: 10.14.1
          VersionCode: 118
          Final Android build shape: clean :app:assembleDebug
          APK package/version: verified with aapt
          APK archive integrity: verified with unzip -t
          APK signature: verified with apksigner
          APK alignment: verified with zipalign -c -v 4
          VERIFY

          echo "Final R20 package: PASS"

      - name: Upload final R20 APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobdea-r20-final-from-last-green-fix8-v118
          path: /tmp/mobdea-r20-final/*
          if-no-files-found: error
          retention-days: 30

      - name: Collect failure diagnostics
        if: failure()
        shell: bash
        run: |
          set +e
          OUT="/tmp/mobdea-r20-final-failure"
          mkdir -p "$OUT"

          for log in             /tmp/r20-java-compile.log             /tmp/r20-unit-test.log             /tmp/r20-lint-debug.log             /tmp/r20-assemble-debug.log             /tmp/apk-badging.txt             /tmp/apk-files.txt             /tmp/apk-unzip-test.log             /tmp/apksigner.txt             /tmp/zipalign.txt             /tmp/apk.sha256             /tmp/r20-gradle-version.txt             /tmp/r20-gradle-project-load.log             /tmp/r20-java-version.txt             /tmp/r20-node-version.txt             /tmp/r20-aapt-version.txt             /tmp/r20-apksigner-version.txt             /tmp/r20-zipalign-help.txt; do
            if [ -f "$log" ]; then
              cp "$log" "$OUT/$(basename "$log")"
            fi
          done

          git status --short > "$OUT/git-status.txt" 2>&1
          git diff --check > "$OUT/git-diff-check.txt" 2>&1
          git diff --binary > "$OUT/current.patch" 2>&1
          cp /tmp/r20-tar-list.txt "$OUT/r20-tar-list.txt" 2>/dev/null || true

          if [ -d android/app/build/reports ]; then
            find android/app/build/reports -maxdepth 4 -type f -print > "$OUT/android-reports-list.txt" 2>&1
          fi

          if [ -d android/app/build/test-results/testDebugUnitTest ]; then
            mkdir -p "$OUT/test-results"
            cp -R android/app/build/test-results/testDebugUnitTest/. "$OUT/test-results/" 2>/dev/null || true
          fi

          if [ -d android/app/build/reports/tests/testDebugUnitTest ]; then
            mkdir -p "$OUT/unit-test-report"
            cp -R android/app/build/reports/tests/testDebugUnitTest/. "$OUT/unit-test-report/" 2>/dev/null || true
          fi

          find android/app/build -type f \( -name 'lint-results-debug.txt' -o -name 'lint-results-debug.html' \) -print 2>/dev/null |
          while IFS= read -r report; do
            cp "$report" "$OUT/$(basename "$report")" 2>/dev/null || true
          done

          if [ -s android/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk "$OUT/partial-app-debug.apk"
          fi

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mobdea-r20-final-from-last-green-fix8-failure
          path: /tmp/mobdea-r20-final-failure/*
          if-no-files-found: ignore
          retention-days: 14
