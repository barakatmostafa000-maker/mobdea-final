          grep -Fq 'MAX_ASSET_BYTES = 200 * 1024 * 1024' src/services/cloudSync.js
          grep -Fq 'android:largeHeap="true"' android/app/src/main/AndroidManifest.xml
          # Normalize only patched source text endings before Git's whitespace gate.
          # This keeps git diff --check strict while removing accidental blank EOF lines
          # introduced by cumulative patch payloads.
          python3 <<'PY_NORMALIZE_EOF'
          from pathlib import Path
          import subprocess

          allowed = {'.css', '.js', '.jsx', '.mjs', '.json', '.yml', '.yaml', '.html', '.xml', '.java', '.gradle'}
          changed = subprocess.check_output(
              ['git', 'diff', '--name-only', '--diff-filter=ACMR'],
              text=True,
          ).splitlines()
          for rel in changed:
              path = Path(rel)
              if not path.is_file() or path.suffix.lower() not in allowed:
                  continue
              raw = path.read_text(encoding='utf-8')
              lines = raw.splitlines()
              while lines and not lines[-1].strip():
                  lines.pop()
              cleaned = '\n'.join(line.rstrip() for line in lines) + ('\n' if lines else '')
              if cleaned != raw:
                  path.write_text(cleaned, encoding='utf-8')
          PY_NORMALIZE_EOF

          git add -N src/styles/r19-fix8-native.css src/config/r19Fix8.js tests/r19-fix8-integrity.test.mjs scripts/r19-fix8-browser-smoke.mjs
          git diff --check

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Full Fix7 Fix8 source and functional verification
        shell: bash
        run: |
          set -euo pipefail
          npx prettier --write \
            src/main.jsx \
            src/App.jsx \
            src/services/pwaUpdate.js \
            src/services/cloudSync.js \
            src/pages/ClassMode.jsx \
            src/pages/ContentLibrary.jsx \
            src/pages/MapChallenge.jsx \
            src/pages/StudentCards.jsx \
            src/components/classmode/PdfCanvasPreview.jsx \
            src/hooks/usePdfPage.js \
            src/services/r19InteractionFixes.js \
            src/styles/r19-user-fix7.css \
            src/styles/r19-fix8-native.css \
            src/config/r19Fix7.js \
            src/config/r19Fix8.js \
            tests/r19-fix8-integrity.test.mjs \
            scripts/r19-fix8-browser-smoke.mjs
          node --check src/services/r19InteractionFixes.js
          node --check scripts/r19-fix8-browser-smoke.mjs
          node --test tests/r19-fix8-integrity.test.mjs
          node --test \
            tests/cloud-worker.test.mjs \
            tests/student-portal-sync.test.mjs \
            tests/auto-backup.test.mjs \
            tests/backup.test.mjs \
            tests/pdf-question-ocr.test.mjs \
            tests/geography-maps.test.mjs \
            tests/student-card-printing-r14.test.mjs \
            tests/question-rotation.test.mjs \
            tests/gamification.test.mjs \
            tests/student-ranking.test.mjs
          npm run lint
          npm run verify:static
          npm run build
          git diff --check

      - name: Tablet browser smoke test for Class Mode
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/r19-fix8-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/ >/dev/null
          R19_SMOKE_URL=http://127.0.0.1:4173 node scripts/r19-fix8-browser-smoke.mjs
          test -s r19-fix8-smoke/tablet-1280x800.png
          test -s r19-fix8-smoke/tablet-1920x1080.png

      - name: Sync Capacitor Android
        shell: bash
        run: |
          set -euo pipefail
          npx cap sync android
          if grep -Fq '@tesseract.js-data/' android/app/build.gradle; then
            echo 'Duplicate Android Tesseract asset sourceSet remains.' >&2
            exit 1
          fi

      - name: Install hash-pinned Tesseract 3.04 Cube pack
        shell: bash
        run: |
          set -euo pipefail
          DEST="android/app/src/main/assets/tess304"
          BASE="https://raw.githubusercontent.com/tesseract-ocr/tessdata/3.04.00"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          declare -A EXPECTED=(
            ["ara.traineddata"]="916200c13339f81f3b04a83ceeca7d023d70c81e"
            ["ara.cube.bigrams"]="524d5908c5900178640836ab1d24e9476e6759aa"
            ["ara.cube.fold"]="ae213c70ba834dd8d2a515d6917506275caef0f4"
            ["ara.cube.lm"]="0c94223f1870f98839a41deaff590bd0a0f46d00"
            ["ara.cube.nn"]="4e3c952a7607f73cacc1f9ada23ffd2408c662d8"
            ["ara.cube.params"]="b06e24d8380f2a238e608c6d934ce52ad38dcae3"
            ["ara.cube.size"]="6d10090f390ed0d47c275b0811b63d2f1fb817b8"
            ["ara.cube.word-freq"]="aab2db4056f020f98cac2dcd3d1a91d71543ed0f"
            ["eng.traineddata"]="9f4704c9c54910e0953fd9a7e34a1a3f18829664"
            ["eng.cube.bigrams"]="3929380ee9d8193c5d7aa8eac0a9c2c2e3f5037e"
            ["eng.cube.fold"]="ac96315ce04c5fdf3be82704e37197599de6807e"
            ["eng.cube.lm"]="de0c085c00d4f4d191605c9ad97f67cd2926062f"
            ["eng.cube.nn"]="c7e3a14be217e9b68bb9c34908b46b790200d5db"
            ["eng.cube.params"]="ce9e2c720430efeba23dccf67913327e70de5c71"
            ["eng.cube.size"]="5f840a893e4a53d2ed535ed8f0d49d4f7351a862"
            ["eng.cube.word-freq"]="b5347b286a619f07792dcf3221c5676630ede683"
            ["eng.tesseract_cube.nn"]="ec483e0ac6175d1daadfa596cb157fa42229be10"
          )
          FILES=("ara.traineddata" "ara.cube.bigrams" "ara.cube.fold" "ara.cube.lm" "ara.cube.nn" "ara.cube.params" "ara.cube.size" "ara.cube.word-freq" "eng.traineddata" "eng.cube.bigrams" "eng.cube.fold" "eng.cube.lm" "eng.cube.nn" "eng.cube.params" "eng.cube.size" "eng.cube.word-freq" "eng.tesseract_cube.nn")
          for file in "${FILES[@]}"; do
            curl --fail --location --retry 5 --retry-all-errors --retry-delay 2               --connect-timeout 30 --max-time 300 "$BASE/$file" -o "$DEST/$file"
            test -s "$DEST/$file"
            actual="$(git hash-object "$DEST/$file")"
            test "$actual" = "${EXPECTED[$file]}"
          done
          test "$(find "$DEST" -maxdepth 1 -type f | wc -l)" -eq 17

      - name: Android test lint and APK build
        shell: bash
        working-directory: android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon :app:mergeDebugAssets --stacktrace
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug --stacktrace
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          test "$(unzip -Z1 "$APK" | grep -c '^assets/tess304/' || true)" -eq 17
          grep -Fq 'versionCode 118' app/build.gradle
          grep -Fq 'versionName "10.14.1"' app/build.gradle

      - name: Package final Fix8 output
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r19-fix8-output
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          cp "$APK" /tmp/r19-fix8-output/mobdea-r19-fix8-10.14.1-v118-debug.apk
          sha256sum /tmp/r19-fix8-output/mobdea-r19-fix8-10.14.1-v118-debug.apk > /tmp/r19-fix8-output/mobdea-r19-fix8-10.14.1-v118-debug.sha256
          git diff --binary > /tmp/r19-fix8-output/R19-FIX8-applied.patch
          git diff --stat > /tmp/r19-fix8-output/R19-FIX8-stat.txt
          cp -r r19-fix8-smoke /tmp/r19-fix8-output/smoke-screenshots
          cat > /tmp/r19-fix8-output/VERIFICATION.txt <<'EOF_VERIFY'
          R19 FIX8 VERIFIED SCOPE:
          - Fix7 visual repairs preserved: compact board tools, full ink area, cards, students split, map grid, duplex print, dashboard, OCR
          - Android Class Mode black-screen defenses: stale service-worker cleanup + one-shot lazy chunk recovery
          - Android version bumped to 10.14.1 / versionCode 118 to trigger native cache cleanup
          - PDF raster memory bounded; teacher visual zoom remains 6x
          - Android hardware acceleration + large heap safety net enabled
          - Cloud sync client/server asset ceiling aligned to 200MB
          - Automatic cross-device sync triggers and revision conflict protection verified
          - Cloud worker sync/asset encryption tests passed
          - Online lesson room/join/mic approval/encrypted signaling worker test passed
          - Teacher live panel health check + public student URL wiring verified
          - Tablet Class Mode smoke passed at 1280x800 and 1920x1080
          - Web lint/static verification/build passed
          - Android unit/lint/assembleDebug passed
          - OCR model pack 17/17 hash-pinned files present in APK
          NOTE: sync/live require a valid workspace token saved in Settings; no secret is hard-coded into the APK.
          EOF_VERIFY

      - name: Upload R19 Fix8 APK
        uses: actions/upload-artifact@v4
        with:
          name: mobdea-r19-final-release-fix8-1-apk
          path: /tmp/r19-fix8-output/*
          if-no-files-found: error
          retention-days: 30

      - name: Final summary
        if: always()
        shell: bash
        run: |
          echo "## R19 Final Release Fix8.1" >> "$GITHUB_STEP_SUMMARY"
          echo "- Baseline: $R19_BASE_COMMIT" >> "$GITHUB_STEP_SUMMARY"
          echo "- Preserves Fix3/Fix6/Fix7, adds native Class Mode black-screen recovery, sync/live functional gates" >> "$GITHUB_STEP_SUMMARY"
          echo "- Artifact: mobdea-r19-final-release-fix8-1-apk" >> "$GITHUB_STEP_SUMMARY"
