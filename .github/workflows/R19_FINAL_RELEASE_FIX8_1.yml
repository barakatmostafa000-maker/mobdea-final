name: R19 Final Release Fix8.1 APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r19-final-release-fix8-1-apk
  cancel-in-progress: true

jobs:
  build-r19-fix8-1:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      CI: "true"
      R19_BASE_COMMIT: cd7e7cd597af23ca1169e1f19c3ac954727c3f2d
      R19_TARGETED_BACKUP: /tmp/r19-targeted-backup

    steps:
      - name: Checkout exact reviewed R19 source
        uses: actions/checkout@v4
        with:
          ref: cd7e7cd597af23ca1169e1f19c3ac954727c3f2d
          fetch-depth: 1

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore cumulative R19 Fix3 payload used by Fix6
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$R19_BASE_COMMIT"
          rm -rf /tmp/r19-final-bundle "$R19_TARGETED_BACKUP"
          mkdir -p /tmp/r19-final-bundle/payload
          git fetch origin main --depth=1
          git show FETCH_HEAD:.github/workflows/R19_FINAL_RELEASE_FIX3.yml > /tmp/r19-fix3-source.yml

          python3 <<'PY_PAYLOAD'
          from pathlib import Path
          import base64, re
          source = Path('/tmp/r19-fix3-source.yml').read_text(encoding='utf-8')
          targets = [
              ('apply','APPLY',Path('/tmp/r19-final-bundle/apply_r19_targeted_fixes.py')),
              ('verify','VERIFY',Path('/tmp/r19-final-bundle/verify_r19_targeted_fixes.py')),
              ('css','CSS',Path('/tmp/r19-final-bundle/payload/r19-targeted-fixes.css')),
              ('test','TEST',Path('/tmp/r19-final-bundle/payload/r19-targeted-integrity.test.mjs')),
          ]
          for key, tag, destination in targets:
              pattern = rf"cat > /tmp/{key}\.b64 <<'EOF_{tag}'\n(.*?)\n\s*EOF_{tag}"
              match = re.search(pattern, source, re.S)
              if not match:
                  raise SystemExit(f'missing embedded {key} payload')
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_bytes(base64.b64decode(''.join(match.group(1).split())))
          PY_PAYLOAD

          python3 -m py_compile /tmp/r19-final-bundle/apply_r19_targeted_fixes.py
          python3 /tmp/r19-final-bundle/apply_r19_targeted_fixes.py

          # Same source-set cleanup retained from Fix6.
          python3 <<'PY_COMPAT'
          from pathlib import Path
          import re
          path = Path('android/app/build.gradle')
          text = path.read_text(encoding='utf-8')
          pattern = re.compile(
              r"\n\s*sourceSets\s*\{.*?@tesseract\.js-data/ara/4\.0\.0_best_int.*?"
              r"@tesseract\.js-data/eng/4\.0\.0_best_int.*?\n\s*\}\s*\n",
              re.S,
          )
          text = pattern.sub("\n", text, count=1)
          path.write_text(text.rstrip("\r\n") + "\n", encoding='utf-8')
          PY_COMPAT

