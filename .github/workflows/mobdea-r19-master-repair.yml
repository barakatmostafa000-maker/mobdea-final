name: R19 Master Repair

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/mobdea-r19-master-repair.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mobdea-r19-master-repair
  cancel-in-progress: false

jobs:
  repair-build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout R19 unified
        uses: actions/checkout@v4
        with:
          ref: r19-unified
          fetch-depth: 0

      - name: Configure Git
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin r19-unified
          git switch -C r19-unified origin/r19-unified

      - name: Apply Phase 1 source repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          from pathlib import Path

          patch = base64.b64decode('')
          Path('/tmp/r19_phase1_patch.py').write_bytes(patch)
          Path('src/data/countryCards.js').write_bytes(base64.b64decode(''))
          Path('src/styles/r19-classmode-phase1.css').write_bytes(base64.b64decode(''))
          Path('tests/r19-classmode-phase1.test.mjs').write_bytes(base64.b64decode(''))

          code = compile(patch, '/tmp/r19_phase1_patch.py', 'exec')
          exec(code, {'__name__': '__main__'})
          PY

      - name: Apply remaining R19 master repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          from pathlib import Path
          patch = base64.b64decode('')
          Path('/tmp/r19_master_patch.py').write_bytes(patch)
          Path('src/styles/r19-master-repairs.css').write_bytes(base64.b64decode(''))
          Path('tests/r19-master-repairs.test.mjs').write_bytes(base64.b64decode(''))
          code = compile(patch, '/tmp/r19_master_patch.py', 'exec')
          exec(code, {'__name__': '__main__'})
          PY

      - name: Set final R19 app version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYVER'
          import json
          from pathlib import Path

          package_path = Path('package.json')
          package = json.loads(package_path.read_text(encoding='utf-8'))
          package['version'] = '10.14.0'
          package.setdefault('mobdea', {})['versionCode'] = 117
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          lock_path = Path('package-lock.json')
          lock = json.loads(lock_path.read_text(encoding='utf-8'))
          lock['version'] = '10.14.0'
          if isinstance(lock.get('packages'), dict) and isinstance(lock['packages'].get(''), dict):
              lock['packages']['']['version'] = '10.14.0'
          lock_path.write_text(json.dumps(lock, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PYVER
          node scripts/sync-version.mjs
          grep -n 'versionName\|versionCode' android/app/build.gradle

      - name: Bundle offline Arabic board fonts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/fonts public/fonts/licenses

          curl --retry 4 --retry-delay 2 --fail --location --silent --show-error \
            'https://raw.githubusercontent.com/google/fonts/main/ofl/notonaskharabic/NotoNaskhArabic%5Bwght%5D.ttf' \
            -o public/fonts/NotoNaskhArabic-Variable.ttf
          curl --retry 4 --retry-delay 2 --fail --location --silent --show-error \
            'https://raw.githubusercontent.com/google/fonts/main/ofl/notokufiarabic/NotoKufiArabic%5Bwght%5D.ttf' \
            -o public/fonts/NotoKufiArabic-Variable.ttf
          curl --retry 4 --retry-delay 2 --fail --location --silent --show-error \
            'https://raw.githubusercontent.com/google/fonts/main/ofl/arefruqaa/ArefRuqaa-Regular.ttf' \
            -o public/fonts/ArefRuqaa-Regular.ttf
          curl --retry 4 --retry-delay 2 --fail --location --silent --show-error \
            'https://raw.githubusercontent.com/google/fonts/main/ofl/arefruqaa/ArefRuqaa-Bold.ttf' \
            -o public/fonts/ArefRuqaa-Bold.ttf
          curl --retry 4 --retry-delay 2 --fail --location --silent --show-error \
            'https://raw.githubusercontent.com/google/fonts/main/ofl/amiri/Amiri-Regular.ttf' \
            -o public/fonts/Amiri-Regular.ttf
          curl --retry 4 --retry-delay 2 --fail --location --silent --show-error \
            'https://raw.githubusercontent.com/google/fonts/main/ofl/amiri/Amiri-Bold.ttf' \
            -o public/fonts/Amiri-Bold.ttf
          curl --retry 4 --retry-delay 2 --fail --location --silent --show-error \
            'https://raw.githubusercontent.com/google/fonts/main/ofl/reemkufi/ReemKufi%5Bwght%5D.ttf' \
            -o public/fonts/ReemKufi-Variable.ttf

          # Preserve the OFL license texts in the app source tree.
          curl --retry 4 --retry-delay 2 --fail --location --silent --show-error \
            'https://raw.githubusercontent.com/google/fonts/main/ofl/notonaskharabic/OFL.txt' \
            -o public/fonts/licenses/OFL-NotoNaskhArabic.txt
          curl --retry 4 --retry-delay 2 --fail --location --silent --show-error \
            'https://raw.githubusercontent.com/google/fonts/main/ofl/notokufiarabic/OFL.txt' \
            -o public/fonts/licenses/OFL-NotoKufiArabic.txt
          curl --retry 4 --retry-delay 2 --fail --location --silent --show-error \
            'https://raw.githubusercontent.com/google/fonts/main/ofl/arefruqaa/OFL.txt' \
            -o public/fonts/licenses/OFL-ArefRuqaa.txt
          curl --retry 4 --retry-delay 2 --fail --location --silent --show-error \
            'https://raw.githubusercontent.com/google/fonts/main/ofl/amiri/OFL.txt' \
            -o public/fonts/licenses/OFL-Amiri.txt
          curl --retry 4 --retry-delay 2 --fail --location --silent --show-error \
            'https://raw.githubusercontent.com/google/fonts/main/ofl/reemkufi/OFL.txt' \
            -o public/fonts/licenses/OFL-ReemKufi.txt

          for font in public/fonts/*.ttf; do
            test "$(stat -c%s "$font")" -gt 50000
          done

          python3 - <<'PYFONT'
          from pathlib import Path
          css_path = Path('src/styles/r19-master-repairs.css')
          css = css_path.read_text(encoding='utf-8')
          lines = [
              "/* Offline Arabic fonts: board font choices remain distinct without network access. */",
              "@font-face { font-family:'Noto Naskh Arabic'; src:url('/fonts/NotoNaskhArabic-Variable.ttf') format('truetype'); font-style:normal; font-weight:100 900; font-display:swap; }",
              "@font-face { font-family:'Noto Kufi Arabic'; src:url('/fonts/NotoKufiArabic-Variable.ttf') format('truetype'); font-style:normal; font-weight:100 900; font-display:swap; }",
              "@font-face { font-family:'Aref Ruqaa'; src:url('/fonts/ArefRuqaa-Regular.ttf') format('truetype'); font-style:normal; font-weight:400; font-display:swap; }",
              "@font-face { font-family:'Aref Ruqaa'; src:url('/fonts/ArefRuqaa-Bold.ttf') format('truetype'); font-style:normal; font-weight:700 900; font-display:swap; }",
              "@font-face { font-family:'Amiri'; src:url('/fonts/Amiri-Regular.ttf') format('truetype'); font-style:normal; font-weight:400; font-display:swap; }",
              "@font-face { font-family:'Amiri'; src:url('/fonts/Amiri-Bold.ttf') format('truetype'); font-style:normal; font-weight:700 900; font-display:swap; }",
              "@font-face { font-family:'Reem Kufi'; src:url('/fonts/ReemKufi-Variable.ttf') format('truetype'); font-style:normal; font-weight:400 900; font-display:swap; }",
              "",
          ]
          block = '\n'.join(lines) + '\n'
          if "url('/fonts/NotoNaskhArabic-Variable.ttf')" not in css:
              css_path.write_text(block + css, encoding='utf-8')
          PYFONT

          ls -lh public/fonts/*.ttf

      - name: Bundle Arabic OCR models into Android
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/assets
          curl --retry 4 --retry-delay 2 --fail --location --silent --show-error \
            https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/ara.traineddata \
            | gzip -9 > android/app/src/main/assets/ara.traineddata.gz
          curl --retry 4 --retry-delay 2 --fail --location --silent --show-error \
            https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/eng.traineddata \
            | gzip -9 > android/app/src/main/assets/eng.traineddata.gz
          test "$(stat -c%s android/app/src/main/assets/ara.traineddata.gz)" -gt 100000
          test "$(stat -c%s android/app/src/main/assets/eng.traineddata.gz)" -gt 100000
          ls -lh android/app/src/main/assets/*.traineddata.gz

      - name: Focused R19 master tests
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/r19-classmode-phase1.test.mjs
          node --test tests/r19-master-repairs.test.mjs

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Full web verification
        run: npm run verify

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Android tests lint and APK
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug --stacktrace

      - name: Verify APK and source
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk /tmp/mobdea-r19-master-debug.apk
          sha256sum /tmp/mobdea-r19-master-debug.apk | tee /tmp/r19-phase1-apk.sha256

      - name: Commit complete R19 repairs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist android/.gradle android/app/build android/build
          git add -A src public android tests package.json package-lock.json .next-apk-version

          if git diff --cached --quiet; then
            echo "No source changes to commit."
          else
            git commit -m "Complete R19 classroom media maps OCR and management repairs"
          fi
          git push origin HEAD:r19-unified

      - name: Upload complete R19 APK
        uses: actions/upload-artifact@v4
        with:
          name: mobdea-r19-master-repair-debug-apk
          path: /tmp/mobdea-r19-master-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Master repair summary
        if: always()
        shell: bash
        run: |
          {
            echo "## R19 Master Repair"
            echo "- True presentation fullscreen"
            echo "- Full-width board canvas with intact historical artwork"
            echo "- Educational-card drag fix and smaller resize"
            echo "- Auto-fitting educational/country card text"
            echo "- Country capital/language metadata"
            echo "- Real Mobdea logo symbol"
            echo "- Corrected handwriting size +/- controls"
            echo "- Return to pen after cards/symbols"
            echo "- PDF/OCR JavaScript + Android path aligned to 500 MB"
            echo "- OCR page fields editable and Arabic/English OCR models bundled"
            echo "- PowerPoint native parser with browser fallback"
            echo "- Always-visible previous/next media controls"
            echo "- One collapsible class-management drawer"
            echo "- Persistent per-session progress + most improved"
            echo "- Lesson maps restored as map-first pan/scroll surfaces"
            echo "- Map Challenge rebuilt visually around ProfessionalMap"
            if [ -f /tmp/r19-phase1-apk.sha256 ]; then
              echo "- APK SHA256: $(cut -d' ' -f1 /tmp/r19-phase1-apk.sha256)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
