name: Mobdea R19 Rescue Recovery

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/R19_RESCUE_RECOVERY.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: mobdea-r19-rescue-recovery
  cancel-in-progress: false

env:
  MAIN_BASE_SHA: d557648e39f66acea404eadc291ba607d2cf439f
  V14_BASE_SHA: a987214c1662535857c7a93e766a46b9cb3cf070
  BOOTSTRAP_BLOB: 064003426b06e8fad625e48136de0f88a4d32615
  MASTER_BLOB: e2cea3bf1c04667b69d027989bc5dd5a0ef62c79
  FINAL_BLOB: 4f2d284618e28b13d03fec5571ca59a8c08a294a

jobs:
  rescue-repair-verify-build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Pin source, back up current R19, and create deterministic recovery tree
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch --no-tags origin main v14-working r19-unified

          git cat-file -e "${MAIN_BASE_SHA}^{commit}"
          git cat-file -e "${V14_BASE_SHA}^{commit}"
          git cat-file -e "${BOOTSTRAP_BLOB}^{blob}"
          git cat-file -e "${MASTER_BLOB}^{blob}"
          git cat-file -e "${FINAL_BLOB}^{blob}"

          ORIGINAL_R19_SHA="$(git rev-parse origin/r19-unified)"
          BACKUP_BRANCH="r19-backup-before-recovery-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          echo "ORIGINAL_R19_SHA=${ORIGINAL_R19_SHA}" >> "$GITHUB_ENV"
          echo "BACKUP_BRANCH=${BACKUP_BRANCH}" >> "$GITHUB_ENV"

          echo "Current r19-unified: ${ORIGINAL_R19_SHA}"
          echo "Pinned main foundation: ${MAIN_BASE_SHA}"
          echo "Pinned v14 runtime: ${V14_BASE_SHA}"

          # Non-destructive safety copy before any later branch replacement.
          git push origin "${ORIGINAL_R19_SHA}:refs/heads/${BACKUP_BRANCH}"

          # Rebuild from known immutable inputs instead of replaying patches onto
          # a partially-mutated r19-unified tree.
          git switch --detach "${MAIN_BASE_SHA}"
          git switch -C r19-rescue-work

          rm -rf src public android cloud-worker tests scripts

          git checkout "${V14_BASE_SHA}" -- \
            src \
            public \
            android \
            cloud-worker \
            tests \
            scripts \
            package.json \
            package-lock.json \
            .next-apk-version \
            capacitor.config.json \
            index.html \
            join.html \
            vite.config.js

          rm -rf \
            dist \
            node_modules \
            android/.gradle \
            android/app/build \
            android/build

          test -f src/pages/ClassMode.jsx
          test -f src/services/cloudSync.js
          test -f src/services/liveClass.js
          test -f cloud-worker/worker.js
          test -f android/app/build.gradle

      - name: Extract immutable repair stages
        shell: bash
        run: |
          set -euo pipefail

          git cat-file blob "$BOOTSTRAP_BLOB" > /tmp/r19-bootstrap.yml
          git cat-file blob "$MASTER_BLOB" > /tmp/r19-master.yml
          git cat-file blob "$FINAL_BLOB" > /tmp/r19-final.yml

          ruby -ryaml - <<'RUBY'
          def steps_from(path)
            doc = YAML.safe_load(File.read(path), aliases: true)
            (doc.fetch('jobs')).values.flat_map { |job| job.fetch('steps', []) }
          end

          groups = [
            [
              '/tmp/r19-bootstrap.yml',
              'bootstrap',
              [
                'Repair native asset staging and raise textbook PDF capacity to 500 MB',
                'Add focused R19 regression checks',
              ],
            ],
            [
              '/tmp/r19-master.yml',
              'master',
              [
                'Apply Phase 1 source repairs',
                'Apply remaining R19 master repairs',
                'Set final R19 app version',
                'Bundle offline Arabic board fonts',
                'Bundle Arabic OCR models into Android',
              ],
            ],
            [
              '/tmp/r19-final.yml',
              'final',
              [
                'Enforce final R19 release identity',
                'Apply final classroom sync and live hardening',
              ],
            ],
          ]

          sequence = 0
          groups.each do |path, group, wanted|
            steps = steps_from(path)
            wanted.each do |name|
              step = steps.find { |item| item['name'] == name }
              abort("Missing pinned #{group} repair stage: #{name}") unless step && step['run']
              sequence += 1
              out = format('/tmp/r19-rescue-stage-%02d.sh', sequence)
              File.write(out, step['run'])
              puts format('%02d. [%s] %s', sequence, group, name)
            end
          end
          RUBY

          test "$(find /tmp -maxdepth 1 -name 'r19-rescue-stage-*.sh' | wc -l)" -eq 9

      - name: Apply complete pinned R19 repair stack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r19-rescue-logs

          for script in /tmp/r19-rescue-stage-*.sh; do
            base="$(basename "$script" .sh)"
            echo "=== Running ${base} ==="
            bash -euo pipefail "$script" 2>&1 | tee "/tmp/r19-rescue-logs/${base}.log"
          done

      - name: Enforce final R19 contracts idempotently
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          # ------------------------------------------------------------
          # 1) Final selected-student contract.
          # Remove only point controls tied to each roster row.
          # ------------------------------------------------------------
          class_path = Path("src/pages/ClassMode.jsx")
          text = class_path.read_text(encoding="utf-8")

          button_pattern = re.compile(
              r"<button\b(?:(?!<button\b|</button>)[\s\S])*?</button>",
              re.S,
          )

          removed = {"minus": 0, "row_plus": 0}

          def filter_button(match):
              block = match.group(0)
              if "student-point-minus" in block or "adjustPoints(student, -1)" in block:
                  removed["minus"] += 1
                  return ""
              if (
                  "adjustPoints(student, 1)" in block
                  and "selected-student-point-plus" not in block
              ):
                  removed["row_plus"] += 1
                  return ""
              return block

          text = button_pattern.sub(filter_button, text)
          class_path.write_text(text, encoding="utf-8")

          final = class_path.read_text(encoding="utf-8")
          required = [
              "selected-student-point-plus",
              "selected-student-praise",
              "selected-student-warning",
          ]
          for token in required:
              count = final.count(f'data-testid="{token}"')
              if count != 1:
                  raise SystemExit(f"{token}: expected exactly one final control, found {count}")
          if "student-point-minus" in final or "adjustPoints(student, -1)" in final:
              raise SystemExit("Obsolete student minus point control still exists.")
          print("Selected-student contract enforced:", removed)

          # ------------------------------------------------------------
          # 2) Final board contract: contain, never legacy fill assertion.
          # ------------------------------------------------------------
          old = "object-fit: fill !important"
          new = "object-fit: contain !important"
          changed = []
          for test_path in sorted(Path("tests").glob("r19-*.test.mjs")):
              source = test_path.read_text(encoding="utf-8")
              if old in source:
                  test_path.write_text(source.replace(old, new), encoding="utf-8")
                  changed.append(str(test_path))
          print("Updated stale board assertions:", changed)

          master_css_path = Path("src/styles/r19-master-repairs.css")
          if not master_css_path.exists():
              raise SystemExit("R19 master repair stylesheet is missing.")
          master_css = master_css_path.read_text(encoding="utf-8")
          marker_at = master_css.rfind("MOBDEA_R19_FINAL")
          if marker_at < 0:
              raise SystemExit("MOBDEA_R19_FINAL marker is missing.")
          if new not in master_css[marker_at:]:
              raise SystemExit("Final board contain contract is missing after MOBDEA_R19_FINAL.")

          # ------------------------------------------------------------
          # 3) Make R19 identity source-of-truth stable across npm verify.
          # ------------------------------------------------------------
          package_path = Path("package.json")
          package = json.loads(package_path.read_text(encoding="utf-8"))
          package["version"] = "10.14.0"
          package.setdefault("mobdea", {})["versionCode"] = 117
          package_path.write_text(
              json.dumps(package, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          lock_path = Path("package-lock.json")
          lock = json.loads(lock_path.read_text(encoding="utf-8"))
          lock["version"] = "10.14.0"
          if isinstance(lock.get("packages"), dict) and isinstance(lock["packages"].get(""), dict):
              lock["packages"][""]["version"] = "10.14.0"
          lock_path.write_text(
              json.dumps(lock, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          sync_path = Path("scripts/sync-version.mjs")
          sync = sync_path.read_text(encoding="utf-8")
          sync, count = re.subn(
              r"export const RELEASE_TAG = '[^']+';",
              "export const RELEASE_TAG = 'R19';",
              sync,
              count=1,
          )
          if count != 1:
              raise SystemExit("Unable to enforce R19 RELEASE_TAG in sync-version.mjs.")
          sync_path.write_text(sync, encoding="utf-8")
          PY

          node scripts/sync-version.mjs

          test "$(node -p "require('./package.json').version")" = "10.14.0"
          test "$(node -p "require('./package.json').mobdea.versionCode")" = "117"
          grep -q "APP_VERSION = '10.14.0'" src/config/version.js
          grep -q "APP_VERSION_CODE = 117" src/config/version.js
          grep -q "RELEASE_TAG = 'R19'" src/config/version.js
          grep -q "RELEASE_TAG = 'R19'" scripts/sync-version.mjs
          ! grep -q "RELEASE_TAG = 'R18'" scripts/sync-version.mjs
          grep -q 'versionCode 117' android/app/build.gradle
          grep -q 'versionName "10.14.0"' android/app/build.gradle

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Format generated R19 source and verify formatting
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t changed_files < <(
            {
              git diff --name-only --diff-filter=ACMRT
              git ls-files --others --exclude-standard
            } | sort -u
          )

          prettier_files=()
          for file in "${changed_files[@]}"; do
            [[ -f "$file" ]] || continue
            case "$file" in
              *.js|*.jsx|*.mjs|*.cjs|*.ts|*.tsx|*.json|*.css|*.scss|*.less|*.html|*.md|*.yml|*.yaml)
                prettier_files+=("$file")
                ;;
            esac
          done

          if ((${#prettier_files[@]})); then
            npx --yes prettier@3.6.2 --write "${prettier_files[@]}"
          fi

          node scripts/check-format.mjs
          git diff --check

      - name: Focused R19 regression tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r19-rescue-logs

          tests=(
            tests/r19-media-native-regression.test.mjs
            tests/r19-classmode-phase1.test.mjs
            tests/r19-master-repairs.test.mjs
            tests/r19-final-v3.test.mjs
            tests/cloud-worker.test.mjs
            tests/student-portal-sync.test.mjs
          )

          for test_file in "${tests[@]}"; do
            test -f "$test_file"
            log="/tmp/r19-rescue-logs/$(basename "$test_file").log"
            node --test "$test_file" 2>&1 | tee "$log"
          done

      - name: Full web verification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r19-rescue-logs
          npm run verify 2>&1 | tee /tmp/r19-rescue-logs/npm-verify.log

      - name: Verify complete R19 source contracts
        shell: bash
        run: |
          set -euo pipefail

          node - <<'NODE'
          const fs = require('node:fs');

          const read = (path) => fs.readFileSync(path, 'utf8');
          const exists = (path) => fs.existsSync(path);
          const fail = (message) => { throw new Error(message); };
          const requireToken = (source, token, label) => {
            if (!source.includes(token)) fail(`Missing R19 contract: ${label || token}`);
          };

          const pkg = JSON.parse(read('package.json'));
          if (pkg.version !== '10.14.0') fail(`Expected 10.14.0, got ${pkg.version}`);
          if (Number(pkg.mobdea?.versionCode) !== 117) fail(`Expected versionCode 117, got ${pkg.mobdea?.versionCode}`);

          const version = read('src/config/version.js');
          const syncVersion = read('scripts/sync-version.mjs');
          const gradle = read('android/app/build.gradle');
          const classMode = read('src/pages/ClassMode.jsx');
          const live = read('src/services/liveClass.js');
          const worker = read('cloud-worker/worker.js');
          const cloudSync = read('src/services/cloudSync.js');
          const masterCss = read('src/styles/r19-master-repairs.css');

          requireToken(version, "APP_VERSION = '10.14.0'", 'web app version');
          requireToken(version, 'APP_VERSION_CODE = 117', 'web version code');
          requireToken(version, "RELEASE_TAG = 'R19'", 'R19 release tag');
          requireToken(syncVersion, "RELEASE_TAG = 'R19'", 'stable sync-version R19 tag');
          if (syncVersion.includes("RELEASE_TAG = 'R18'")) fail('sync-version still contains R18 release tag');
          requireToken(gradle, 'versionCode 117', 'Android versionCode');
          requireToken(gradle, 'versionName "10.14.0"', 'Android versionName');

          for (const token of [
            'selected-student-point-plus',
            'selected-student-praise',
            'selected-student-warning',
          ]) {
            const count = (classMode.match(new RegExp(`data-testid="${token}"`, 'g')) || []).length;
            if (count !== 1) fail(`${token} count is ${count}, expected 1`);
          }
          if (classMode.includes('student-point-minus')) fail('student-point-minus still exists');

          for (const [token, label] of [
            ['defaultIceServers(configLike = {})', 'TURN-aware ICE configuration'],
            ['MOBDEA_RUNTIME_ICE', 'runtime ICE persistence'],
            ['rememberLiveIceServers(created)', 'created room ICE persistence'],
            ['rememberLiveIceServers(joined)', 'joined room ICE persistence'],
          ]) requireToken(live, token, label);

          requireToken(worker, 'MOBDEA_TURN_URLS', 'worker TURN URLs');
          requireToken(cloudSync, 'MAX_ASSET_BYTES = 500 * 1024 * 1024', '500 MB cloud asset limit');

          const finalMarker = masterCss.slice(masterCss.lastIndexOf('MOBDEA_R19_FINAL'));
          requireToken(finalMarker, 'object-fit: contain !important', 'non-stretched historical board');
          if (finalMarker.includes('object-fit: fill !important')) fail('Legacy fill board contract survived');

          for (const path of [
            'src/styles/r19-classmode-phase1.css',
            'src/styles/r19-master-repairs.css',
            'src/data/countryCards.js',
            'src/components/maps/LessonMapStudio.jsx',
            'src/components/maps/ProfessionalMap.jsx',
            'src/pages/MapChallenge.jsx',
            'android/app/src/main/java/com/mobdea/education/MainActivity.java',
            'android/app/src/main/java/com/mobdea/education/ocr/MobdeaPdfOcrPlugin.java',
            'android/app/src/main/java/com/mobdea/education/pdf/MobdeaPdfRendererPlugin.java',
          ]) {
            if (!exists(path)) fail(`Required source file missing: ${path}`);
          }

          for (const path of [
            'public/fonts/NotoNaskhArabic-Variable.ttf',
            'public/fonts/NotoKufiArabic-Variable.ttf',
            'public/fonts/ArefRuqaa-Regular.ttf',
            'public/fonts/Amiri-Regular.ttf',
            'public/fonts/ReemKufi-Variable.ttf',
            'android/app/src/main/assets/ara.traineddata.gz',
            'android/app/src/main/assets/eng.traineddata.gz',
          ]) {
            if (!exists(path) || fs.statSync(path).size < 50000) {
              fail(`Required offline asset missing/incomplete: ${path}`);
            }
          }

          console.log('R19 complete source contracts: PASS');
          NODE

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Android clean, unit tests, lint, and debug APK
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r19-rescue-logs
          chmod +x gradlew
          ./gradlew --no-daemon clean testDebugUnitTest lintDebug assembleDebug --stacktrace \
            2>&1 | tee /tmp/r19-rescue-logs/android-gradle.log

      - name: Final three-pass validation and stage APK
        shell: bash
        run: |
          set -euo pipefail

          echo "PASS 1 - source integrity"
          git diff --check
          node scripts/check-format.mjs

          echo "PASS 2 - final focused regression"
          node --test tests/r19-final-v3.test.mjs
          node --test tests/r19-media-native-regression.test.mjs
          node --test tests/r19-classmode-phase1.test.mjs
          node --test tests/r19-master-repairs.test.mjs
          node --test tests/cloud-worker.test.mjs
          node --test tests/student-portal-sync.test.mjs

          echo "PASS 3 - real Android artifact"
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p /tmp/r19-rescue-artifacts
          cp "$APK" /tmp/r19-rescue-artifacts/mobdea-r19-recovered-debug.apk
          sha256sum /tmp/r19-rescue-artifacts/mobdea-r19-recovered-debug.apk \
            | tee /tmp/r19-rescue-artifacts/mobdea-r19-recovered-debug.sha256
          ls -lh /tmp/r19-rescue-artifacts/mobdea-r19-recovered-debug.apk

      - name: Commit verified recovery and replace R19 safely
        shell: bash
        run: |
          set -euo pipefail

          # Do not commit generated build/cache output.
          rm -rf \
            dist \
            node_modules \
            android/.gradle \
            android/app/build \
            android/build

          git add -A \
            src \
            public \
            android \
            cloud-worker \
            tests \
            scripts \
            package.json \
            package-lock.json \
            .next-apk-version \
            capacitor.config.json \
            index.html \
            join.html \
            vite.config.js

          if git diff --cached --quiet; then
            echo "No recovery source changes were staged."
          else
            git commit -m "Recover R19 from pinned baseline and verify complete build"
          fi

          # The backup branch was created before any destructive action.
          # The lease prevents overwriting r19-unified if somebody changed it
          # while this run was testing.
          git push \
            --force-with-lease="refs/heads/r19-unified:${ORIGINAL_R19_SHA}" \
            origin HEAD:refs/heads/r19-unified

      - name: Upload recovered R19 APK
        uses: actions/upload-artifact@v4
        with:
          name: mobdea-r19-recovered-debug-apk
          path: |
            /tmp/r19-rescue-artifacts/mobdea-r19-recovered-debug.apk
            /tmp/r19-rescue-artifacts/mobdea-r19-recovered-debug.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload rescue diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobdea-r19-rescue-diagnostics
          path: /tmp/r19-rescue-logs
          if-no-files-found: warn
          retention-days: 7

      - name: Recovery summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Mobdea R19 Rescue Recovery"
            echo "- Immutable main foundation: ${MAIN_BASE_SHA}"
            echo "- Immutable v14 runtime: ${V14_BASE_SHA}"
            echo "- Original r19-unified: ${ORIGINAL_R19_SHA:-unknown}"
            echo "- Safety backup: ${BACKUP_BRANCH:-not-created}"
            echo "- Target identity: 10.14.0 / 117 / R19"
            echo "- Source replacement occurs only after web + Android verification and a real APK."
            if [ -f /tmp/r19-rescue-artifacts/mobdea-r19-recovered-debug.sha256 ]; then
              echo "- APK SHA256: $(cut -d' ' -f1 /tmp/r19-rescue-artifacts/mobdea-r19-recovered-debug.sha256)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
