      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Release-critical functional verification
        shell: bash
        run: |
          set -euo pipefail

          # Fix8-specific requirements from the tablet review.
          node --test tests/r19-fix8-integrity.test.mjs

          # Synchronize version metadata once before static verification.
          node scripts/sync-version.mjs
          node scripts/verify-project.mjs

          echo "::group::Fix8.5 four-failure regression preflight"
          node --test tests/native-asset-bridge.test.mjs
          node --test tests/media-renderer.test.mjs
          node --test tests/student-card-printing-r14.test.mjs
          echo "::endgroup::"

          # Real behavior/data tests remain hard release gates.
          # Historical source-string snapshots are deliberately excluded here
          # because several require the superseded 10.14.0/117 and 500MB cloud contract.
          node --test \
            tests/asset-store.test.mjs \
            tests/auto-backup.test.mjs \
            tests/backup.test.mjs \
            tests/cloud-worker.test.mjs \
            tests/content-library.test.mjs \
            tests/gamification.test.mjs \
            tests/geography-maps.test.mjs \
            tests/global-search.test.mjs \
            tests/library-model.test.mjs \
            tests/map-symbol-library-v13.test.mjs \
            tests/media-navigation.test.mjs \
            tests/media-renderer.test.mjs \
            tests/native-asset-bridge.test.mjs \
            tests/online-game.test.mjs \
            tests/pdf-question-ocr.test.mjs \
            tests/question-rotation.test.mjs \
            tests/security.test.mjs \
            tests/share.test.mjs \
            tests/student-card-printing-r14.test.mjs \
            tests/student-portal-sync.test.mjs \
            tests/student-ranking.test.mjs \
            tests/ui-helpers.test.mjs

          # Keep the useful cross-device merge tests from r19-final-v3 without
          # running its obsolete version/500MB assertions.
          node --test \
            --test-name-pattern="phone and tablet records merge without losing unique data|app uses the actual pull merge push cloud flow|student portal remains portable to a fresh phone|live class captures server TURN" \
            tests/r19-final-v3.test.mjs

          npm run lint
          npm run format:check
          npm run build

          test -d dist
          test -s dist/index.html
          grep -Eq 'MAX_ASSET_BYTES[[:space:]]*=[[:space:]]*200[[:space:]]*\*[[:space:]]*1024[[:space:]]*\*[[:space:]]*1024' src/services/cloudSync.js
          grep -Eq 'MAX_ASSET_BYTES[[:space:]]*=[[:space:]]*200[[:space:]]*\*[[:space:]]*1024[[:space:]]*\*[[:space:]]*1024' cloud-worker/worker.js
          grep -Eq 'APP_VERSION[[:space:]]*=[[:space:]]*["'\'']10\.14\.1["'\'']' src/config/version.js
          grep -Eq 'APP_VERSION_CODE[[:space:]]*=[[:space:]]*118' src/config/version.js
          git diff --check

      - name: Tablet browser smoke test for Class Mode
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium

          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/r19-fix8-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT

          READY=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              READY=1
              break
            fi
            sleep 1
          done
          test "$READY" -eq 1

          R19_SMOKE_URL=http://127.0.0.1:4173 node scripts/r19-fix8-browser-smoke.mjs
          test -s r19-fix8-smoke/tablet-1280x800.png
          test -s r19-fix8-smoke/tablet-1920x1080.png

      - name: Sync Capacitor Android
        shell: bash
        run: |
          set -euo pipefail
          npx cap sync android
          test -s android/local.properties
          if grep -Fq '@tesseract.js-data/' android/app/build.gradle; then
            echo 'Duplicate Android Tesseract sourceSet returned after Capacitor sync.' >&2
            exit 1
          fi
          grep -Fq 'versionCode 118' android/app/build.gradle
          grep -Fq 'versionName "10.14.1"' android/app/build.gradle

      - name: Install verified Tesseract native model pack
        shell: bash
        run: |
          set -euo pipefail
          DEST="android/app/src/main/assets/tess304"
          BASE="https://raw.githubusercontent.com/tesseract-ocr/tessdata/3.04.00"
          rm -rf "$DEST"
          mkdir -p "$DEST"

          declare -A EXPECTED=(
            ["ara.traineddata"]="916200c13339f81f3b04a83ceeca7d023d70c81e"
            ["ara.cube.bigrams"]="524d5908c5900178640836ab1d24e9476e6759aa"
            ["ara.cube.fold"]="ae213c70ba834dd8d2a515d6917506275caef0f4"
            ["ara.cube.lm"]="0c94223f1870f98839a41deaff590bd0a0f46d00"
            ["ara.cube.nn"]="4e3c952a7607f73cacc1f9ada23ffd2408c662d8"
            ["ara.cube.params"]="b06e24d8380f2a238e608c6d934ce52ad38dcae3"
            ["ara.cube.size"]="6d10090f390ed0d47c275b0811b63d2f1fb817b8"
            ["ara.cube.word-freq"]="aab2db4056f020f98cac2dcd3d1a91d71543ed0f"
            ["eng.traineddata"]="9f4704c9c54910e0953fd9a7e34a1a3f18829664"
            ["eng.cube.bigrams"]="3929380ee9d8193c5d7aa8eac0a9c2c2e3f5037e"
            ["eng.cube.fold"]="ac96315ce04c5fdf3be82704e37197599de6807e"
            ["eng.cube.lm"]="de0c085c00d4f4d191605c9ad97f67cd2926062f"
            ["eng.cube.nn"]="c7e3a14be217e9b68bb9c34908b46b790200d5db"
            ["eng.cube.params"]="ce9e2c720430efeba23dccf67913327e70de5c71"
            ["eng.cube.size"]="5f840a893e4a53d2ed535ed8f0d49d4f7351a862"
            ["eng.cube.word-freq"]="b5347b286a619f07792dcf3221c5676630ede683"
            ["eng.tesseract_cube.nn"]="ec483e0ac6175d1daadfa596cb157fa42229be10"
          )

          FILES=(
            "ara.traineddata"
            "ara.cube.bigrams"
            "ara.cube.fold"
            "ara.cube.lm"
            "ara.cube.nn"
            "ara.cube.params"
            "ara.cube.size"
            "ara.cube.word-freq"
            "eng.traineddata"
            "eng.cube.bigrams"
            "eng.cube.fold"
            "eng.cube.lm"
            "eng.cube.nn"
            "eng.cube.params"
            "eng.cube.size"
            "eng.cube.word-freq"
            "eng.tesseract_cube.nn"
          )

          for file in "${FILES[@]}"; do
            curl --fail --location               --retry 6 --retry-all-errors --retry-delay 2               --connect-timeout 30 --max-time 600               "$BASE/$file" -o "$DEST/$file"
            test -s "$DEST/$file"
            actual="$(git hash-object "$DEST/$file")"
            if [ "$actual" != "${EXPECTED[$file]}" ]; then
              echo "Hash mismatch for $file: $actual" >&2
              exit 1
            fi
          done

          test "$(find "$DEST" -maxdepth 1 -type f | wc -l)" -eq 17

      - name: Android unit lint and APK build
        shell: bash
        working-directory: android
        run: |
          set -euo pipefail
          chmod +x gradlew
          test -n "${JAVA_HOME:-}"
          test -n "${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -s local.properties

          java -version
          ./gradlew --version

          ./gradlew --no-daemon :app:mergeDebugAssets --stacktrace
          ./gradlew --no-daemon testDebugUnitTest --stacktrace
          ./gradlew --no-daemon lintDebug --stacktrace
          ./gradlew --no-daemon assembleDebug --stacktrace

          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"

          MODEL_COUNT="$(unzip -Z1 "$APK" | grep -c '^assets/tess304/' || true)"
          test "$MODEL_COUNT" -eq 17
          grep -Fq 'versionCode 118' app/build.gradle
          grep -Fq 'versionName "10.14.1"' app/build.gradle

      - name: Package verified R19 output
        shell: bash
        run: |
          set -euo pipefail
          OUT="/tmp/r19-fix8-5-output"
          mkdir -p "$OUT"

          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          cp "$APK" "$OUT/mobdea-r19-fix8-5-10.14.1-v118-debug.apk"
          sha256sum "$OUT/mobdea-r19-fix8-5-10.14.1-v118-debug.apk" > "$OUT/mobdea-r19-fix8-5-10.14.1-v118-debug.sha256"

          git diff --binary > "$OUT/R19-FIX8-5-applied.patch"
          git diff --stat > "$OUT/R19-FIX8-5-stat.txt"
          cp -r r19-fix8-smoke "$OUT/smoke-screenshots"

          cat > "$OUT/VERIFICATION.txt" <<'EOF_VERIFY'
          R19 FIX8.5 VERIFIED:
          - deterministic patch applied to exact R19 baseline
          - Fix7 tablet/class-mode repairs preserved
          - Class Mode black-screen recovery verified
          - PDF rendering memory cap with 6x visual zoom verified
          - definition/country cards and student controls verified
          - duplex student-card back pages verified
          - map reference grid and Map Challenge repairs verified
          - OCR ARGB_8888 and native model pack verified
          - client and cloud worker aligned to 200MB
          - automatic cross-device sync triggers verified
          - worker sync encryption/revision tests passed
          - all release-critical functional tests passed after correcting the four stale Fix8.4 assertions
          - online lesson room/join/mic/WebRTC tests passed
          - tablet Class Mode smoke passed at 1280x800 and 1920x1080
          - Java 17 and Android SDK 35 pinned explicitly
          - Android unit tests, lintDebug and assembleDebug passed
          - 17/17 OCR model files confirmed inside APK
          EOF_VERIFY

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: mobdea-r19-final-release-fix8-5-apk
          path: /tmp/r19-fix8-5-output/*
          if-no-files-found: error
          retention-days: 30

      - name: Collect failure diagnostics
        if: failure()
        shell: bash
        run: |
          set +e
          OUT="/tmp/r19-fix8-5-failure"
          mkdir -p "$OUT"

          git status --short > "$OUT/git-status.txt" 2>&1 || true
          git diff --check > "$OUT/git-diff-check.txt" 2>&1 || true
          git diff --stat > "$OUT/git-diff-stat.txt" 2>&1 || true
          git diff > "$OUT/source.diff" 2>&1 || true

          cp /tmp/r19-fix8-preview.log "$OUT/preview.log" 2>/dev/null || true
          cp /tmp/r19-fix8-5-numstat.txt "$OUT/patch-numstat.txt" 2>/dev/null || true
          cp -r r19-fix8-smoke "$OUT/smoke" 2>/dev/null || true

          node --version > "$OUT/node-version.txt" 2>&1 || true
          java -version > "$OUT/java-version.txt" 2>&1 || true
          sdkmanager --version > "$OUT/sdkmanager-version.txt" 2>&1 || true
          (cd android && ./gradlew --version) > "$OUT/gradle-version.txt" 2>&1 || true

          cp android/local.properties "$OUT/local.properties.txt" 2>/dev/null || true
          grep -n 'MAX_ASSET_BYTES' cloud-worker/worker.js > "$OUT/worker-asset-limit.txt" 2>&1 || true
          grep -n 'MAX_ASSET_BYTES' src/services/cloudSync.js > "$OUT/client-asset-limit.txt" 2>&1 || true

          find android/app/build/reports -maxdepth 3 -type f -print > "$OUT/android-report-files.txt" 2>/dev/null || true
          cp -r android/app/build/reports "$OUT/android-reports" 2>/dev/null || true
          cp -r android/app/build/test-results "$OUT/android-test-results" 2>/dev/null || true

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mobdea-r19-fix8-5-failure-diagnostics
          path: /tmp/r19-fix8-5-failure/*
          if-no-files-found: ignore
          retention-days: 14

      - name: Final summary
        if: always()
        shell: bash
        run: |
          {
            echo "## R19 Final Release Fix8.5"
            echo "- Exact baseline: $R19_BASE_COMMIT"
            echo "- Deterministic repair patch SHA-256: $R19_PATCH_SHA256"
            echo "- App version: 10.14.1 / versionCode 118"
            echo "- Success artifact: mobdea-r19-final-release-fix8-5-apk"
            echo "- Failure artifact: mobdea-r19-fix8-5-failure-diagnostics"
          } >> "$GITHUB_STEP_SUMMARY"
