name: R19 Final Release Fix8.5 APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r19-final-release-fix8-5-apk
  cancel-in-progress: true

jobs:
  build-r19-fix8-5:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      CI: "true"
      R19_BASE_COMMIT: cd7e7cd597af23ca1169e1f19c3ac954727c3f2d
      R19_PATCH_SHA256: cdde2432847080323e32430c86e5a717877a6f54a5c21a32820072c1761c7332

    steps:
      - name: Checkout exact R19 baseline
        uses: actions/checkout@v4
        with:
          ref: cd7e7cd597af23ca1169e1f19c3ac954727c3f2d
          fetch-depth: 1

      - name: Verify exact clean baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$R19_BASE_COMMIT"
          test -z "$(git status --porcelain)"
          test -f package.json
          test -d android

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK 35
        uses: android-actions/setup-android@v3

      - name: Pin Android SDK path and packages
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          printf 'sdk.dir=%s\n' "$SDK" > android/local.properties
          test -s android/local.properties
          test -x "$JAVA_HOME/bin/java"
          java -version
          node --version

      - name: Apply deterministic reviewed R19 repair patch
