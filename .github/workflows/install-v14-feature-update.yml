name: Install V14 Progress and Country Metadata

on:
  push:
    branches:
      - v14-working
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-feature-update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout v14-working
        uses: actions/checkout@v4
        with:
          ref: v14-working
          fetch-depth: 0

      - name: Verify patch archive
        shell: bash
        run: |
          set -euo pipefail
          test -f mobdea-v14-feature-update.zip
          echo "bad6622882a748171708b1c5dc48f7486e1fa47783e96e1f9da6d2dad6c20f3c  mobdea-v14-feature-update.zip" | sha256sum -c -

      - name: Apply feature update
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/mobdea-v14-feature-update
          mkdir -p /tmp/mobdea-v14-feature-update
          unzip -q mobdea-v14-feature-update.zip -d /tmp/mobdea-v14-feature-update
          test -f /tmp/mobdea-v14-feature-update/v14-feature-update/src/pages/ClassMode.jsx
          test -f /tmp/mobdea-v14-feature-update/v14-feature-update/src/data/countryCards.js
          rsync -a /tmp/mobdea-v14-feature-update/v14-feature-update/ ./

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify feature update and production build
        run: npm run verify

      - name: Commit verified feature update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/ClassMode.jsx src/data/countryCards.js tests/v14-progress-country-meta.test.mjs
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Add student progress indicator and country card metadata"
          git push origin HEAD:v14-working
