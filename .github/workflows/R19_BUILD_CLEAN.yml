name: Mobdea R19 Clean Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobdea-r19-clean-build
  cancel-in-progress: true

jobs:
  verify-build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout fixed R19 source
        uses: actions/checkout@v4
        with:
          ref: r19-unified
          fetch-depth: 1

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify fixed-source identity and contracts
        shell: bash
        run: |
          set -euo pipefail

          node --input-type=module <<'NODE'
          const v = await import('./src/config/version.js');
          if (v.APP_VERSION !== '10.14.0') throw new Error(`Unexpected APP_VERSION: ${v.APP_VERSION}`);
          if (v.APP_VERSION_CODE !== 117) throw new Error(`Unexpected APP_VERSION_CODE: ${v.APP_VERSION_CODE}`);
          if (v.RELEASE_TAG !== 'R19') throw new Error(`Unexpected RELEASE_TAG: ${v.RELEASE_TAG}`);
          NODE

          test "$(node -p "require('./package.json').version")" = "10.14.0"
          test "$(node -p "require('./package.json').mobdea.versionCode")" = "117"
          grep -q 'versionCode 117' android/app/build.gradle
          grep -q 'versionName "10.14.0"' android/app/build.gradle

          test -f src/styles/r19-classmode-phase1.css
          test -f src/styles/r19-master-repairs.css
          test -f tests/r19-classmode-phase1.test.mjs
          test -f tests/r19-master-repairs.test.mjs
          test -f tests/r19-final-v3.test.mjs

          grep -q 'data-testid="selected-student-point-plus"' src/pages/ClassMode.jsx
          grep -q 'data-testid="selected-student-praise"' src/pages/ClassMode.jsx
          grep -q 'data-testid="selected-student-warning"' src/pages/ClassMode.jsx
          ! grep -q 'student-point-minus' src/pages/ClassMode.jsx

          grep -q 'defaultIceServers(configLike = {})' src/services/liveClass.js
          grep -q 'MOBDEA_RUNTIME_ICE' src/services/liveClass.js
          grep -q 'rememberLiveIceServers(created)' src/services/liveClass.js
          grep -q 'rememberLiveIceServers(joined)' src/services/liveClass.js

          grep -q 'MAX_ASSET_BYTES = 500 \* 1024 \* 1024' src/services/cloudSync.js
          grep -q 'MAX_ASSET_BYTES = 500 \* 1024 \* 1024' cloud-worker/worker.js
          grep -q 'MOBDEA_TURN_URLS' cloud-worker/worker.js

          grep -q 'MOBDEA_R19_FINAL' src/styles/r19-master-repairs.css
          grep -q 'object-fit: contain !important' src/styles/r19-master-repairs.css
          ! grep -Eq 'object-fit[[:space:]]*:[[:space:]]*fill[[:space:]]*!important' src/styles/r19-master-repairs.css
          git diff --check

      - name: Verify deterministic version synchronization
        shell: bash
        run: |
          set -euo pipefail
          node scripts/sync-version.mjs
          git diff --exit-code -- \
            src/config/version.js \
            android/app/build.gradle \
            public/update.manifest.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Focused R19 verification
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-format.mjs
          node --test tests/r19-media-native-regression.test.mjs
          node --test tests/r19-classmode-phase1.test.mjs
          node --test tests/r19-master-repairs.test.mjs
          node --test tests/r19-final-v3.test.mjs
          node --test tests/cloud-worker.test.mjs
          node --test tests/student-portal-sync.test.mjs

      - name: Full web verification
        run: npm run verify

      - name: Confirm verification leaves version source stable
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- \
            src/config/version.js \
            android/app/build.gradle \
            public/update.manifest.json

      - name: Sync Capacitor Android build inputs
        run: npx cap sync android

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Android unit tests lint and APK
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug --stacktrace

      - name: Verify and stage APK
        shell: bash
        run: |
          set -euo pipefail
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          mkdir -p /tmp/r19-clean-build
          cp android/app/build/outputs/apk/debug/app-debug.apk \
            /tmp/r19-clean-build/mobdea-r19-10.14.0-v117-debug.apk
          sha256sum /tmp/r19-clean-build/mobdea-r19-10.14.0-v117-debug.apk \
            > /tmp/r19-clean-build/mobdea-r19-10.14.0-v117-debug.sha256
          cat /tmp/r19-clean-build/mobdea-r19-10.14.0-v117-debug.sha256

      - name: Upload clean-build APK
        uses: actions/upload-artifact@v4
        with:
          name: mobdea-r19-clean-build
          path: /tmp/r19-clean-build
          if-no-files-found: error
          retention-days: 14

      - name: Clean build summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Mobdea R19 Clean Build"
            echo "- Source branch: r19-unified"
            echo "- Release identity: 10.14.0 / versionCode 117 / R19"
            echo "- No repair payloads, source commits, or source pushes."
            echo "- Only verification, build-input generation, tests, lint, APK assembly and artifact upload."
          } >> "$GITHUB_STEP_SUMMARY"
