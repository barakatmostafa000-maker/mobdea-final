repair-v14-feature-update.yml.name: 
on:
  workflow_dispatch:
  push:
    branches:
      - v14-working
    paths:
      - .github/workflows/repair-v14-feature-update.yml

permissions:
  contents: write

jobs:
  repair-v14:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout v14-working
        uses: actions/checkout@v4
        with:
          ref: v14-working
          fetch-depth: 0

      - name: Verify feature archive
        shell: bash
        run: |
          set -euo pipefail
          test -f mobdea-v14-feature-update.zip
          echo "bad6622882a748171708b1c5dc48f7486e1fa47783e96e1f9da6d2dad6c20f3c  mobdea-v14-feature-update.zip" | sha256sum -c -

      - name: Save known-good ClassMode baseline
        shell: bash
        run: |
          set -euo pipefail
          git show HEAD:src/pages/ClassMode.jsx > /tmp/ClassMode.baseline.jsx

      - name: Apply V14 feature archive
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/mobdea-v14-feature-update
          mkdir -p /tmp/mobdea-v14-feature-update
          unzip -q mobdea-v14-feature-update.zip -d /tmp/mobdea-v14-feature-update

          PATCH_ROOT="/tmp/mobdea-v14-feature-update/v14-feature-update"
          test -f "$PATCH_ROOT/src/pages/ClassMode.jsx"
          test -f "$PATCH_ROOT/src/data/countryCards.js"
          test -f "$PATCH_ROOT/tests/v14-progress-country-meta.test.mjs"

          rsync -a "$PATCH_ROOT"/ ./

      - name: Remove stale overlay files from the patch
        shell: bash
        run: |
          set -euo pipefail

          # The V14 update is only supposed to change these source/test files.
          # Restore every other tracked file to the exact v14-working baseline.
          git diff --name-only -z | while IFS= read -r -d '' path; do
            case "$path" in
              src/pages/ClassMode.jsx|src/data/countryCards.js|tests/v14-progress-country-meta.test.mjs|package-lock.json)
                ;;
              *)
                git restore --source=HEAD --worktree -- "$path"
                ;;
            esac
          done

          # Remove unexpected untracked overlay files, while keeping the intended new V14 test.
          git ls-files --others --exclude-standard -z | while IFS= read -r -d '' path; do
            case "$path" in
              tests/v14-progress-country-meta.test.mjs)
                ;;
              *)
                rm -rf -- "$path"
                ;;
            esac
          done

      - name: Preserve historical relief symbols in ClassMode
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          baseline_path = Path('/tmp/ClassMode.baseline.jsx')
          patched_path = Path('src/pages/ClassMode.jsx')

          baseline = baseline_path.read_text(encoding='utf-8')
          patched = patched_path.read_text(encoding='utf-8')
          marker = 'classmode-historical-symbol-row'

          if marker in patched:
              print('Historical symbol row already present.')
              raise SystemExit(0)

          def nearest_open_div(text, pos, window=1800):
              start = text.rfind('<div', max(0, pos - window), pos)
              if start < 0:
                  return None
              end = text.find('>', start)
              if end < 0 or end > pos:
                  return None
              return start, end + 1

          # Preferred repair: if the new ClassMode still renders historicalSymbolOptions,
          # attach the regression-safe class to that existing functional row.
          map_pos = patched.find('historicalSymbolOptions.map')
          if map_pos >= 0:
              bounds = nearest_open_div(patched, map_pos)
              if bounds:
                  start, end = bounds
                  tag = patched[start:end]
                  if marker not in tag:
                      m = re.search(r'className=(["\'])(.*?)\1', tag, re.S)
                      if m:
                          quote = m.group(1)
                          classes = m.group(2)
                          new_classes = (classes + ' ' + marker).strip()
                          new_tag = tag[:m.start(2)] + new_classes + tag[m.end(2):]
                      else:
                          new_tag = tag[:-1] + f' className="{marker}">'
                      patched = patched[:start] + new_tag + patched[end:]
                      patched_path.write_text(patched, encoding='utf-8')
                      print('Historical symbol row class restored on existing functional row.')

          if marker in patched_path.read_text(encoding='utf-8'):
              raise SystemExit(0)

          # Fallback: transplant the complete working historical-symbol row
          # from the branch baseline into the updated ClassMode.
          idx = baseline.find(marker)
          if idx < 0:
              raise SystemExit('Baseline ClassMode does not contain the historical symbol row.')

          start = baseline.rfind('<div', 0, idx)
          if start < 0:
              raise SystemExit('Could not locate the historical symbol row opening <div>.')

          token_re = re.compile(r'<div\b|</div>', re.I)
          depth = 0
          end = None
          for match in token_re.finditer(baseline, start):
              token = match.group(0).lower()
              if token.startswith('<div'):
                  depth += 1
              else:
                  depth -= 1
                  if depth == 0:
                      end = match.end()
                      break

          if end is None:
              raise SystemExit('Could not locate the historical symbol row closing </div>.')

          block = baseline[start:end]

          # Put it immediately before the geographical-symbol row when possible.
          anchor = patched.find('classmode-geographical-symbol-row')
          if anchor >= 0:
              insert_at = patched.rfind('<div', 0, anchor)
          else:
              geo_map = patched.find('geographicalSymbolOptions.map')
              if geo_map >= 0:
                  bounds = nearest_open_div(patched, geo_map)
                  insert_at = bounds[0] if bounds else -1
              else:
                  insert_at = -1

          if insert_at < 0:
              # Last safe fallback: place it before the first text-style row.
              text_row = patched.find('classmode-text-style-row')
              if text_row >= 0:
                  insert_at = patched.rfind('<div', 0, text_row)

          if insert_at < 0:
              raise SystemExit('Could not find a safe insertion point for the historical symbol row.')

          patched = patched[:insert_at] + block + '\n' + patched[insert_at:]
          patched_path.write_text(patched, encoding='utf-8')

          if marker not in patched:
              raise SystemExit('Historical symbol row restoration failed.')

          print('Historical symbol row transplanted from the known-good branch baseline.')
          PY

      - name: Confirm the five regressions are repaired before install
        shell: bash
        run: |
          set -euo pipefail

          grep -q "Map as MapIcon" src/pages/ContentLibrary.jsx
          grep -q "if (!question || typeof question !== 'object') return \\[\\];" src/components/classmode/ClassroomGamePanel.jsx
          grep -q "renderWebPdfBlob" src/hooks/usePdfPage.js
          python3 - <<'PY'
          from pathlib import Path
          import re

          css = Path('src/styles/v107.css').read_text(encoding='utf-8')
          assert re.search(
              r'lesson-map-studio\.tools-closed \.lesson-map-main \{\s*'
              r'grid-template-rows: minmax\(0, 1fr\) !important;',
              css,
              re.S,
          ), 'Closed map drawer regression is still present.'

          cls = Path('src/pages/ClassMode.jsx').read_text(encoding='utf-8')
          assert 'classmode-historical-symbol-row' in cls, 'Historical symbol row is still missing.'
          print('All five regression guards are present.')
          PY

      - name: Sync lockfile and install dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts
          npm ci --ignore-scripts

      - name: Verify requested V14 features
        run: node --test tests/v14-progress-country-meta.test.mjs

      - name: Run full regression suite
        run: npm test

      - name: Lint source
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Verify project static checks
        run: npm run verify:static

      - name: Build production
        run: npm run build

      - name: Commit only verified V14 changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            src/pages/ClassMode.jsx \
            src/data/countryCards.js \
            tests/v14-progress-country-meta.test.mjs \
            package-lock.json

          if git diff --cached --quiet; then
            echo "No verified source changes to commit."
            exit 0
          fi

          git commit -m "Repair V14 feature update regressions"
          git push origin HEAD:v14-working
