name: R19 FINAL Deep Review 01-14 RUN14 - Runtime Truth + P13 P14 + Android Fix

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/R19_FINAL_DEEP_REVIEW_01_14_RUN14_RUNTIME_TRUTH_ANDROID_FIXED.yml

permissions:
  contents: read
  actions: read

env:
  R19_BASE_COMMIT: cd7e7cd597af23ca1169e1f19c3ac954727c3f2d
  R19_PATCH_SHA256: cdde2432847080323e32430c86e5a717877a6f54a5c21a32820072c1761c7332
  R19_FIX3_PAYLOAD_COMMIT: 3477b1b9b7f2210823054634e4f840ff9744910c
  MOBDEA_WORKER_URL: https://mobdea-platform-api.barakatmostafa000.workers.dev
  RUN14_BUNDLE_SHA256: cfd39a2d7aec68485e541a5271540c17e0a3229c96a8c446a4e26733f15ceca2

jobs:
  r19_final_run14:
    name: RUN14 - Repairs 01-14 + full web and Android gates
    runs-on: ubuntu-24.04
    timeout-minutes: 300

    steps:

      - name: Checkout exact R19 baseline
        uses: actions/checkout@v4
        with:
          ref: ${{ env.R19_BASE_COMMIT }}
          fetch-depth: 1

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Recover exact tested R19 Fix8.13 source
        shell: bash
        run: |
          set -euo pipefail
          trap 'echo "::error::R19 recovery failed at line $LINENO: $BASH_COMMAND"' ERR

          test "$(git rev-parse HEAD)" = "$R19_BASE_COMMIT"

          HISTORICAL_COMMIT="976e70f2b20c369d512a56250b7ef0b9a02e8659"
          HISTORICAL_WORKFLOW=".github/workflows/R19_FINAL_RELEASE_FIX8_13.yml"

          echo "Fetching deterministic historical workflow source..."
          git fetch --no-tags --depth=1 origin "$HISTORICAL_COMMIT"
          git show "$HISTORICAL_COMMIT:$HISTORICAL_WORKFLOW" > /tmp/r19-fix813-historical.yml
          test -s /tmp/r19-fix813-historical.yml

          python3 - <<'PY_RECOVER_R19'
          from pathlib import Path
          import base64
          import gzip
          import hashlib
          import re

          workflow = Path("/tmp/r19-fix813-historical.yml").read_text(encoding="utf-8")
          pattern = re.compile(
              r"cat > /tmp/r19-fix8-13\.patch\.gz\.b64 <<'EOF_PATCH'\n"
              r"(?P<payload>[\s\S]*?)\n\s*EOF_PATCH"
          )
          match = pattern.search(workflow)
          if not match:
              raise SystemExit("Historical Fix8.13 patch payload block was not found.")

          payload = "".join(line.strip() for line in match.group("payload").splitlines())
          if len(payload) < 1000:
              raise SystemExit("Historical Fix8.13 patch payload is unexpectedly small.")

          compressed = base64.b64decode(payload, validate=True)
          patch = gzip.decompress(compressed)
          if len(patch) < 1000:
              raise SystemExit("Historical Fix8.13 decoded patch is unexpectedly small.")

          Path("/tmp/r19-fix8-13.patch").write_bytes(patch)
          print(f"Recovered historical patch bytes: {len(patch)}")
          print(f"Recovered historical patch SHA256: {hashlib.sha256(patch).hexdigest()}")
          PY_RECOVER_R19

          PATCH="/tmp/r19-fix8-13.patch"
          test -s "$PATCH"

          ACTUAL_PATCH_SHA="$(sha256sum "$PATCH" | awk '{print $1}')"
          echo "Expected patch SHA256: $R19_PATCH_SHA256"
          echo "Actual patch SHA256:   $ACTUAL_PATCH_SHA"
          test "$ACTUAL_PATCH_SHA" = "$R19_PATCH_SHA256"

          git apply --check "$PATCH"
          git apply "$PATCH"
          git diff --check

          test -f src/pages/ClassMode.jsx
          test -f src/main.jsx

          node - <<'NODE_R19_VERSION'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (pkg.version !== '10.14.1') throw new Error(`Unexpected recovered R19 version: ${pkg.version}`);
          if (Number(pkg.mobdea?.versionCode) !== 118) throw new Error(`Unexpected recovered R19 versionCode: ${pkg.mobdea?.versionCode}`);
          console.log('Recovered exact R19 Fix8.13 version 10.14.1 / versionCode 118');
          NODE_R19_VERSION

          grep -Fq 'CanvasOverlay' src/pages/ClassMode.jsx
          grep -Fq 'classmode-board-surface' src/pages/ClassMode.jsx
          echo "R19 Fix8.13 source recovery: PASS"

      - name: Complete historical Fix8.13 source components
        shell: bash
        run: |
          set -euo pipefail
          trap 'echo "::error::Historical R19 completion failed at line $LINENO: $BASH_COMMAND"' ERR
          test -s /tmp/r19-fix813-historical.yml

          python3 - <<'PY_HISTORICAL_STEPS'
          from pathlib import Path

          workflow = Path("/tmp/r19-fix813-historical.yml").read_text(encoding="utf-8")

          def extract_run_step(name, output):
              lines = workflow.splitlines()
              target = f"- name: {name}"
              start = next((i for i, line in enumerate(lines) if line.strip() == target), None)
              if start is None:
                  raise SystemExit(f"Historical step not found: {name}")
              run_index = next(
                  (i for i in range(start + 1, min(len(lines), start + 24)) if lines[i].strip() == "run: |"),
                  None,
              )
              if run_index is None:
                  raise SystemExit(f"Historical run block not found: {name}")
              body = []
              base_indent = len(lines[run_index]) - len(lines[run_index].lstrip())
              for line in lines[run_index + 1:]:
                  stripped = line.lstrip()
                  indent = len(line) - len(stripped)
                  if stripped.startswith("- name:") and indent <= base_indent:
                      break
                  if not line.strip():
                      body.append("")
                      continue
                  if indent <= base_indent:
                      break
                  body.append(line[base_indent + 2:] if len(line) >= base_indent + 2 else "")
              script = "\n".join(body).rstrip() + "\n"
              if len(script) < 50:
                  raise SystemExit(f"Historical run block unexpectedly short: {name}")
              Path(output).write_text(script, encoding="utf-8")

          extract_run_step("Restore omitted R19 targeted stylesheet", "/tmp/r19_restore_targeted.sh")
          extract_run_step("Install Class Mode interaction stability repair", "/tmp/r19_install_stability.sh")
          PY_HISTORICAL_STEPS

          bash -n /tmp/r19_restore_targeted.sh
          bash -n /tmp/r19_install_stability.sh
          bash /tmp/r19_restore_targeted.sh
          bash /tmp/r19_install_stability.sh

          test -s src/styles/r19-targeted-fixes.css
          test -s src/services/r19InteractionFixes.js
          grep -Fq "r19-targeted-fixes.css" src/main.jsx
          grep -Fq "r19InteractionFixes" src/main.jsx
          git diff --check
          echo "Historical Fix8.13 source components: PASS"

      - name: Repair recovered Android Gradle syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_GRADLE_FIX'
          from pathlib import Path
          path = Path('android/app/build.gradle')
          text = path.read_text(encoding='utf-8')
          bad = "    lint {\n        abortOnError true\n        checkReleaseBuilds true\n        warningsAsErrors false\n    }\n    }\n}\n\nrepositories {"
          good = "    lint {\n        abortOnError true\n        checkReleaseBuilds true\n        warningsAsErrors false\n    }\n}\n\nrepositories {"
          if bad in text:
              text = text.replace(bad, good, 1)
          elif good not in text:
              raise SystemExit('Android Gradle structure is not recognized; refusing blind edit')
          path.write_text(text, encoding='utf-8')
          PY_GRADLE_FIX
          grep -Fq 'warningsAsErrors false' android/app/build.gradle
          echo "Android Gradle syntax repair: PASS"

      - name: Validate recovered R19 10.14.1 layout
        shell: bash
        run: |
          set -euo pipefail
          test -f package.json
          test -f package-lock.json
          test -d src
          test -f vite.config.js
          test -f capacitor.config.json
          test -x android/gradlew || chmod +x android/gradlew
          test -f android/app/build.gradle
          test -f cloud-worker/worker.js
          node - <<'NODE_LAYOUT'
          const p=require('./package.json');
          if (p.version !== '10.14.1' || Number(p.mobdea?.versionCode) !== 118) throw new Error(`Wrong R19 state ${p.version}/${p.mobdea?.versionCode}`);
          for (const s of ['build','test','lint','format:check','verify:static']) if (!p.scripts?.[s]) throw new Error(`Missing script ${s}`);
          console.log('EXACT_R19_LAYOUT_OK',p.version,p.mobdea.versionCode);
          NODE_LAYOUT
          git diff --check

      - name: Materialize self-contained reviewed Repairs 01-14 bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/mobdea-run14-repairs /tmp/r19-run14-logs
          mkdir -p /tmp/mobdea-run14-repairs /tmp/r19-run14-logs
