          [ "$SOURCE_SANITY_PRE" = success ] || failed=1
          printf 'source_sanity_post=%s\n' "$SOURCE_SANITY_POST"
          [ "$SOURCE_SANITY_POST" = success ] || failed=1
          printf 'android_sdk=%s\n' "$ANDROID_SDK"
